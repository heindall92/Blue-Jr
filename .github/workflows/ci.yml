name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # auditoría semanal de dependencias

permissions:
  contents: read

jobs:
  test:
    name: Build, tests y E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: dist/index.html y bluejr.html están al día con src/
        run: npm run check
      - name: Tests unitarios (motor, casos, repositorio)
        run: npm test
      - name: Navegador para E2E
        run: npx playwright install --with-deps chromium
      - name: Tests E2E (Chromium)
        run: npm run test:e2e
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bluejr-dist
          path: dist
          retention-days: 30
