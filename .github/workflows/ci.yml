name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # auditoría semanal de dependencias

permissions:
  contents: read

jobs:
  test:
    name: Build, tests y E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: dist/index.html y bluejr.html están al día con src/
        run: npm run check
      - name: Tests unitarios (motor, casos, repositorio)
        run: npm test
      - name: Navegador para E2E
        run: npx playwright install --with-deps chromium
      - name: pdfinfo y pdftotext para comprobar el historial en PDF
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Tests E2E (Chromium)
        run: npm run test:e2e
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bluejr-dist
          path: dist
          retention-days: 30
