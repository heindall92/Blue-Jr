/* Cuenta atrás hasta el turno de las 08:00 (o turno en curso hasta las 14:30), en hora local. */
function textoReloj(ahora = new Date()) {
  const m = ahora.getHours() * 60 + ahora.getMinutes();
  if (m >= 8 * 60 && m < 14 * 60 + 30) return T('reloj_en_curso');
  const inicio = new Date(ahora); inicio.setHours(8, 0, 0, 0);
  if (m >= 8 * 60) inicio.setDate(inicio.getDate() + 1);
  const s = Math.max(0, Math.floor((inicio - ahora) / 1000));
  const hms = [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60].map((n) => String(n).padStart(2, '0')).join(':');
  return T('reloj_falta', { t: hms });
}

/* Escena de la portada: amanece en Norte Logística. Al cargar, el sol sale, la sede sube y sus
   ventanas se encienden una a una; la del SOC late y de ella sale la burbuja del último ticket.
   Decorativa (aria-hidden): la información está en el texto de la portada. */
const ESCENA = (() => {
  const r = BJ.azar(2026);
  const estrellas = Array.from({ length: 26 }, () => [Math.round(r() * 600), Math.round(r() * 300), (r() * 1.3 + 0.5).toFixed(1), (2 + r() * 3).toFixed(1), (r() * 3).toFixed(1)]);
  const ventanas = [];
  for (let f = 0; f < 7; f++) for (let c = 0; c < 6; c++) ventanas.push({ x: 176 + c * 42, y: 318 + f * 38, luz: r() < 0.42, soc: f === 3 && c === 1 });
  return { estrellas, ventanas };
})();
function escenaHtml() {
  const { estrellas, ventanas } = ESCENA;
  let i = 0;
  const vent = ventanas.map((w) => `<rect class="ventana${w.soc ? ' soc' : w.luz ? ' luz' : ''}" x="${w.x}" y="${w.y}" width="26" height="20" rx="3" style="--i:${w.luz || w.soc ? i++ : 0}"/>`).join('');
  return `<div class="escena" aria-hidden="true">
      <svg viewBox="0 80 600 560" preserveAspectRatio="xMidYMid meet" focusable="false">
        <defs>
          <linearGradient id="esc-cielo" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" class="c1"/><stop offset=".55" class="c2"/><stop offset="1" class="c3"/>
          </linearGradient>
          <pattern id="esc-trama" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="2.1" class="punto-sol"/></pattern>
          <radialGradient id="esc-halo"><stop offset="0" class="h1"/><stop offset="1" class="h2"/></radialGradient>
        </defs>
        <rect width="600" height="640" fill="url(#esc-cielo)"/>
        <g class="estrellas">${estrellas.map(([x, y, rr, d, dl]) => `<circle cx="${x}" cy="${y}" r="${rr}" style="--d:${d}s;--dl:${dl}s"/>`).join('')}</g>
        <g class="sol"><circle cx="445" cy="300" r="150" fill="url(#esc-halo)"/><circle cx="445" cy="300" r="92" fill="url(#esc-trama)"/></g>
        <g class="ciudad">
          <rect x="0" y="430" width="70" height="210"/><rect x="62" y="390" width="56" height="250"/><rect x="470" y="410" width="80" height="230"/><rect x="540" y="370" width="60" height="270"/>
        </g>
        <g class="sede">
          <rect class="fachada" x="150" y="270" width="300" height="370" rx="6"/>
          <rect class="remate" x="150" y="270" width="300" height="30" rx="6"/>
          <text x="300" y="291" text-anchor="middle" class="rotulo">NORTE LOGÍSTICA</text>
          ${vent}
          <rect class="nave" x="430" y="520" width="170" height="120"/>
          <rect class="puerta" x="452" y="560" width="54" height="80"/><rect class="puerta" x="522" y="560" width="54" height="80"/>
        </g>
        <rect class="calle" x="0" y="622" width="600" height="18"/>
        <g class="camion"><rect x="0" y="592" width="62" height="30" rx="3" class="caja"/><rect x="62" y="600" width="24" height="22" rx="3" class="cabina"/><circle cx="16" cy="624" r="6" class="rueda"/><circle cx="72" cy="624" r="6" class="rueda"/><text x="31" y="612" text-anchor="middle" class="logo-camion">NL</text></g>
      </svg>
      <span class="escena-chip"><i></i>${esc(T('escena_soc'))}</span>
      <div class="escena-ticket" id="escena-ticket">${ticketFlujo(FLUJO.casos[0])}</div>
    </div>`;
}

/* Consola en directo de la portada: el ruido pasa, una línea se enciende como señal y se convierte
   en un ticket clasificado. Es decorativa (aria-hidden): la información está en el resto de la página. */
const FLUJO = (() => {
  const casos = ['T1-01', 'T2-02', 'T3-04', 'T4-04', 'T5-03', 'T2-04'].map((id) => CASOS[id]);
  const lineas = [], senales = [];
  for (const c of casos) for (const l of BJ.registros(c)) (l.senal ? senales : lineas).push({ ...l, caso: c.id });
  return { casos, lineas, senales };
})();
let flujoTimer = null;
function lineaFlujo(l, senal) {
  return `<li class="fl${senal ? ' senal' : ''}"><span class="num">${l.t}</span><span class="fs">${esc(l.s)}</span><span class="fm">${esc(l.m)}</span>${senal ? `<em>${esc(T('flujo_senal'))}</em>` : ''}</li>`;
}
function ticketFlujo(c) {
  return `<div class="fl-ticket s-${c.sev}"><span class="num">${c.id}</span>${sevChip(c.sev)}<b>${esc(L(c.titulo))}</b><span class="fl-dec">${esc(T('veredictos.' + c.veredicto))} · ${esc(T('acciones.' + c.accion))}</span></div>`;
}
function flujoHtml() {
  const ini = FLUJO.lineas.slice(0, 7);
  return `<div class="flujo" aria-hidden="true">
      <div class="flujo-cab"><span class="vivo"></span><span>${esc(T('flujo_titulo'))}</span><span class="flujo-pts"><i></i><i></i><i></i></span></div>
      <ol class="flujo-lineas" id="flujo-lineas">${ini.map((l) => lineaFlujo(l, false)).join('')}${lineaFlujo(FLUJO.senales[0], true)}</ol>
      <div class="flujo-pie" id="flujo-pie">${ticketFlujo(FLUJO.casos[0])}</div>
    </div>`;
}
let relojTimer = null;
function iniciarFlujo() {
  clearInterval(flujoTimer); flujoTimer = null;
  clearInterval(relojTimer); relojTimer = null;
  const reloj = $('#reloj');
  if (reloj) relojTimer = setInterval(() => { if (!document.contains(reloj)) { clearInterval(relojTimer); relojTimer = null; return; } reloj.textContent = textoReloj(); }, 1000);
  const lista = $('#flujo-lineas');
  if (!lista || MOV.reducido()) return;
  let n = 7, k = 0;
  flujoTimer = setInterval(() => {
    if (!document.contains(lista)) { clearInterval(flujoTimer); flujoTimer = null; return; }
    if (document.hidden) return;
    const senal = n % 5 === 4;
    const l = senal ? FLUJO.senales[(k + 1) % FLUJO.senales.length] : FLUJO.lineas[n % FLUJO.lineas.length];
    const li = document.createElement('div');
    li.innerHTML = lineaFlujo(l, senal);
    const nueva = li.firstElementChild;
    lista.append(nueva);
    while (lista.children.length > 9) lista.firstElementChild.remove();
    // Toda la columna sube una línea con suavidad y la nueva aparece con un fundido.
    lista.animate?.([{ transform: 'translateY(22px)' }, { transform: 'translateY(0)' }], { duration: 480, easing: MOV.EASE });
    nueva.animate?.([{ opacity: 0 }, { opacity: 1 }], { duration: 480, easing: MOV.EASE });
    if (senal) {
      k++; const c = CASOS[l.caso];
      const pie = $('#flujo-pie'); if (pie) pie.innerHTML = ticketFlujo(c);
      const burbuja = $('#escena-ticket'); if (burbuja) burbuja.innerHTML = ticketFlujo(c);
    }
    n++;
  }, 1300);
}

/* ---------- Regleta del turno: la firma visual de BlueJr ----------
 * Una línea de tiempo de 08:00 a 14:30 con una marca por alerta. El tamaño dice la severidad,
 * el relleno dice si está cerrada y su nota; cada marca es un botón de 24 px que abre la alerta. */
const INI = 8 * 60, FIN = 14.5 * 60;
const posHora = (h) => { const [a, b] = h.split(':').map(Number); return ((a * 60 + b - INI) / (FIN - INI)) * 100; };
function regleta(t, compacta = false) {
  const horas = [8, 9, 10, 11, 12, 13, 14];
  const marcas = t.casos.map((c) => {
    const n = notaDe(c.id);
    const cls = n == null ? 'abierta' : n >= BJ.UMBRAL_APTO ? 'bien' : 'mal';
    const label = `${c.id} · ${c.hora} · ${T('sev.' + c.sev)} · ${L(c.titulo)} · ${n == null ? T('estado_abierta') : T('estado_cerrada', { n })}`;
    const act = !compacta && UI.caso === c.id ? ' aria-current="true"' : '';
    return compacta
      ? `<span class="marca s-${c.sev} ${cls}" style="left:${posHora(c.hora)}%" title="${esc(label)}"></span>`
      : `<button type="button" class="marca s-${c.sev} ${cls}" style="left:${posHora(c.hora)}%" data-caso="${c.id}" aria-label="${esc(label)}"${act}></button>`;
  }).join('');
  return `<div class="regleta${compacta ? ' compacta' : ''}"${compacta ? ' aria-hidden="true"' : ` role="group" aria-label="${esc(T('regleta'))}"`}><div class="eje">${horas.map((h) => `<span class="tick" style="left:${posHora(h + ':00')}%"><span class="num">${String(h).padStart(2, '0')}:00</span></span>`).join('')}</div>${marcas}</div>`;
}

/* ---------- Puesto de trabajo del turno ---------- */
function vTurno(id) {
  const t = turnoDe(id);
  if (!UI.caso || CASOS[UI.caso]?.turno !== id) UI.caso = (t.casos.find((c) => !cerrado(c.id)) || t.casos[0]).id;
  const r = BJ.resumenTurno(t, cerradas());
  const relevo = r.completo ? `<section class="relevo panel" aria-labelledby="relevo-t">
      <div class="relevo-cab"><h2 id="relevo-t">${ic(r.apto ? 'circle-check' : 'circle-x')}${esc(T('relevo_titulo'))}</h2><span class="estado ${r.apto ? 'ok' : 'ko'}">${esc(T('relevo_media', { n: r.media }))} · ${esc(r.apto ? T('apto') : T('no_apto', { n: BJ.UMBRAL_APTO }))}</span></div>
      <label class="campo">${esc(T('relevo'))}<textarea id="relevo" rows="3" maxlength="${BJ.LIMITES.relevo}" placeholder="${esc(T('relevo_ph'))}">${esc(S.relevos[id] || '')}</textarea></label>
      <div class="fila-der"><button type="button" class="btn" data-guardar-relevo="${id}">${ic('send')}${esc(T('guardar'))}</button></div></section>` : '';
  const paneles = ['cola', 'caso', 'ticket'];
  return cabecera(T('turno_ante', { n: numTurno(t), dia: diaDe(t).toUpperCase() }), 'siren', L(t.tema), '', `<span class="pildora num">${esc(T('progreso', { a: r.hechos, b: r.total }))}</span>`)
    // En pantallas estrechas las marcas quedarían a menos de 24 px: la regleta es solo visual y se navega con la cola.
    + `<div data-entra>${regleta(t, matchMedia('(max-width: 900px)').matches)}</div>`
    + relevo
    + `<div class="seg-movil" role="group" aria-label="${esc(T('paneles'))}">${paneles.map((p) => `<button type="button" data-panel="${p}" aria-pressed="${UI.panel === p}">${esc(T(p === 'cola' ? 'cola' : p === 'caso' ? 'caso' : 'ticket'))}</button>`).join('')}</div>`
    + `<div class="puesto" data-panel-activo="${UI.panel}">
        <section class="panel cola" data-entra aria-labelledby="cola-t"><h2 id="cola-t" class="panel-t">${ic('inbox')}${esc(T('cola'))}</h2><ol class="cola-lista">${t.casos.map(itemCola).join('')}</ol></section>
        <section class="panel caso" data-entra id="caso" aria-labelledby="caso-t">${panelCaso(CASOS[UI.caso])}</section>
        <section class="panel ticket" data-entra id="ticket" aria-labelledby="ticket-t">${panelTicket(CASOS[UI.caso])}</section>
      </div>`;
}

function itemCola(c) {
  const n = notaDe(c.id);
  const act = UI.caso === c.id;
  return `<li><button type="button" class="cola-item${act ? ' activa' : ''}" data-caso="${c.id}"${act ? ' aria-current="true"' : ''} aria-label="${esc(T('cola_ir', { id: c.id }))}: ${esc(L(c.titulo))}">
    <span class="ci-fila"><span class="num hora">${c.hora}</span>${sevChip(c.sev)}<span class="ci-estado num">${n == null ? '' : `${ic(n >= BJ.UMBRAL_APTO ? 'circle-check' : 'circle-x', n >= BJ.UMBRAL_APTO ? 'ok' : 'ko')}${n}`}</span></span>
    <span class="ci-titulo">${esc(L(c.titulo))}</span><span class="ci-id num">${c.id} · ${esc(c.fuente)}</span></button></li>`;
}

function panelCaso(c) {
  const lineas = BJ.registros(c);
  const fuentes = [...new Set(lineas.map((l) => l.s.replace(/^win-.*/, 'win')))];
  return `<div class="alerta">
      <div class="alerta-cab"><span class="num id">${c.id}</span>${sevChip(c.sev)}<span class="pildora fina">${ic('clock')}<span class="num">${c.hora}</span></span><span class="pildora fina">${ic('server')}${esc(c.fuente)}</span></div>
      <h2 id="caso-t">${esc(L(c.titulo))}</h2>
      <p class="regla"><span>${esc(T('regla'))}</span> ${esc(L(c.regla))}</p>
      <p class="resumen">${esc(L(c.resumen))}</p>
    </div>
    <div class="logs-cab"><h3>${ic('terminal')}${esc(T('registros'))}</h3><span class="num cuenta-lineas" id="cuenta-lineas"></span></div>
    <div class="logs-herr">
      <label class="filtro">${ic('filter')}<span class="sr-only">${esc(T('filtrar'))}</span><input id="filtro" type="search" autocomplete="off" spellcheck="false" placeholder="${esc(T('filtrar_ph'))}" value="${esc(UI.filtro)}"></label>
      <div class="chips" role="group" aria-label="${esc(T('fuentes'))}"><button type="button" class="chip" data-fuente="" aria-pressed="${!UI.fuente}">${esc(T('todas'))}</button>${fuentes.map((f) => `<button type="button" class="chip" data-fuente="${esc(f)}" aria-pressed="${UI.fuente === f}">${esc(f)}</button>`).join('')}</div>
    </div>
    <div class="logs" id="logs" tabindex="0" role="region" aria-label="${esc(T('registros'))}">${lineasHtml(c, lineas)}</div>`;
}

function lineasHtml(c, lineas = BJ.registros(c)) {
  const q = BJ.normalizar(UI.filtro);
  const ev = new Set(respuesta(c.id).evidencias);
  const bloqueado = cerrado(c.id);
  const vis = lineas.filter((l) => (!UI.fuente || l.s.replace(/^win-.*/, 'win') === UI.fuente) && (!q || BJ.normalizar(`${l.t} ${l.s} ${l.m}`).includes(q)));
  queueMicrotask(() => { const el = $('#cuenta-lineas'); if (el) el.textContent = T('registros_n', { a: vis.length, b: lineas.length }); });
  if (!vis.length) return `<p class="vacio">${esc(T('sin_lineas'))}</p>`;
  const marcar = (txt) => { const e = esc(txt); if (!q) return e; const i = e.toLowerCase().indexOf(esc(q)); return i < 0 ? e : e.slice(0, i) + '<mark>' + e.slice(i, i + esc(q).length) + '</mark>' + e.slice(i + esc(q).length); };
  return `<ol class="lineas">${vis.map((l) => `<li><button type="button" class="linea${ev.has(l.n) ? ' fijada' : ''}" data-linea="${l.n}" aria-pressed="${ev.has(l.n)}"${bloqueado ? ' disabled' : ''} title="${esc(ev.has(l.n) ? T('desfijar') : T('fijar'))}"><span class="l-t num">${l.t}</span><span class="l-s">${esc(l.s)}</span><span class="l-m">${marcar(l.m)}</span>${ev.has(l.n) ? ic('pin', 'l-pin') : ''}</button></li>`).join('')}</ol>`;
}

function panelTicket(c) {
  const r = respuesta(c.id);
  const bloqueado = cerrado(c.id);
  const opciones = (grupo, lista, valor) => `<div class="opciones" role="radiogroup" aria-labelledby="${grupo}-t">${lista.map((v) => `<button type="button" role="radio" class="opcion" data-${grupo}="${v}" aria-checked="${valor === v}" tabindex="${valor === v || (!valor && v === lista[0]) ? 0 : -1}"${bloqueado ? ' disabled' : ''}><b>${esc(T(grupo === 'veredicto' ? 'veredictos.' + v : 'acciones.' + v))}</b><small>${esc(T(grupo === 'veredicto' ? 'veredictos_desc.' + v : 'acciones_desc.' + v))}</small></button>`).join('')}</div>`;
  const campos = BJ.camposDe(c).map((f) => `<label class="campo">${esc(L(f.label))}<input data-campo="${f.id}" value="${esc(r.campos[f.id] || '')}" maxlength="${BJ.LIMITES.campo}" autocomplete="off" spellcheck="false"${bloqueado ? ' readonly' : ''}></label>`).join('');
  const lineas = BJ.registros(c);
  const ev = r.evidencias.map((n) => lineas.find((l) => l.n === n)).filter(Boolean);
  const listo = r.veredicto && r.accion;
  return `<h2 id="ticket-t" class="panel-t">${ic('file-text')}${esc(T('ticket'))} <span class="num id">${c.id}</span></h2>
    <div class="ticket-f">
      <fieldset><legend id="veredicto-t">${esc(T('veredicto'))}</legend>${opciones('veredicto', BJ.VEREDICTOS, r.veredicto)}</fieldset>
      <fieldset><legend id="accion-t">${esc(T('accion'))}</legend>${opciones('accion', BJ.ACCIONES, r.accion)}</fieldset>
      <fieldset><legend>${esc(T('datos_clave'))}</legend><div class="campos">${campos}</div></fieldset>
      <div class="evidencias"><p class="etq">${ic('pin')}${esc(T('evidencias'))} <span class="num">${ev.length ? esc(T('evidencias_n', { n: ev.length })) : ''}</span></p>${ev.length ? `<ol>${ev.map((l) => `<li><code><span class="num">${l.t}</span> ${esc(l.s)} ${esc(l.m)}</code></li>`).join('')}</ol>` : `<p class="nota">${esc(T('evidencias_vacio'))}</p>`}</div>
      <label class="campo">${esc(T('resumen_ticket'))}<textarea id="texto-ticket" rows="5" maxlength="${BJ.LIMITES.ticket}" placeholder="${esc(T('resumen_ph'))}"${bloqueado ? ' readonly' : ''}>${esc(r.ticket)}</textarea><small class="num" id="cuenta-ticket">${esc(T('caracteres', { n: r.ticket.trim().length, m: BJ.TICKET_MIN }))}</small></label>
      ${bloqueado ? resultadoHtml(c) : `<div class="ticket-pie"><span class="nota" id="falta">${listo ? '' : esc(T('falta_elegir'))}</span><button type="button" class="btn" data-cerrar-ticket${listo ? '' : ' disabled'}>${ic('check')}${esc(T('cerrar_ticket'))}</button></div>`}
    </div>`;
}

function resultadoHtml(c) {
  const res = BJ.corregir(c, S.respuestas[c.id]);
  const nombre = (k, v) => (v == null ? T('sin_respuesta') : T((k === 'veredicto' ? 'veredictos.' : 'acciones.') + v));
  const filas = res.criterios.map((k) => {
    let det = '';
    if (k.id === 'veredicto' || k.id === 'accion') det = k.puntos ? '' : `<small>${esc(T('tu_respuesta', { v: nombre(k.id, k.valor) }))} · ${esc(T('esperado', { v: nombre(k.id, k.esperado) }))}</small>`;
    if (k.id === 'campos') det = k.detalle.filter((d) => !d.ok).map((d) => `<small>${esc(L(d.label))}: ${esc(T('esperado', { v: d.esperado }))}</small>`).join('');
    if (k.id === 'ticket') det = `${k.largo ? '' : `<small>${esc(T('ticket_largo'))}: ${BJ.TICKET_MIN}</small>`}${k.citas ? '' : `<small>${esc(T('ticket_citas', { n: k.necesarias, claves: c.claves.join(', ') }))}</small>`}`;
    const ok = k.puntos === k.peso;
    return `<li class="${ok ? 'ok' : 'ko'}">${ic(ok ? 'circle-check' : 'circle-x')}<span class="crit"><b>${esc(T('crit.' + k.id))}</b>${det}</span><span class="num">${esc(T('puntos', { a: k.puntos, b: k.peso }))}</span></li>`;
  }).join('');
  const t = turnoDe(c.turno);
  const sig = t.casos.find((x) => !cerrado(x.id));
  return `<div class="resultado ${res.apto ? 'ok' : 'ko'}" tabindex="-1" id="resultado">
      <div class="res-cab"><p class="etq">${esc(T('resultado'))}</p><p class="nota-grande num">${res.nota}<span>/100</span></p></div>
      <ul class="criterios">${filas}</ul>
      <h3>${esc(T('explicacion'))}</h3><p class="explica">${esc(L(c.explica))}</p>
      <div class="ticket-pie"><button type="button" class="btn sec" data-reintentar="${c.id}">${ic('rotate-ccw')}${esc(T('reintentar'))}</button>${sig ? `<button type="button" class="btn" data-caso="${sig.id}">${esc(T('siguiente'))}${ic('chevron-right')}</button>` : ''}</div>
    </div>`;
}

/* ---------- Historial ---------- */
function vHistorial() {
  const h = BJ.historial(TURNOS, cerradas());
  const kpi = (t, v, cls = '') => `<div class="kpi ${cls}" data-entra><span>${esc(t)}</span><b class="num">${v}</b></div>`;
  const comp = h.competencias.map((c) => `<li><span class="c-nom">${esc(T('comp.' + c.id))}</span><span class="c-barra" role="img" aria-label="${esc(T('comp.' + c.id))}: ${c.media == null ? esc(T('sin_datos')) : c.media + '/100'}"><i style="width:${c.media ?? 0}%"></i></span><span class="num c-val">${c.media == null ? '—' : c.media}</span><small class="num">${esc(T('comp_casos', { a: c.casos, b: c.total }))}</small></li>`).join('');
  const turnos = h.turnos.map((r) => { const t = turnoDe(r.id); return `<li><a href="#${t.id}"><span class="tc-num num">${numTurno(t)}</span><span><b>${esc(diaDe(t))}</b> · ${esc(L(t.tema))}</span><span class="num">${esc(T('progreso', { a: r.hechos, b: r.total }))}</span><span class="estado ${r.completo ? (r.apto ? 'ok' : 'ko') : ''}">${r.hechos ? r.media : '—'}</span></a></li>`; }).join('');
  const tickets = Object.values(CASOS).filter((c) => cerrado(c.id));
  return cabecera(T('hist_ante'), 'award', T('hist_titulo'), T('hist_entradilla'))
    + `<div class="kpis">${kpi(T('kpi_tickets'), `${h.tickets}<small>/${h.total}</small>`)}${kpi(T('kpi_media'), h.tickets ? h.media : '—')}${kpi(T('kpi_veredicto'), h.tickets ? pct(h.precisionVeredicto) : '—')}${kpi(T('kpi_errores'), h.cerradosPorError, h.cerradosPorError ? 'aviso' : '')}</div>
    <div class="hist-rej">
      <section class="panel" data-entra aria-labelledby="comp-t"><h2 id="comp-t" class="panel-t">${ic('target')}${esc(T('competencias_titulo'))}</h2><p class="nota">${esc(T('competencias_nota'))}</p><ul class="competencias">${comp}</ul></section>
      <section class="panel" data-entra aria-labelledby="ht-t"><h2 id="ht-t" class="panel-t">${ic('calendar-clock')}${esc(T('turnos_titulo'))}</h2><ul class="hist-turnos">${turnos}</ul>
        <h2 class="panel-t sep">${ic('archive')}${esc(T('datos_titulo'))}</h2>
        <div class="acciones-datos"><button type="button" class="btn" data-exportar-md>${ic('download')}${esc(T('exportar_md'))}</button><button type="button" class="btn sec" data-exportar-json>${ic('download')}${esc(T('exportar_json'))}</button><button type="button" class="btn sec" data-importar>${ic('upload')}${esc(T('importar'))}</button><button type="button" class="btn peligro" data-borrar>${ic('rotate-ccw')}${esc(UI.borrarArmado ? T('borrar_confirmar') : T('borrar'))}</button></div>
      </section>
    </div>
    <section class="panel" aria-labelledby="tk-t"><h2 id="tk-t" class="panel-t">${ic('scroll-text')}${esc(T('tickets_titulo'))}</h2>${tickets.length ? `<ul class="hist-tickets">${tickets.map((c) => { const r = S.respuestas[c.id]; return `<li><a href="#${c.turno}" data-caso-ir="${c.id}"><span class="num id">${c.id}</span><span class="ht-tit">${esc(L(c.titulo))}</span><span class="ht-dec">${esc(T('veredictos.' + r.veredicto))} · ${esc(T('acciones.' + r.accion))}</span><span class="num nota-chip ${r.nota >= BJ.UMBRAL_APTO ? 'ok' : 'ko'}">${r.nota}</span></a></li>`; }).join('')}</ul>` : `<p class="vacio">${esc(T('sin_tickets'))}</p>`}</section>`;
}

/* ---------- Exportaciones ---------- */
function historialMd() {
  const h = BJ.historial(TURNOS, cerradas());
  const fecha = new Date().toLocaleDateString(locale(), { day: 'numeric', month: 'long', year: 'numeric' });
  const es = P.lang === 'es';
  const o = [];
  o.push(es ? '# Historial de turnos SOC · BlueJr' : '# SOC shift record · BlueJr', '');
  o.push(`**${S.perfil.nombre || (es ? 'Analista' : 'Analyst')}** · ${T('perfil_rol')} · ${fecha}`, '');
  o.push(`> ${es ? 'Simulación formativa de BlueJr con una empresa ficticia (Norte Logística). Las decisiones y los textos son del analista; la corrección es automática.' : 'BlueJr training simulation with a made-up company (Norte Logística). Decisions and texts are the analyst\'s; grading is automatic.'} ${REPO}`, '');
  o.push(`| ${T('kpi_tickets')} | ${T('kpi_media')} | ${T('kpi_veredicto')} | ${T('kpi_errores')} |`, '|---|---|---|---|', `| ${h.tickets}/${h.total} | ${h.media} | ${h.precisionVeredicto} % | ${h.cerradosPorError} |`, '');
  o.push(`## ${T('competencias_titulo')}`, '', `| ${es ? 'Competencia' : 'Competence'} | ${T('kpi_media')} | ${es ? 'Casos' : 'Cases'} |`, '|---|---|---|');
  for (const c of h.competencias) o.push(`| ${T('comp.' + c.id)} | ${c.media ?? '—'} | ${c.casos}/${c.total} |`);
  o.push('');
  for (const t of TURNOS) {
    const r = BJ.resumenTurno(t, cerradas());
    if (!r.hechos) continue;
    o.push(`## ${T('turno_n', { n: numTurno(t) })} · ${diaDe(t)} · ${L(t.tema)}`, '', `${T('progreso', { a: r.hechos, b: r.total })} · ${T('nota_media')} ${r.media}`, '');
    for (const c of t.casos.filter((x) => cerrado(x.id))) {
      const s = S.respuestas[c.id];
      const lineas = BJ.registros(c);
      o.push(`### ${c.id} · ${L(c.titulo)} · ${s.nota}/100`, '');
      o.push(`- ${T('veredicto')}: ${T('veredictos.' + s.veredicto)}`, `- ${T('accion')}: ${T('acciones.' + s.accion)}`);
      for (const f of BJ.camposDe(c)) if (s.campos[f.id]) o.push(`- ${L(f.label)}: \`${s.campos[f.id].replace(/`/g, "'")}\``);
      o.push('');
      if (s.ticket.trim()) o.push(...s.ticket.trim().split('\n').map((l) => '> ' + l), '');
      const ev = s.evidencias.map((n) => lineas.find((l) => l.n === n)).filter(Boolean);
      if (ev.length) o.push('```text', ...ev.map((l) => `${l.t} ${l.s} ${l.m}`), '```', '');
    }
    if (S.relevos[t.id]) o.push(`**${T('relevo')}**`, '', ...S.relevos[t.id].trim().split('\n').map((l) => '> ' + l), '');
  }
  return o.join('\n');
}
/* ===== 05-events.js ===== */
/* Eventos y arranque. Un único delegado por tipo de evento: la interfaz se repinta por zonas. */

function pintar() {
  const r = ruta();
  aplicarTema();
  pintarLateral(); pintarBarra(); pintarAbajo();
  if (r.vista === 'turno') { UI.ultimoTurno = r.turno; escribir('bluejr-ultimo', r.turno); }
  const main = $('#main');
  main.innerHTML = `<div class="vista">${r.vista === 'turno' ? vTurno(r.turno) : r.vista === 'historial' ? vHistorial() : vTurnos()}</div>`;
  const titulo = r.vista === 'turno' ? `${T('turno_n', { n: r.turno.slice(1) })} · ${diaDe(turnoDe(r.turno))}` : r.vista === 'historial' ? T('nav_historial') : T('nav_turnos');
  document.title = `${titulo} · BlueJr`;
  $('.saltar').textContent = T('saltar');
  // La entrada solo se reproduce al cambiar de vista (y al arrancar), no en cada repintado.
  const clave = r.vista + (r.turno || '');
  if (clave !== UI.vistaAnimada) { UI.vistaAnimada = clave; $('#main .vista').classList.add('entrando'); MOV.vista($('#main .vista')); MOV.contar($('#main')); }
  else for (const el of $$('#main [data-cuenta]')) el.textContent = num(Number(el.dataset.cuenta)) + (el.dataset.sufijo || '');
  if (r.vista === 'turnos') iniciarFlujo();
}

/* Repintados parciales del puesto de trabajo: no se pierde el foco ni el desplazamiento de los registros. */
function pintarCaso() {
  const c = CASOS[UI.caso];
  $('#caso').innerHTML = panelCaso(c);
  $('#ticket').innerHTML = panelTicket(c);
  $$('.cola-item').forEach((b) => { const a = b.dataset.caso === UI.caso; b.classList.toggle('activa', a); a ? b.setAttribute('aria-current', 'true') : b.removeAttribute('aria-current'); });
  $$('.regleta .marca[data-caso]').forEach((b) => (b.dataset.caso === UI.caso ? b.setAttribute('aria-current', 'true') : b.removeAttribute('aria-current')));
}
function pintarLineas() { const c = CASOS[UI.caso]; $('#logs').innerHTML = lineasHtml(c); }
function pintarTicket() { $('#ticket').innerHTML = panelTicket(CASOS[UI.caso]); }

function abrirCaso(id, foco = true) {
  if (!CASOS[id]) return;
  UI.caso = id; UI.filtro = ''; UI.fuente = null; UI.panel = 'caso';
  if (ruta().turno !== CASOS[id].turno) { location.hash = CASOS[id].turno; return; }
  pintarCaso();
  $('.puesto')?.setAttribute('data-panel-activo', 'caso');
  $$('[data-panel]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.panel === 'caso'));
  const h = $('#caso-t');
  if (foco && h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
}

function cerrarTicket() {
  const c = CASOS[UI.caso];
  const r = respuesta(c.id);
  if (!r.veredicto || !r.accion) return;
  r.cerrado = true;
  r.cuando = new Date().toISOString();
  r.nota = BJ.corregir(c, r).nota;
  guardar();
  const scroll = scrollY;
  pintar();
  scrollTo(0, scroll);
  avisar(T('ticket_cerrado', { id: c.id, n: r.nota }));
  UI.panel = 'ticket';
  $('.puesto')?.setAttribute('data-panel-activo', 'ticket');
  $$('[data-panel]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.panel === 'ticket'));
  $('#resultado')?.focus({ preventScroll: true });
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button, a');
  if (!b) { if (e.target.tagName === 'DIALOG') cerrarDialogo(e.target); return; }
  const d = b.dataset;
  if ('cerrarDlg' in d) return cerrarDialogo(b.closest('dialog'));
  if ('ayuda' in d) return abrirAyuda();
  if ('buscar' in d) return abrirBusqueda();
  if ('perfil' in d) return abrirPerfil();
  if (d.tab) { tabAyuda = d.tab; pintarAyuda(); return $('#tab-' + d.tab).focus(); }
  if (d.lang) { P.lang = d.lang; guardarPrefs(); return pintar(); }
  if ('tema' in d) { P.theme = temaActual() === 'dark' ? 'light' : 'dark'; guardarPrefs(); aplicarTema(); return b.setAttribute('aria-checked', temaActual() === 'dark'); }
  if (d.accentPick) { P.accent = d.accentPick; guardarPrefs(); aplicarTema(); return $$('[data-accent-pick]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.accentPick === P.accent)); }
  if ('alternarLateral' in d) return alternarLateral(b);
  if (d.q !== undefined) return elegirBusqueda(+d.q);
  if (d.casoIr) { UI.caso = d.casoIr; return; }
  if (d.caso) return abrirCaso(d.caso);
  if (d.panel) { UI.panel = d.panel; $('.puesto').setAttribute('data-panel-activo', d.panel); return $$('[data-panel]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.panel === d.panel)); }
  if (d.fuente !== undefined) { UI.fuente = d.fuente || null; $$('.chips [data-fuente]').forEach((x) => x.setAttribute('aria-pressed', (x.dataset.fuente || null) === UI.fuente)); return pintarLineas(); }
  if (d.linea !== undefined) {
    const r = respuesta(UI.caso); const n = +d.linea;
    r.evidencias = r.evidencias.includes(n) ? r.evidencias.filter((x) => x !== n) : [...r.evidencias, n].slice(0, BJ.LIMITES.evidencias);
    guardar(); pintarLineas(); pintarTicket();
    return $(`[data-linea="${n}"]`)?.focus();
  }
  if (d.veredicto || d.accion) {
    const k = d.veredicto ? 'veredicto' : 'accion';
    respuesta(UI.caso)[k] = d[k]; guardar(); pintarTicket();
    return $(`[data-${k}="${d[k]}"]`)?.focus();
  }
  if ('cerrarTicket' in d) return cerrarTicket();
  if (d.reintentar) {
    const r = respuesta(d.reintentar); delete r.cerrado; delete r.nota; guardar();
    pintar(); return $('[data-veredicto]')?.focus();
  }
  if (d.guardarRelevo) { S.relevos[d.guardarRelevo] = $('#relevo').value.slice(0, BJ.LIMITES.relevo); guardar(); return avisar(T('relevo_guardado')); }
  if ('exportarMd' in d) return descargar(`bluejr-historial-${new Date().toISOString().slice(0, 10)}.md`, historialMd(), 'text/markdown;charset=utf-8');
  if ('exportarJson' in d) return descargar(`bluejr-copia-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: 'bluejr', version: VERSION, ...S }, null, 2), 'application/json');
  if ('importar' in d) return $('#archivo').click();
  if ('borrar' in d) {
    if (!UI.borrarArmado) { UI.borrarArmado = true; b.lastChild.textContent = T('borrar_confirmar'); setTimeout(() => { UI.borrarArmado = false; if (document.contains(b)) b.lastChild.textContent = T('borrar'); }, 4000); return; }
    UI.borrarArmado = false; S = BJ.sanearEstado(null, CASOS); guardar(); pintar(); return avisar(T('borrado'));
  }
});

function alternarLateral(b = $('[data-alternar-lateral]')) {
  P.lateral = !P.lateral; guardarPrefs();
  document.body.classList.toggle('lateral-compacto', !P.lateral);
  b?.setAttribute('aria-expanded', P.lateral);
  setTimeout(MOV.indicador, 320);
}

/* Desde el historial, el enlace de un ticket abre su turno con esa alerta seleccionada. */
document.addEventListener('click', (e) => { const a = e.target.closest('[data-caso-ir]'); if (a) UI.caso = a.dataset.casoIr; }, true);

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'q') return buscar(t.value);
  if (t.id === 'filtro') { UI.filtro = t.value; return pintarLineas(); }
  if (t.dataset.campo) { respuesta(UI.caso).campos[t.dataset.campo] = t.value.slice(0, BJ.LIMITES.campo); return guardar(); }
  if (t.id === 'texto-ticket') { respuesta(UI.caso).ticket = t.value.slice(0, BJ.LIMITES.ticket); guardar(); $('#cuenta-ticket').textContent = T('caracteres', { n: t.value.trim().length, m: BJ.TICKET_MIN }); }
});

document.addEventListener('submit', (e) => {
  if (e.target.id === 'f-perfil') { S.perfil.nombre = String(new FormData(e.target).get('nombre') || '').trim().slice(0, BJ.LIMITES.nombre); guardar(); pintarLateral(); }
});

$('#archivo').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  if (f.size > 2 * 1024 * 1024) return avisar(T('import_error'));
  const r = BJ.safeParse(await f.text());
  if (!r.ok || !r.valor || r.valor.app !== 'bluejr') return avisar(T('import_error'));
  S = BJ.sanearEstado(r.valor, CASOS); guardar(); pintar();
  avisar(T('importado', { n: Object.values(S.respuestas).filter((x) => x.cerrado).length }));
});

document.addEventListener('keydown', (e) => {
  const enCampo = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return abrirBusqueda(); }
  if (e.target.id === 'q') {
    if (e.key === 'ArrowDown') { e.preventDefault(); return moverBusqueda(1); }
    if (e.key === 'ArrowUp') { e.preventDefault(); return moverBusqueda(-1); }
    if (e.key === 'Enter') { e.preventDefault(); return elegirBusqueda(activo); }
  }
  // Pestañas de la ayuda: flechas, Inicio y Fin.
  if (e.target.getAttribute('role') === 'tab' && ['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(e.key)) {
    e.preventDefault();
    const i = TABS.indexOf(tabAyuda);
    tabAyuda = TABS[e.key === 'Home' ? 0 : e.key === 'End' ? TABS.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + TABS.length) % TABS.length];
    pintarAyuda(); return $('#tab-' + tabAyuda).focus();
  }
  // Grupos de radio (veredicto y acción): flechas para moverse y elegir.
  if (e.target.getAttribute('role') === 'radio' && ['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp'].includes(e.key)) {
    e.preventDefault();
    const k = e.target.dataset.veredicto ? 'veredicto' : 'accion';
    const lista = k === 'veredicto' ? BJ.VEREDICTOS : BJ.ACCIONES;
    const i = lista.indexOf(e.target.dataset[k]);
    const v = lista[(i + (['ArrowRight', 'ArrowDown'].includes(e.key) ? 1 : -1) + lista.length) % lista.length];
    respuesta(UI.caso)[k] = v; guardar(); pintarTicket();
    return $(`[data-${k}="${v}"]`)?.focus();
  }
  if (enCampo || e.ctrlKey || e.metaKey || e.altKey || document.querySelector('dialog[open]')) return;
  if (e.key === '?') { e.preventDefault(); return abrirAyuda(); }
  if (e.key === '[' && matchMedia('(min-width: 901px)').matches) { e.preventDefault(); return alternarLateral(); }
  if (e.key === '/' && $('#filtro')) { e.preventDefault(); return $('#filtro').focus(); }
  if ((e.key === 'j' || e.key === 'k') && ruta().vista === 'turno') {
    const casos = turnoDe(ruta().turno).casos;
    const i = casos.findIndex((c) => c.id === UI.caso);
    const sig = casos[Math.min(casos.length - 1, Math.max(0, i + (e.key === 'j' ? 1 : -1)))];
    if (sig) { abrirCaso(sig.id, false); $(`.cola-item[data-caso="${sig.id}"]`)?.focus(); }
  }
});

addEventListener('hashchange', () => { pintar(); $('#main').focus({ preventScroll: true }); scrollTo(0, 0); });
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', () => { if (!P.theme) pintar(); });
matchMedia('(max-width: 900px)').addEventListener?.('change', () => { if (ruta().vista === 'turno') pintar(); });

if (TEST) window.__BJ__ = { S: () => S, UI, CASOS, BJ, pintar };
pintar();
// Tras la primera carga, el lateral ya no repite su entrada al repintarse.
setTimeout(() => document.body.classList.add('ya-cargado'), 700);
</script>
