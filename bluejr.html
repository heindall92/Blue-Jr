/* Núcleo: datos, estado persistido, preferencias y utilidades compartidas por la interfaz. */
const DATOS = JSON.parse(document.getElementById('datos').textContent);
const EMPRESA = DATOS.empresa;
const TURNOS = ['t1', 't2', 't3', 't4', 't5'].map((k) => DATOS[k]);
const REV_INDICE = Object.fromEntries(DATOS.revision.casos.map((c) => [c.id, c]));
const CASOS = Object.fromEntries(TURNOS.flatMap((t) => t.casos.map((c) => [c.id, { ...c, turno: t.id }])));
const VERSION = '0.6.0';
const ACENTOS = ['rosa', 'solar', 'glaciar', 'orquidea', 'verde', 'azul', 'rojo'];
const REPO = 'https://github.com/heindall92/Blue-Jr';
const TEST = /[?&]test\b/.test(location.search);

/* ---------- Almacenamiento: siempre envuelto, la app funciona aunque falle ---------- */
const leer = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const escribir = (k, v) => { try { localStorage.setItem(k, v); } catch { /* modo privado o cuota llena */ } };
const CLAVE = 'bluejr-v1';
const CLAVE_PREFS = 'bluejr-prefs';

function cargarEstado() {
  const r = BJ.safeParse(leer(CLAVE));
  return r.ok ? BJ.sanearEstado(r.valor, CASOS, REV_INDICE) : BJ.sanearEstado(null, CASOS, REV_INDICE);
}
let S = cargarEstado();
const guardar = () => escribir(CLAVE, JSON.stringify(S));

const prefsIni = (() => { const r = BJ.safeParse(leer(CLAVE_PREFS)); return r.ok && r.valor && typeof r.valor === 'object' ? r.valor : {}; })();
const P = {
  lang: prefsIni.lang === 'en' || prefsIni.lang === 'es' ? prefsIni.lang : (navigator.language || 'es').toLowerCase().startsWith('es') ? 'es' : 'en',
  // Cada carga empieza en claro, sin mirar el sistema ni la sesión anterior; el interruptor cambia el tema durante la visita.
  theme: 'light',
  accent: ACENTOS.includes(prefsIni.accent) ? prefsIni.accent : 'azul',
  lateral: prefsIni.lateral !== false
};
const guardarPrefs = () => escribir(CLAVE_PREFS, JSON.stringify(P));

/* ---------- Estado de la interfaz (no se guarda) ---------- */
const UI = { turno: null, caso: null, filtro: '', fuente: null, panel: 'caso', ultimoTurno: leer('bluejr-ultimo') || 'T1', borrarArmado: false, vistaAnimada: null, guia: null, guiaTab: 'triaje', investigado: new Set(), rev: null, rapido: null, msgTipo: null, msgRevisado: null, defP: null, defRevisado: null };

/* ---------- Textos ---------- */
const T = (k, vars) => {
  let v = k.split('.').reduce((o, p) => (o == null ? o : o[p]), I18N[P.lang]);
  if (v == null) v = k.split('.').reduce((o, p) => (o == null ? o : o[p]), I18N.es) ?? k;
  return typeof v === 'string' && vars ? v.replace(/\{(\w+)\}/g, (_, n) => (vars[n] ?? '')) : v;
};
const L = (o) => (o && typeof o === 'object' ? o[P.lang] ?? o.es : o ?? '');
const locale = () => (P.lang === 'es' ? 'es-ES' : 'en-GB');
const num = (n) => new Intl.NumberFormat(locale()).format(n);
const pct = (n) => new Intl.NumberFormat(locale(), { style: 'percent', maximumFractionDigits: 0 }).format(n / 100);

/* Escapado central: todo texto que viene de datos o del usuario pasa por aquí antes de ir al HTML. */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ---------- Tema y acento ---------- */
const raiz = document.documentElement;
const temaSistema = () => (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
const temaActual = () => P.theme || temaSistema();
function aplicarTema() {
  raiz.dataset.theme = temaActual();
  raiz.dataset.accent = P.accent;
  raiz.lang = P.lang;
}

/* ---------- Avisos ---------- */
function avisar(texto, icono = 'circle-check') {
  const caja = $('#toasts');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `${ic(icono)}<span></span>`;
  t.querySelector('span').textContent = texto;
  caja.append(t);
  while (caja.children.length > 3) caja.firstElementChild.remove();
  setTimeout(() => { t.classList.add('sale'); setTimeout(() => t.remove(), 300); }, 4000);
}

/* ---------- Descargas (sin servidor: un enlace a un Blob) ---------- */
function descargar(nombre, contenido, tipo) {
  const url = URL.createObjectURL(new Blob([contenido], { type: tipo }));
  const a = document.createElement('a');
  a.href = url; a.download = nombre; a.hidden = true;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  avisar(T('exportado', { f: nombre }));
}

/* ---------- Utilidades de dominio ---------- */
const turnoDe = (id) => TURNOS.find((t) => t.id === id);
const respuesta = (id) => S.respuestas[id] || (S.respuestas[id] = { veredicto: null, accion: null, campos: {}, ticket: '', evidencias: [], cuando: null });
const cerrado = (id) => S.respuestas[id]?.cerrado === true;
const notaDe = (id) => (cerrado(id) ? S.respuestas[id].nota : null);
const diaDe = (t) => L(t.dia);
const numTurno = (t) => t.id.slice(1);

/* ===== 02b-motion.js ===== */
/* Movimiento (principios de Emil Kowalski), con la Web Animations API.
 * - Entrada de cada vista corta y acotada: la cabecera empieza ya, como mucho MAX_PIEZAS piezas
 *   escalonadas y todo termina antes de ENTRADA_MAX_MS. Nunca se esconde contenido esperando.
 * - Solo transform y opacity, ease-out fuerte y sin rebote; `fill: backwards` no retiene el
 *   estado final, así el hover y lo fijo siguen funcionando.
 * - Lo que tiene el foco no se mueve: si el foco está dentro, solo hay fundido.
 * - Con movimiento reducido no se anima nada y las cifras aparecen ya contadas. */
const MOV = (() => {
  const EASE = 'cubic-bezier(0.23, 1, 0.32, 1)';
  const DURACION = 240, PASO = 28, MAX_PIEZAS = 7;
  const ENTRADA_MAX_MS = (MAX_PIEZAS - 1) * PASO + 40 + DURACION;
  const reducido = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  let activas = [];

  function entrar(el, retraso, distancia, foco) {
    if (typeof el.animate !== 'function') return;
    const frames = foco ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 0, transform: `translateY(${distancia}px)` }, { opacity: 1, transform: 'translateY(0)' }];
    activas.push(el.animate(frames, { duration: DURACION, delay: retraso, easing: EASE, fill: 'backwards' }));
  }

  /** Entrada de una vista: la cabecera y las piezas marcadas con data-entra, en orden. */
  function vista(v) {
    activas.forEach((a) => a.cancel()); activas = [];
    if (!v || reducido()) return;
    const foco = v.contains(document.activeElement);
    const cab = v.querySelector('.pag-cab, .portada');
    if (cab) entrar(cab, 0, 8, foco);
    [...v.querySelectorAll('[data-entra]')].slice(0, MAX_PIEZAS).forEach((el, i) => entrar(el, 40 + i * PASO, 12, foco));
  }

  /** Cuenta una cifra hasta su valor (las que llevan data-cuenta). */
  function contar(raiz) {
    for (const el of raiz.querySelectorAll('[data-cuenta]')) {
      const fin = Number(el.dataset.cuenta), suf = el.dataset.sufijo || '';
      if (reducido() || !fin) { el.textContent = num(fin) + suf; continue; }
      const t0 = performance.now(), ms = 700;
      const paso = (t) => { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.textContent = num(Math.round(fin * e)) + suf; if (k < 1) requestAnimationFrame(paso); };
      requestAnimationFrame(paso);
    }
  }

  /** Píldora del lateral que se desliza hasta la sección activa (como layoutId). */
  let ultimaY = null;
  function indicador() {
    const nav = $('.lat-nav'), ind = $('.lat-ind'), act = $('.lat-nav a[aria-current="page"]');
    if (!nav || !ind) return;
    if (!act) { ind.style.opacity = '0'; return; }
    const y = act.offsetTop, h = act.offsetHeight;
    if (ultimaY == null || reducido()) { ind.style.transition = 'none'; ind.style.transform = `translateY(${y}px)`; ind.style.height = h + 'px'; ind.style.opacity = '1'; ultimaY = y; return; }
    ind.style.transition = 'none'; ind.style.transform = `translateY(${ultimaY}px)`; ind.style.height = h + 'px'; ind.style.opacity = '1';
    requestAnimationFrame(() => { ind.style.transition = ''; ind.style.transform = `translateY(${y}px)`; });
    ultimaY = y;
  }

  return { vista, contar, indicador, reducido, EASE, DURACION, MAX_PIEZAS, ENTRADA_MAX_MS };
})();
/* ===== 03-shell.js ===== */
/* Armazón: barra lateral, barra superior, barra inferior en móvil, ayuda, búsqueda y perfil. */

/* ---------- Rutas: #turnos, #historial, #T1…#T5 ---------- */
function ruta() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (/^T[1-5]$/.test(h)) return { vista: 'turno', turno: h };
  if (h === 'historial') return { vista: 'historial' };
  if (h === 'revision') return { vista: 'revision' };
  if (h === 'rapido') return { vista: 'rapido' };
  return { vista: 'turnos' };
}

function logo() {
  return `<span class="logo">${ic('radar')}</span>`;
}

function pintarLateral() {
  const r = ruta();
  const actual = (v) => (v ? ' aria-current="page"' : '');
  const cerr = Object.fromEntries(Object.entries(S.respuestas).filter(([, v]) => v.cerrado));
  const turnos = TURNOS.map((t, i) => {
    const res = BJ.resumenTurno(t, cerr);
    const estado = res.completo ? (res.apto ? 'ok' : 'ko') : res.hechos ? 'medio' : '';
    const nombre = `${T('turno_n', { n: numTurno(t) })} · ${diaDe(t)}`;
    return `<li style="--i:${i + 1}"><a href="#${t.id}" class="sub" title="${esc(nombre)}"${actual(r.vista === 'turno' && r.turno === t.id)}><span class="punto ${estado}" aria-hidden="true"><b class="num">${numTurno(t)}</b></span><span class="txt">${esc(nombre)}</span><span class="cuenta num">${res.hechos}/${res.total}</span></a></li>`;
  }).join('');
  // Cada sección tiene su propio gesto en el icono al pasar el ratón (data-anim).
  $('#lateral').innerHTML = `
    <div class="lat-cab">${logo()}<div class="marca-txt"><b>Blue-Jr</b><span>${esc(T('submarca'))}</span></div></div>
    <nav aria-label="${esc(T('nav_secciones'))}" class="lat-nav">
      <span class="lat-ind" aria-hidden="true"></span>
      <a href="#turnos" data-anim="reloj" style="--i:0" title="${esc(T('nav_turnos'))}"${actual(r.vista === 'turnos')}>${ic('calendar-clock')}<span class="txt">${esc(T('nav_turnos'))}</span></a>
      <ul>${turnos}</ul>
      <a href="#rapido" data-anim="rayo" style="--i:6" title="${esc(T('rap_titulo'))}"${actual(r.vista === 'rapido')}>${ic('zap')}<span class="txt">${esc(T('rap_titulo'))}</span></a>
      <a href="#revision" data-anim="bot" style="--i:7" title="${esc(T('rev_corto'))}"${actual(r.vista === 'revision')}>${ic('bot')}<span class="txt">${esc(T('rev_corto'))}</span></a>
      <a href="#historial" data-anim="medalla" style="--i:8" title="${esc(T('nav_historial'))}"${actual(r.vista === 'historial')}>${ic('award')}<span class="txt">${esc(T('nav_historial'))}</span></a>
    </nav>
    <div class="lat-pie">
      <div class="acentos" role="group" aria-label="${esc(T('acento'))}">${ACENTOS.map((a) => `<button type="button" class="acento-b" data-accent-pick="${a}" aria-pressed="${P.accent === a}" title="${esc(T('acentos.' + a))}" aria-label="${esc(T('acentos.' + a))}"></button>`).join('')}</div>
      <button type="button" class="cuenta-b" data-perfil title="${esc(S.perfil.nombre || T('perfil_sin'))}">
        <span class="avatar" aria-hidden="true">${S.perfil.nombre ? esc(iniciales(S.perfil.nombre)) : ic('user')}</span>
        <span class="cuenta-txt"><b>${esc(S.perfil.nombre || T('perfil_sin'))}</b><small>${esc(T('niveles.' + progresoActual().nivel))} · <span class="num">${esc(T('xp_total', { n: num(progresoActual().xp) }))}</span></small></span>
      </button>
    </div>`;
  document.body.classList.toggle('lateral-compacto', !P.lateral);
  requestAnimationFrame(MOV.indicador);
}
const iniciales = (n) => n.trim().split(/\s+/).slice(0, 2).map((p) => p[0]).join('').toUpperCase();

function pintarBarra() {
  const mac = /Mac|iPhone|iPad/.test(navigator.platform || '');
  $('#barra').innerHTML = `
    <div class="barra-in">
      <button type="button" class="icono-b solo-escritorio" data-alternar-lateral aria-label="${esc(T('lateral_alternar'))}" aria-expanded="${P.lateral}" title="${esc(T('lateral_alternar'))} ( [ )">${ic('panel-left')}</button>
      <a href="#turnos" class="marca-movil">${logo()}<b>Blue-Jr</b></a>
      <span class="hueco"></span>
      <button type="button" class="buscar-b" data-buscar aria-label="${esc(T('buscar'))}">${ic('search')}<span class="txt">${esc(T('buscar'))}</span><kbd>${mac ? '⌘K' : 'Ctrl K'}</kbd></button>
      <div class="idioma" role="group" aria-label="${esc(T('idioma'))}">
        <button type="button" data-lang="es" aria-pressed="${P.lang === 'es'}">ES</button><button type="button" data-lang="en" aria-pressed="${P.lang === 'en'}">EN</button>
      </div>
      <button type="button" class="interruptor" role="switch" aria-checked="${temaActual() === 'dark'}" aria-label="${esc(T('tema'))}" data-tema>
        <span class="pista">${ic('sun')}${ic('moon')}</span><span class="perilla"></span>
      </button>
      <button type="button" class="icono-b" data-ayuda aria-label="${esc(T('ayuda'))}">${ic('circle-help')}</button>
    </div>`;
}

function pintarAbajo() {
  const r = ruta();
  const turno = r.vista === 'turno' ? r.turno : UI.ultimoTurno;
  const it = (href, icono, txt, act) => `<a href="${href}"${act ? ' aria-current="page"' : ''}>${ic(icono)}<span>${esc(txt)}</span></a>`;
  $('#abajo').innerHTML = it('#turnos', 'calendar-clock', T('nav_turnos'), r.vista === 'turnos')
    + it('#' + turno, 'siren', `${T('nav_turno_actual')} ${turno.slice(1)}`, r.vista === 'turno')
    + it('#historial', 'award', T('nav_historial'), r.vista === 'historial')
    + `<button type="button" data-ayuda>${ic('circle-help')}<span>${esc(T('nav_ayuda'))}</span></button>`;
  $('#abajo').setAttribute('aria-label', T('nav_secciones'));
}

let focoPrevio = null;
function abrirDialogo(d, foco) {

let resultados = [], activo = 0;
function abrirBusqueda() {
  const d = $('#dlg-buscar');
  d.setAttribute('aria-label', T('buscar'));
  d.innerHTML = `<div class="buscar-cab">${ic('search')}<input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="${esc(T('buscar_ph'))}" aria-label="${esc(T('buscar_ph'))}" aria-controls="q-res" role="combobox" aria-expanded="true" aria-autocomplete="list"><kbd>Esc</kbd></div><div id="q-res" class="q-res" role="listbox" aria-label="${esc(T('buscar'))}"></div>`;
  buscar('');
  abrirDialogo(d, '#q');
}
function buscar(q) {
  const n = BJ.normalizar(q);
  const casa = (t) => !n || BJ.normalizar(t).includes(n);
  const sec = [['#turnos', T('nav_turnos'), 'calendar-clock'], ['#historial', T('nav_historial'), 'award'], ...TURNOS.map((t) => ['#' + t.id, `${T('turno_n', { n: numTurno(t) })} · ${diaDe(t)} · ${L(t.tema)}`, 'siren'])].filter(([, t]) => casa(t)).map(([href, t, i]) => ({ g: 'secciones', href, t, i }));
  const alertas = Object.values(CASOS).filter((c) => casa(`${c.id} ${L(c.titulo)} ${L(c.regla)}`)).slice(0, n ? 12 : 6).map((c) => ({ g: 'alertas', href: '#' + c.turno, caso: c.id, t: `${c.id} · ${L(c.titulo)}`, i: 'siren' }));
  const glos = n ? T('glosario').filter(([k, v]) => casa(k + ' ' + v)).slice(0, 6).map(([k]) => ({ g: 'glosario', tab: 'glosario', t: k, i: 'book-open' })) : [];
  resultados = [...sec, ...alertas, ...glos];
  activo = 0;
  const caja = $('#q-res');
  if (!resultados.length) { caja.innerHTML = `<p class="vacio">${esc(T('buscar_vacio'))}</p>`; return; }
  let html = '', g = '';
  resultados.forEach((r, i) => {
    if (r.g !== g) { g = r.g; html += `<div class="q-grupo" role="presentation">${esc(T('buscar_grupo_' + g))}</div>`; }
    html += `<div class="q-item" role="option" id="q-${i}" aria-selected="${i === activo}" data-q="${i}">${ic(r.i)}<span>${esc(r.t)}</span></div>`;
  });
  caja.innerHTML = html;
  $('#q')?.setAttribute('aria-activedescendant', 'q-0');
}
function moverBusqueda(d) {
  if (!resultados.length) return;
  activo = (activo + d + resultados.length) % resultados.length;
  $$('.q-item').forEach((el, i) => el.setAttribute('aria-selected', i === activo));
  $('#q').setAttribute('aria-activedescendant', 'q-' + activo);
  $('#q-' + activo)?.scrollIntoView({ block: 'nearest' });
}
function elegirBusqueda(i) {
  const r = resultados[i]; if (!r) return;
  cerrarDialogo($('#dlg-buscar'));
  if (r.tab) return abrirAyuda(r.tab);
  if (r.caso) { UI.caso = r.caso; UI.panel = 'caso'; }
  if (location.hash === r.href) pintar(); else location.hash = r.href;
}

/* Cuenta atrás hasta el turno de las 08:00 (o turno en curso hasta las 14:30), en hora local. */
function textoReloj(ahora = new Date()) {
  const m = ahora.getHours() * 60 + ahora.getMinutes();
  if (m >= 8 * 60 && m < 14 * 60 + 30) return T('reloj_en_curso');
  const inicio = new Date(ahora); inicio.setHours(8, 0, 0, 0);
  if (m >= 8 * 60) inicio.setDate(inicio.getDate() + 1);
  const s = Math.max(0, Math.floor((inicio - ahora) / 1000));
  const hms = [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60].map((n) => String(n).padStart(2, '0')).join(':');
  return T('reloj_falta', { t: hms });
}

/* Ilustración de la portada: el analista de guardia, en claro o en oscuro según el tema.
   El aro del ojo se enciende al cargar y late mientras la portada está abierta.
   Decorativa (aria-hidden): la información está en el texto de la izquierda. */
function arteHtml() {
  return `<div class="p-arte" aria-hidden="true"><div class="p-fondo"><i class="p-ojo"></i></div></div>`;
}

let relojTimer = null;
function iniciarFlujo() {
  clearInterval(relojTimer); relojTimer = null;
  const reloj = $('#reloj');
  if (reloj) relojTimer = setInterval(() => { if (!document.contains(reloj)) { clearInterval(relojTimer); relojTimer = null; return; } reloj.textContent = textoReloj(); }, 1000);
}

/* ---------- Regleta del turno: la firma visual de Blue-Jr ----------
 * Una línea de tiempo de 08:00 a 14:30 con una marca por alerta. El tamaño dice la severidad,
 * el relleno dice si está cerrada y su nota; cada marca es un botón de 24 px que abre la alerta. */
const INI = 8 * 60, FIN = 14.5 * 60;
const posHora = (h) => { const [a, b] = h.split(':').map(Number); return ((a * 60 + b - INI) / (FIN - INI)) * 100; };
function regleta(t, compacta = false) {
  const horas = [8, 9, 10, 11, 12, 13, 14];
  const marcas = t.casos.map((c) => {
    const n = notaDe(c.id);
    const cls = n == null ? 'abierta' : n >= BJ.UMBRAL_APTO ? 'bien' : 'mal';
    const label = `${c.id} · ${c.hora} · ${T('sev.' + c.sev)} · ${L(c.titulo)} · ${n == null ? T('estado_abierta') : T('estado_cerrada', { n })}`;
    const act = !compacta && UI.caso === c.id ? ' aria-current="true"' : '';
    return compacta
      ? `<span class="marca s-${c.sev} ${cls}" style="left:${posHora(c.hora)}%" title="${esc(label)}"></span>`
      : `<button type="button" class="marca s-${c.sev} ${cls}" style="left:${posHora(c.hora)}%" data-caso="${c.id}" aria-label="${esc(label)}"${act}></button>`;
  }).join('');
  return `<div class="regleta${compacta ? ' compacta' : ''}"${compacta ? ' aria-hidden="true"' : ` role="group" aria-label="${esc(T('regleta'))}"`}><div class="eje">${horas.map((h) => `<span class="tick" style="left:${posHora(h + ':00')}%"><span class="num">${String(h).padStart(2, '0')}:00</span></span>`).join('')}</div>${marcas}</div>`;
}

/* ---------- Puesto de trabajo del turno ---------- */
function vTurno(id) {
  const t = turnoDe(id);
  if (!UI.caso || CASOS[UI.caso]?.turno !== id) UI.caso = (t.casos.find((c) => !cerrado(c.id)) || t.casos[0]).id;
  const r = BJ.resumenTurno(t, cerradas());
  const relevo = r.completo ? `<section class="relevo panel" aria-labelledby="relevo-t">
      <div class="relevo-cab"><h2 id="relevo-t">${ic(r.apto ? 'circle-check' : 'circle-x')}${esc(T('relevo_titulo'))}</h2><span class="estado ${r.apto ? 'ok' : 'ko'}">${esc(T('relevo_media', { n: r.media }))} · ${esc(r.apto ? T('apto') : T('no_apto', { n: BJ.UMBRAL_APTO }))}</span></div>
      <label class="campo">${esc(T('relevo'))}<textarea id="relevo" rows="3" maxlength="${BJ.LIMITES.relevo}" placeholder="${esc(T('relevo_ph'))}">${esc(S.relevos[id] || '')}</textarea></label>
      <div class="fila-der"><button type="button" class="btn" data-guardar-relevo="${id}">${ic('send')}${esc(T('guardar'))}</button></div></section>` : '';
  const paneles = ['cola', 'caso', 'ticket'];
  return cabecera(T('turno_ante', { n: numTurno(t), dia: diaDe(t).toUpperCase() }), 'siren', L(t.tema), '', `<span class="pildora num">${esc(T('progreso', { a: r.hechos, b: r.total }))}</span>`)
    // En pantallas estrechas las marcas quedarían a menos de 24 px: la regleta es solo visual y se navega con la cola.
    + `<div data-entra>${regleta(t, matchMedia('(max-width: 900px)').matches)}</div>`
    + relevo
    + `<div class="seg-movil" role="group" aria-label="${esc(T('paneles'))}">${paneles.map((p) => `<button type="button" data-panel="${p}" aria-pressed="${UI.panel === p}">${esc(T(p === 'cola' ? 'cola' : p === 'caso' ? 'caso' : 'ticket'))}</button>`).join('')}</div>`
    + `<div class="puesto" data-panel-activo="${UI.panel}">
        <section class="panel cola" data-entra aria-labelledby="cola-t"><h2 id="cola-t" class="panel-t">${ic('inbox')}${esc(T('cola'))}</h2><ol class="cola-lista">${t.casos.map(itemCola).join('')}</ol></section>
        <section class="panel caso" data-entra id="caso" aria-labelledby="caso-t">${panelCaso(CASOS[UI.caso])}</section>
        <section class="panel ticket" data-entra id="ticket" aria-labelledby="ticket-t">${panelTicket(CASOS[UI.caso])}</section>
      </div>`;
}

function lineasHtml(c, lineas = BJ.registros(c)) {
  const q = BJ.normalizar(UI.filtro);
  const ev = new Set(respuesta(c.id).evidencias);
  const bloqueado = cerrado(c.id);
  const vis = lineas.filter((l) => (!UI.fuente || l.s.replace(/^win-.*/, 'win') === UI.fuente) && (!q || BJ.normalizar(`${l.t} ${l.s} ${l.m}`).includes(q)));
  queueMicrotask(() => { const el = $('#cuenta-lineas'); if (el) el.textContent = T('registros_n', { a: vis.length, b: lineas.length }); });
  if (!vis.length) return `<p class="vacio">${esc(T('sin_lineas'))}</p>`;
  const marcar = (txt) => { const e = esc(txt); if (!q) return e; const i = e.toLowerCase().indexOf(esc(q)); return i < 0 ? e : e.slice(0, i) + '<mark>' + e.slice(i, i + esc(q).length) + '</mark>' + e.slice(i + esc(q).length); };
  return `<ol class="lineas">${vis.map((l) => `<li><button type="button" class="linea${ev.has(l.n) ? ' fijada' : ''}" data-linea="${l.n}" aria-pressed="${ev.has(l.n)}"${bloqueado ? ' disabled' : ''} title="${esc(ev.has(l.n) ? T('desfijar') : T('fijar'))}"><span class="l-t num">${l.t}</span><span class="l-s">${esc(l.s)}</span><span class="l-m">${marcar(l.m)}</span>${ev.has(l.n) ? ic('pin', 'l-pin') : ''}</button></li>`).join('')}</ol>`;
}

function resultadoHtml(c) {
  const res = BJ.corregir(c, S.respuestas[c.id]);
  const nombre = (k, v) => (v == null ? T('sin_respuesta') : T((k === 'veredicto' ? 'veredictos.' : 'acciones.') + v));

    let det = '';
    if (k.id === 'veredicto' || k.id === 'accion') det = k.puntos ? '' : `<small>${esc(T('tu_respuesta', { v: nombre(k.id, k.valor) }))} · ${esc(T('esperado', { v: nombre(k.id, k.esperado) }))}</small>`;
    if (k.id === 'campos') det = k.detalle.filter((d) => !d.ok).map((d) => `<small>${esc(L(d.label))}: ${esc(T('esperado', { v: d.esperado }))}</small>`).join('');
    if (k.id === 'ticket') det = `${k.largo ? '' : `<small>${esc(T('ticket_largo'))}: ${BJ.TICKET_MIN}</small>`}${k.citas ? '' : `<small>${esc(T('ticket_citas', { n: k.necesarias, claves: c.claves.join(', ') }))}</small>`}`;

}

/* ---------- Exportaciones ---------- */
function historialMd() {
  const h = BJ.historial(TURNOS, cerradas());
  const fecha = new Date().toLocaleDateString(locale(), { day: 'numeric', month: 'long', year: 'numeric' });
  const es = P.lang === 'es';
  const o = [];
  o.push(es ? '# Historial de turnos SOC · Blue-Jr' : '# SOC shift record · Blue-Jr', '');
  o.push(`**${S.perfil.nombre || (es ? 'Analista' : 'Analyst')}** · ${T('perfil_rol')} · ${fecha}`, '');
  o.push(`> ${es ? 'Simulación formativa de Blue-Jr con una empresa ficticia (Norte Logística). Las decisiones y los textos son del analista; la corrección es automática.' : 'Blue-Jr training simulation with a made-up company (Norte Logística). Decisions and texts are the analyst\'s; grading is automatic.'} ${REPO}`, '');
  o.push(`| ${T('kpi_tickets')} | ${T('kpi_media')} | ${T('kpi_veredicto')} | ${T('kpi_errores')} |`, '|---|---|---|---|', `| ${h.tickets}/${h.total} | ${h.media} | ${h.precisionVeredicto} % | ${h.cerradosPorError} |`, '');
  o.push(`## ${T('competencias_titulo')}`, '', `| ${es ? 'Competencia' : 'Competence'} | ${T('kpi_media')} | ${es ? 'Casos' : 'Cases'} |`, '|---|---|---|');
  for (const c of h.competencias) o.push(`| ${T('comp.' + c.id)} | ${c.media ?? '—'} | ${c.casos}/${c.total} |`);
  o.push('');
  for (const t of TURNOS) {
    const r = BJ.resumenTurno(t, cerradas());
    if (!r.hechos) continue;
    o.push(`## ${T('turno_n', { n: numTurno(t) })} · ${diaDe(t)} · ${L(t.tema)}`, '', `${T('progreso', { a: r.hechos, b: r.total })} · ${T('nota_media')} ${r.media}`, '');
    for (const c of t.casos.filter((x) => cerrado(x.id))) {
      const s = S.respuestas[c.id];
      const lineas = BJ.registros(c);
      o.push(`### ${c.id} · ${L(c.titulo)} · ${s.nota}/100`, '');
      o.push(`- ${T('veredicto')}: ${T('veredictos.' + s.veredicto)}`, `- ${T('accion')}: ${T('acciones.' + s.accion)}`);
      for (const f of BJ.camposDe(c)) if (s.campos[f.id]) o.push(`- ${L(f.label)}: \`${s.campos[f.id].replace(/`/g, "'")}\``);
      o.push('');
      if (s.ticket.trim()) o.push(...s.ticket.trim().split('\n').map((l) => '> ' + l), '');
      const ev = s.evidencias.map((n) => lineas.find((l) => l.n === n)).filter(Boolean);
      if (ev.length) o.push('```text', ...ev.map((l) => `${l.t} ${l.s} ${l.m}`), '```', '');
      // Los mensajes completos también cuentan en una entrevista: cómo lo comunicaste.
      const m = S.mensajes[c.id];
      for (const tipo of BJ.TIPOS_MENSAJE) if (m?.ok?.includes(tipo) && m[tipo]?.trim()) o.push(`**${T('com_tipo.' + tipo)}**`, '', ...m[tipo].trim().split('\n').map((l) => '> ' + l), '');
    }
    if (S.relevos[t.id]) o.push(`**${T('relevo')}**`, '', ...S.relevos[t.id].trim().split('\n').map((l) => '> ' + l), '');
  }
  return o.join('\n');
}
/* ===== 04b-entreno.js ===== */
/* Entrenador: lo que convierte el simulador en práctica diaria.
 * Guía de investigación por familia de alertas (como las de Elastic Security), entidades para pivotar
 * (como los «campos interesantes» de Splunk), tareas del incidente (como en Sentinel), el árbol
 * «¿escalo o no?» y la práctica diaria: XP, racha, nivel e insignias, derivados de los tickets. */

const GUIAS = DATOS.guias;
const FAMILIA = Object.fromEntries(GUIAS.familias.flatMap((f) => f.casos.map((id) => [id, f])));
const hoyLocal = () => new Date().toISOString().slice(0, 10);
const progresoActual = () => BJ.progreso(entradasXp(), hoyLocal());

/* ---------- Guía de investigación ---------- */
const GUIA_TABS = [['triaje', 'list-checks'], ['analisis', 'search'], ['respuesta', 'split']];
function guiaHtml(c) {
  const f = FAMILIA[c.id];
  if (!f) return '';

  if (UI.guia === null) UI.guia = Object.values(S.respuestas).filter((r) => r.cerrado).length < 3;
  const lista = (xs, tag = 'ul') => `<${tag}>${xs.map((x) => `<li>${esc(L(x))}</li>`).join('')}</${tag}>`;
  const minus = (t) => t.charAt(0).toLowerCase() + t.slice(1);
  const resp = f.respuesta.map((r) => `<li><span class="g-si">${esc(T('guia_si'))} ${esc(minus(L(r.si)))}</span>
      <span class="g-entonces">${ic('chevron-right')}<b class="acc acc-${r.accion}">${esc(T('acciones.' + r.accion))}</b></span>
      <span class="g-porque">${esc(L(r.porque))}</span></li>`).join('');
  return `<details class="guia" id="guia"${UI.guia ? ' open' : ''}>
      <summary>${ic('compass')}<span><b>${esc(T('guia_titulo'))}</b><small>${esc(L(f.titulo))} · ${esc(T('guia_sub'))}</small></span>${ic('chevron-right', 'g-flecha')}</summary>
      <div class="guia-cuerpo">
        <p class="g-que">${esc(L(f.que))}</p>
        <div class="g-tabs" role="group" aria-label="${esc(T('guia_titulo'))}">${GUIA_TABS.map(([k, icono]) => `<button type="button" data-guia-tab="${k}" aria-pressed="${UI.guiaTab === k}">${ic(icono)}${esc(T('guia_tab.' + k))}</button>`).join('')}</div>
        <div class="g-panel">${UI.guiaTab === 'triaje' ? `<h3>${ic('list-checks')}${esc(T('guia_triaje'))}</h3>${lista(f.triaje, 'ol')}<h3>${ic('lightbulb')}${esc(T('guia_fp'))}</h3>${lista(f.fp)}`
          : UI.guiaTab === 'analisis' ? `<h3>${ic('search')}${esc(T('guia_analisis'))}</h3>${lista(f.analisis, 'ol')}`
          : `<h3>${ic('split')}${esc(T('guia_respuesta'))}</h3><ul class="g-resp">${resp}</ul>`}</div>
        <p class="nota">${esc(T('guia_nota'))} <button type="button" class="enlace" data-decidir-abrir>${esc(T('decidir_btn'))}</button></p>
      </div>
    </details>`;
}

/* ---------- Entidades para pivotar ---------- */
function entidadesHtml(lineas) {

/* ---------- Tareas del incidente ---------- */
function tareasDe(c) {
  const r = respuesta(c.id);
  const campos = BJ.camposDe(c);
  return [
    ['investigar', UI.investigado.has(c.id)],
    ['evidencia', r.evidencias.length > 0],
    ['veredicto', !!r.veredicto],
    ['accion', !!r.accion],
    ['datos', campos.every((f) => String(r.campos[f.id] || '').trim())],
    ['ticket', r.ticket.trim().length >= BJ.TICKET_MIN]
  ];
}
function tareasHtml(c) {
  const t = tareasDe(c);
  const hechas = t.filter(([, ok]) => ok).length;
  return `<div class="tareas" id="tareas"><p class="etq">${ic('list-checks')}${esc(T('tareas'))} <span class="num">${esc(T('tareas_n', { a: hechas, b: t.length }))}</span></p>
      <div class="barra-prog fina" aria-hidden="true"><i style="width:${(hechas / t.length) * 100}%"></i></div>
      <ul>${t.map(([k, ok]) => `<li class="${ok ? 'hecha' : ''}">${ic(ok ? 'circle-check' : 'circle')}<span>${esc(T('tarea.' + k, { m: BJ.TICKET_MIN }))}</span><span class="sr-only">${esc(ok ? T('hecha') : T('pendiente'))}</span></li>`).join('')}</ul></div>`;
}
function actualizarTareas() { const el = $('#tareas'); if (el && UI.caso && !cerrado(UI.caso)) el.outerHTML = tareasHtml(CASOS[UI.caso]); }

/* ---------- ¿Escalo o no? Árbol de decisión ---------- */
// Cada paso es una pregunta; cada respuesta lleva a otra pregunta o a un resultado.
const ARBOL = {
  malicioso: { si: 'efecto', no: 'real' },
  real: { si: '=benigno', no: '=fp' },
  efecto: { si: 'compromiso', no: '=bloqueado' },
  compromiso: { si: '=contener', no: '=escalar' }
};
let camino = [];
function decidirHtml() {
  const D = GUIAS.decision;
  let paso = 'malicioso';
  const hechos = camino.map((resp) => { const p = paso; paso = ARBOL[p][resp]; return [p, resp]; });
  const preguntas = hechos.map(([p, resp]) => `<li class="d-hecha"><span>${esc(L(D.preguntas[p]))}</span><b>${esc(T(resp === 'si' ? 'decidir_si' : 'decidir_no'))}</b></li>`).join('');
  let actual;
  if (paso.startsWith('=')) {
    const res = D.resultados[paso.slice(1)];
    actual = `<div class="d-res" role="status"><p class="etq">${esc(T('decidir_resultado'))}</p>
        <p class="d-par"><span class="pildora">${esc(T('veredictos.' + res.veredicto))}</span><b class="acc acc-${res.accion}">${esc(T('acciones.' + res.accion))}</b></p>
        <p>${esc(L(res))}</p><p class="nota"><b>${esc(T('decidir_ejemplo'))}:</b> ${esc(L(res.ejemplo))}</p>
        <button type="button" class="btn sec peq" data-decidir="reset">${ic('rotate-ccw')}${esc(T('decidir_otra'))}</button></div>`;
  } else {
    const q = D.preguntas[paso];
    actual = `<div class="d-preg"><p class="etq">${esc(T('decidir_paso', { n: camino.length + 1 }))}</p><p class="d-q" id="d-q">${esc(L(q))}</p><p class="nota">${esc(L(q.ayuda))}</p>

function anillo(pct) {
  const r = 26, c = 2 * Math.PI * r;
  return `<svg class="anillo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" class="a-fondo"/><circle cx="32" cy="32" r="${r}" class="a-valor" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - Math.min(1, pct))).toFixed(1)}"/></svg>`;
}
function siguienteAlerta() {
  const casos = TURNOS.flatMap((t) => t.casos);
  const pendiente = casos.find((c) => !cerrado(c.id));

  const peor = [...casos].sort((a, b) => notaDe(a.id) - notaDe(b.id))[0];
  return { c: peor, repaso: true };
}

/* ---------- Avisos de XP al cerrar un ticket ---------- */
function avisosXp(antes, despues, id, nota, texto) {
  avisar(texto || T('xp_ganado', { x: nota, n: nota, id }), 'zap');
  if (despues.nivelN > antes.nivelN) avisar(T('subes', { n: T('niveles.' + despues.nivel) }), 'trophy');
  if (antes.xpHoy < despues.meta && despues.xpHoy >= despues.meta) avisar(T('meta_cumplida'), 'circle-check');
  if (despues.racha > antes.racha && despues.racha > 1) avisar(T('racha_aviso', { n: despues.racha }), 'flame');
}
/* ===== 04c-revision.js ===== */
/* Revisión del agente de IA (nivel 1,5) y triaje rápido diario.
 * La revisión entrena el trabajo que la IA está dejando al nivel 1: auditar veredictos ajenos.
 * El triaje rápido es el hábito diario: diez alertas ya vistas, decididas en segundos, con repaso espaciado. */

const REVISION = DATOS.revision;
const REV = Object.fromEntries(REVISION.casos.map((c) => [c.id, c]));
const MOTIVOS = BJ.ERRORES_IA;
const revResp = (id) => S.revisiones[id] || (S.revisiones[id] = { dictamen: null, motivo: null, accion: null, cuando: null });
const revCerrada = (id) => S.revisiones[id]?.cerrado === true;

/* XP y racha cuentan toda la práctica: tickets, revisiones y la primera ronda diaria del triaje rápido. */
function entradasXp() {
  const rapido = Object.entries(S.rapido).map(([d, x]) => ({ nota: x.aciertos * BJ.XP_RAPIDO, cuando: d + 'T12:00:00Z' }));
  // Cada pregunta al N2 resta XP a su ticket (nunca nota); cada mensaje completo suma.
  const tickets = Object.entries(S.respuestas).map(([id, x]) => (typeof x.nota === 'number' ? { nota: Math.max(0, x.nota - BJ.COSTE_N2 * (S.n2[id]?.length || 0)), cuando: x.cuando } : x));
  const mensajes = Object.values(S.mensajes).flatMap((m) => (m.ok || []).map(() => ({ nota: BJ.XP_MENSAJE, cuando: m.cuando })));
  const defensas = Object.values(S.defensas).filter((d) => d.ok?.length === BJ.PREGUNTAS_DEF.length).map((d) => ({ nota: BJ.XP_DEFENSA, cuando: d.cuando }));
  return [...tickets, ...Object.values(S.revisiones), ...rapido, ...mensajes, ...defensas];
}
const cazados = () => REVISION.casos.filter((c) => c.error !== null && revCerrada(c.id) && S.revisiones[c.id].dictamen === 'rechazar').length;
const rapidoPerfecto = () => Object.values(S.rapido).some((x) => x.total === BJ.RAPIDO_N && x.aciertos === x.total);

}

/* ---------- Vista: triaje rápido ---------- */
function nuevaRonda() {
  const casos = TURNOS.flatMap((t) => t.casos);
  const lista = BJ.sesionRapida(casos, cerradas(), S.repaso, hoyLocal()).map((c) => c.id);

  UI.rapido = { lista, repaso: lista.filter((id) => S.repaso[id]), i: 0, aciertos: 0, fallos: [], respuesta: null, t0: Date.now(), ms: 0, fin: false };
}
function vRapido() {
  const disponibles = Object.values(cerradas()).length;

  if (!UI.rapido) nuevaRonda();

      <div class="logs rap-logs" tabindex="0" role="region" aria-label="${esc(T('registros'))}">${lineasLectura(c.logs.map(([t, s, m]) => ({ t, s, m })))}</div>

      ${resp ? `<div class="rap-fb ${resp === c.accion ? 'ok' : 'ko'}" role="status">${ic(resp === c.accion ? 'circle-check' : 'circle-x')}<div><b>${esc(resp === c.accion ? T('rap_bien') : T('rap_mal', { a: T('acciones.' + c.accion) }))}</b><p>${esc(primera(L(c.explica)))}</p></div>
        <button type="button" class="btn" data-rapido-sig>${esc(R.i + 1 < R.lista.length ? T('siguiente') : T('rap_ver'))}${ic('chevron-right')}<kbd>↵</kbd></button></div>` : ''}
    </section>`;
}
function resumenRapido() {
  const R = UI.rapido;

  const primera = S.rapido[hoy];

function responderRapido(a) {

const msgDe = (id) => S.mensajes[id] || (S.mensajes[id] = { ok: [], cuando: null });
const preguntasDe = (id) => S.n2[id] || [];
const preguntasTurno = (turnoId) => turnoDe(turnoId).casos.reduce((a, c) => a + preguntasDe(c.id).length, 0);
const mensajesCompletos = () => Object.values(S.mensajes).reduce((a, m) => a + (m.ok?.length || 0), 0);

      <label class="campo"><span class="sr-only">${esc(T('com_tipo.' + tipo))}</span><textarea id="msg-texto" rows="5" maxlength="${BJ.LIMITES.ticket}" placeholder="${esc(T('com_ph.' + tipo))}">${esc(texto)}</textarea><small class="num" id="msg-palabras">${esc(T('com_palabras', { n: (texto.trim().match(/\S+/g) || []).length }))}</small></label>

      ${lista}${res && res.completo ? `<p class="msg-ok">${ic('circle-check')}${esc(T('com_ok'))}</p>` : ''}
    </section>`;
}
function revisarMensaje() {
  const c = CASOS[UI.caso]; const tipo = UI.msgTipo; const m = msgDe(c.id);
  m[tipo] = $('#msg-texto').value.slice(0, BJ.LIMITES.ticket);

/* ---------- Pregunta al N2 ---------- */
function n2Html(c) {
  const hechas = preguntasDe(c.id);
  const quedan = Math.max(0, BJ.LIMITE_N2 - preguntasTurno(c.turno));
  const respuesta = (x) => {
    if (x.tipo === 'inicio') { const p = BJ.pistaN2('inicio', c); return T('n2_r.inicio', { f: p.fuente, h: p.hora }); }
    if (x.tipo === 'falta') return x.campos.length ? T('n2_r.falta', { c: x.campos.map((id) => L(BJ.camposDe(c).find((f) => f.id === id)?.label)).join(', ') }) : T('n2_r.falta_ok');

  };
  return `<section class="n2" aria-labelledby="n2-t">

    </section>`;
}
function preguntarN2(tipo) {
  const c = CASOS[UI.caso];
  if (cerrado(c.id) || preguntasTurno(c.turno) >= BJ.LIMITE_N2 || preguntasDe(c.id).some((x) => x.tipo === tipo)) return;

/** Texto de la pregunta según lo que se decidió: defender la decisión o reconocer el error. */
function textoPregunta(p, c) {
  if (p.modo === 'error') return T('def_q.error', { id: c.id, tu: nombreDecision(p.id, p.tu), que: T('def_que.' + p.id), sol: nombreDecision(p.id, p.sol) });
  if (p.id === 'veredicto') return T('def_q.veredicto', { id: c.id, tu: nombreDecision('veredicto', p.tu), alt: nombreDecision('veredicto', p.alt) });
  if (p.id === 'accion') return T('def_q.accion.' + p.tu);
  return T('def_q.evidencia');
}

      <button type="button" class="btn sec com-revisar" data-def-revisar>${ic('list-checks')}${esc(T('def_revisar'))}</button>
      <details class="com-ej"><summary>${esc(T('def_ejemplo'))}</summary><p>${esc(BJ.modeloDefensa(p, c, P.lang))}</p></details>
      ${lista}${res && res.completo ? `<p class="msg-ok">${ic('circle-check')}${esc(T('def_ok'))}</p>` : ''}
      <div class="def-pie"><span class="nota num">${esc(T('def_hecha', { n: (d.ok || []).length }))}</span><button type="button" class="btn sec" data-star="${c.id}">${ic('star')}${esc(T('star_uno'))}</button></div>

}
function revisarDefensa() {
  const c = CASOS[UI.caso];
  const p = BJ.preguntasDefensa(c, S.respuestas[c.id]).find((x) => x.id === UI.defP);
  if (!p) return;
  const d = defensaDe(c.id);
  d[p.id] = $('#def-texto').value.slice(0, BJ.LIMITES.ticket);
  const res = BJ.corregirDefensa(p, d[p.id], c);
  const antes = progresoActual();
  const completaAntes = d.ok.length === BJ.PREGUNTAS_DEF.length;
  d.ok = res.completo ? [...new Set([...d.ok, p.id])] : d.ok.filter((x) => x !== p.id);
  const completa = d.ok.length === BJ.PREGUNTAS_DEF.length;
  if (completa && !completaAntes) d.cuando = new Date().toISOString();
  UI.defRevisado = `${c.id}:${p.id}`;
  guardar();
  repintarDefiende();
  if (completa && !completaAntes) avisosXp(antes, progresoActual(), '', 0, T('xp_def', { n: BJ.XP_DEFENSA, id: c.id }));
}

  const r = respuesta(c.id);
  if (!r.veredicto || !r.accion) return;
  const antes = progresoActual();
  r.cerrado = true;
  r.cuando = new Date().toISOString();
  r.nota = BJ.corregir(c, r).nota;
  guardar();
  const scroll = scrollY;
  pintar();
  scrollTo(0, scroll);
  // La XP del ticket descuenta lo que costaron las preguntas al N2; la nota no cambia.
  avisosXp(antes, progresoActual(), c.id, r.nota, T('xp_ganado', { x: Math.max(0, r.nota - BJ.COSTE_N2 * (S.n2[c.id]?.length || 0)), n: r.nota, id: c.id }));
  UI.panel = 'ticket';
  $('.puesto')?.setAttribute('data-panel-activo', 'ticket');
  $$('[data-panel]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.panel === 'ticket'));
  $('#resultado')?.focus({ preventScroll: true });
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button, a');
  if (!b) { if (e.target.tagName === 'DIALOG') cerrarDialogo(e.target); return; }
  const d = b.dataset;
  if ('cerrarDlg' in d) return cerrarDialogo(b.closest('dialog'));
  if ('ayuda' in d) return abrirAyuda();
  if ('buscar' in d) return abrirBusqueda();
  if ('perfil' in d) return abrirPerfil();
  if (d.tab) { tabAyuda = d.tab; pintarAyuda(); return $('#tab-' + d.tab).focus(); }
  if (d.lang) { P.lang = d.lang; guardarPrefs(); return pintar(); }
  if ('tema' in d) { P.theme = temaActual() === 'dark' ? 'light' : 'dark'; guardarPrefs(); aplicarTema(); return b.setAttribute('aria-checked', temaActual() === 'dark'); }
  if (d.accentPick) { P.accent = d.accentPick; guardarPrefs(); aplicarTema(); return $$('[data-accent-pick]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.accentPick === P.accent)); }
  if ('alternarLateral' in d) return alternarLateral(b);
  if (d.q !== undefined) return elegirBusqueda(+d.q);
  if (d.casoIr) { UI.caso = d.casoIr; return; }
  if (d.caso) return abrirCaso(d.caso);
  if (d.panel) { UI.panel = d.panel; $('.puesto').setAttribute('data-panel-activo', d.panel); return $$('[data-panel]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.panel === d.panel)); }
  if (d.pivote !== undefined) {
    UI.filtro = UI.filtro === d.pivote ? '' : d.pivote; UI.investigado.add(UI.caso);
    $('#filtro').value = UI.filtro;
    $$('[data-pivote]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.pivote === UI.filtro));
    pintarLineas(); return actualizarTareas();
  }
  if (d.msgTipo) { UI.msgTipo = d.msgTipo; repintarComunica(); return $(`[data-msg-tipo="${d.msgTipo}"]`)?.focus(); }
  if ('msgRevisar' in d) return revisarMensaje();
  if (d.n2) return preguntarN2(d.n2);
  if (d.rev) return abrirRev(d.rev);
  if (d.dictamen || d.motivo || d.raccion) {
    const k = d.dictamen ? 'dictamen' : d.motivo ? 'motivo' : 'raccion';
    const r = revResp(UI.rev); r[k === 'raccion' ? 'accion' : k] = d[k]; guardar();
    $('#rinforme').innerHTML = panelInforme(REV[UI.rev]);
    return $(`[data-${k}="${d[k]}"]`)?.focus();
  }
  if ('enviarRev' in d) return enviarRevision();
  if (d.revRepetir) { const r = revResp(d.revRepetir); delete r.cerrado; delete r.nota; guardar(); $('#rinforme').innerHTML = panelInforme(REV[d.revRepetir]); pintarLateral(); return $('[data-dictamen]')?.focus(); }
  if (d.rapido) return responderRapido(d.rapido);
  if ('rapidoSig' in d) return siguienteRapido();
  if ('rapidoOtra' in d) { nuevaRonda(); repintarRapido(); return $('[data-rapido]')?.focus(); }
  if (d.guiaTab) { UI.guiaTab = d.guiaTab; const g = $('#guia'); g.outerHTML = guiaHtml(CASOS[UI.caso]); return $(`[data-guia-tab="${d.guiaTab}"]`)?.focus(); }
  if ('decidirAbrir' in d) { camino = []; return abrirAyuda('decidir'); }
  if (d.decidir) {
    camino = d.decidir === 'reset' ? [] : [...camino, d.decidir];
    $('#panel-ayuda').innerHTML = decidirHtml();
    return ($('#panel-ayuda [data-decidir="si"]') || $('#panel-ayuda [data-decidir="reset"]'))?.focus();
  }
  if (d.fuente !== undefined) { UI.investigado.add(UI.caso); UI.fuente = d.fuente || null; $$('.chips [data-fuente]').forEach((x) => x.setAttribute('aria-pressed', (x.dataset.fuente || null) === UI.fuente)); return pintarLineas(); }
  if (d.linea !== undefined) {
    const r = respuesta(UI.caso); const n = +d.linea;
    r.evidencias = r.evidencias.includes(n) ? r.evidencias.filter((x) => x !== n) : [...r.evidencias, n].slice(0, BJ.LIMITES.evidencias);
    guardar(); pintarLineas(); pintarTicket();
    return $(`[data-linea="${n}"]`)?.focus();
  }
  if (d.veredicto || d.accion) {
    const k = d.veredicto ? 'veredicto' : 'accion';
    respuesta(UI.caso)[k] = d[k]; guardar(); pintarTicket();
    return $(`[data-${k}="${d[k]}"]`)?.focus();
  }
  if ('cerrarTicket' in d) return cerrarTicket();
  if (d.reintentar) {
    // La entrevista depende de lo que se decidió: al reabrir el ticket, se empieza de cero.
    const r = respuesta(d.reintentar); delete r.cerrado; delete r.nota; delete S.defensas[d.reintentar]; guardar();
    pintar(); return $('[data-veredicto]')?.focus();
  }
  if (d.guardarRelevo) { S.relevos[d.guardarRelevo] = $('#relevo').value.slice(0, BJ.LIMITES.relevo); guardar(); return avisar(T('relevo_guardado')); }
  if ('exportarMd' in d) return descargar(`bluejr-historial-${new Date().toISOString().slice(0, 10)}.md`, historialMd(), 'text/markdown;charset=utf-8');
  if ('exportarJson' in d) return descargar(`bluejr-copia-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: 'bluejr', version: VERSION, ...S }, null, 2), 'application/json');
  if (d.defP) { UI.defP = d.defP; UI.defRevisado = null; repintarDefiende(); return $(`[data-def-p="${d.defP}"]`)?.focus(); }
  if ('defRevisar' in d) return revisarDefensa();
  if (d.star) return exportarStar([d.star]);
  if ('starTodas' in d) return exportarStar(Object.keys(CASOS).filter(cerrado));
  if ('imprimir' in d) return imprimirHistorial();
  if ('importar' in d) return $('#archivo').click();
  if ('borrar' in d) {
    if (!UI.borrarArmado) { UI.borrarArmado = true; b.lastChild.textContent = T('borrar_confirmar'); setTimeout(() => { UI.borrarArmado = false; if (document.contains(b)) b.lastChild.textContent = T('borrar'); }, 4000); return; }
    UI.borrarArmado = false; S = BJ.sanearEstado(null, CASOS, REV_INDICE); UI.rapido = null; guardar(); pintar(); return avisar(T('borrado'));
  }
});

function alternarLateral(b = $('[data-alternar-lateral]')) {
  P.lateral = !P.lateral; guardarPrefs();
  document.body.classList.toggle('lateral-compacto', !P.lateral);
  b?.setAttribute('aria-expanded', P.lateral);
  setTimeout(MOV.indicador, 320);
}

/* Desde el historial, el enlace de un ticket abre su turno con esa alerta seleccionada. */
document.addEventListener('click', (e) => { const a = e.target.closest('[data-caso-ir]'); if (a) UI.caso = a.dataset.casoIr; }, true);

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'q') return buscar(t.value);
  if (t.id === 'filtro') {
    UI.filtro = t.value; if (t.value.trim()) UI.investigado.add(UI.caso);
    $$('[data-pivote]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.pivote === UI.filtro));
    pintarLineas(); return actualizarTareas();
  }
  if (t.dataset.campo) { respuesta(UI.caso).campos[t.dataset.campo] = t.value.slice(0, BJ.LIMITES.campo); guardar(); return actualizarTareas(); }
  if (t.id === 'def-texto') { defensaDe(UI.caso)[UI.defP] = t.value.slice(0, BJ.LIMITES.ticket); guardar(); $('#def-palabras').textContent = T('com_palabras', { n: (t.value.trim().match(/\S+/g) || []).length }); return; }
  if (t.id === 'msg-texto') { msgDe(UI.caso)[UI.msgTipo] = t.value.slice(0, BJ.LIMITES.ticket); guardar(); $('#msg-palabras').textContent = T('com_palabras', { n: (t.value.trim().match(/\S+/g) || []).length }); return; }
  if (t.id === 'texto-ticket') { respuesta(UI.caso).ticket = t.value.slice(0, BJ.LIMITES.ticket); guardar(); $('#cuenta-ticket').textContent = T('caracteres', { n: t.value.trim().length, m: BJ.TICKET_MIN }); actualizarTareas(); }
});

document.addEventListener('submit', (e) => {
  if (e.target.id === 'f-perfil') { S.perfil.nombre = String(new FormData(e.target).get('nombre') || '').trim().slice(0, BJ.LIMITES.nombre); guardar(); pintarLateral(); }
});

$('#archivo').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  if (f.size > 2 * 1024 * 1024) return avisar(T('import_error'));
  const r = BJ.safeParse(await f.text());
  if (!r.ok || !r.valor || r.valor.app !== 'bluejr') return avisar(T('import_error'));
  S = BJ.sanearEstado(r.valor, CASOS, REV_INDICE); UI.rapido = null; guardar(); pintar();
  avisar(T('importado', { n: Object.values(S.respuestas).filter((x) => x.cerrado).length }));
});

document.addEventListener('keydown', (e) => {
  const enCampo = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return abrirBusqueda(); }
  if (e.target.id === 'q') {
    if (e.key === 'ArrowDown') { e.preventDefault(); return moverBusqueda(1); }
    if (e.key === 'ArrowUp') { e.preventDefault(); return moverBusqueda(-1); }
    if (e.key === 'Enter') { e.preventDefault(); return elegirBusqueda(activo); }
  }
  // Pestañas de la ayuda: flechas, Inicio y Fin.
  if (e.target.getAttribute('role') === 'tab' && ['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(e.key)) {
    e.preventDefault();
    const i = TABS.indexOf(tabAyuda);
    tabAyuda = TABS[e.key === 'Home' ? 0 : e.key === 'End' ? TABS.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + TABS.length) % TABS.length];
    pintarAyuda(); return $('#tab-' + tabAyuda).focus();
  }
  // Grupos de radio (veredicto y acción): flechas para moverse y elegir.
  if (e.target.getAttribute('role') === 'radio' && (e.target.dataset.veredicto || e.target.dataset.accion) && ['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp'].includes(e.key)) {
    e.preventDefault();
    const k = e.target.dataset.veredicto ? 'veredicto' : 'accion';
    const lista = k === 'veredicto' ? BJ.VEREDICTOS : BJ.ACCIONES;
    const i = lista.indexOf(e.target.dataset[k]);
    const v = lista[(i + (['ArrowRight', 'ArrowDown'].includes(e.key) ? 1 : -1) + lista.length) % lista.length];
    respuesta(UI.caso)[k] = v; guardar(); pintarTicket();
    return $(`[data-${k}="${v}"]`)?.focus();
  }
  if (e.target.getAttribute('role') === 'radio' && ['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp'].includes(e.key)) {
    const k = ['dictamen', 'motivo', 'raccion'].find((x) => e.target.dataset[x]);
    if (k) {
      e.preventDefault();
      const lista = k === 'dictamen' ? BJ.DICTAMENES : k === 'motivo' ? BJ.ERRORES_IA : BJ.ACCIONES;
      const v = lista[(lista.indexOf(e.target.dataset[k]) + (['ArrowRight', 'ArrowDown'].includes(e.key) ? 1 : -1) + lista.length) % lista.length];
      const r = revResp(UI.rev); r[k === 'raccion' ? 'accion' : k] = v; guardar();
      $('#rinforme').innerHTML = panelInforme(REV[UI.rev]);
      return $(`[data-${k}="${v}"]`)?.focus();
    }
  }
  if (enCampo || e.ctrlKey || e.metaKey || e.altKey || document.querySelector('dialog[open]')) return;
  if (ruta().vista === 'rapido' && UI.rapido && !UI.rapido.fin) {
    if (['1', '2', '3'].includes(e.key) && !UI.rapido.respuesta) { e.preventDefault(); return responderRapido(BJ.ACCIONES[+e.key - 1]); }
    if (e.key === 'Enter' && UI.rapido.respuesta && !e.target.closest('button, a')) { e.preventDefault(); return siguienteRapido(); }
  }
  if (e.key === '?') { e.preventDefault(); return abrirAyuda(); }
  if (e.key === '[' && matchMedia('(min-width: 901px)').matches) { e.preventDefault(); return alternarLateral(); }
  if (e.key === '/' && $('#filtro')) { e.preventDefault(); return $('#filtro').focus(); }
  if ((e.key === 'j' || e.key === 'k') && ruta().vista === 'turno') {
    const casos = turnoDe(ruta().turno).casos;
    const i = casos.findIndex((c) => c.id === UI.caso);
    const sig = casos[Math.min(casos.length - 1, Math.max(0, i + (e.key === 'j' ? 1 : -1)))];
    if (sig) { abrirCaso(sig.id, false); $(`.cola-item[data-caso="${sig.id}"]`)?.focus(); }
  }
});

document.addEventListener('toggle', (e) => { if (e.target.id === 'guia') UI.guia = e.target.open; }, true);

addEventListener('hashchange', () => { pintar(); $('#main').focus({ preventScroll: true }); scrollTo(0, 0); });
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', () => { if (!P.theme) pintar(); });
matchMedia('(max-width: 900px)').addEventListener?.('change', () => { if (ruta().vista === 'turno') pintar(); });

if (TEST) window.__BJ__ = { S: () => S, UI, CASOS, BJ, pintar };
pintar();
// Tras la primera carga, el lateral ya no repite su entrada al repintarse.
setTimeout(() => document.body.classList.add('ya-cargado'), 700);
</script>
</body>
